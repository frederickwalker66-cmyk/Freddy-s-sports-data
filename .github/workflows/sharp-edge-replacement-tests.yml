name: Sharp Edge Replacement Tests

on:
  push:
    paths:
      - 'research/sharp_edge_replacements.py'
      - 'tests/test_sharp_edge_replacements.py'
      - '.github/workflows/sharp-edge-replacement-tests.yml'
  pull_request:
    paths:
      - 'research/sharp_edge_replacements.py'
      - 'tests/test_sharp_edge_replacements.py'
      - '.github/workflows/sharp-edge-replacement-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pytest
        run: python -m pip install pytest
      - name: Validate replacement tests
        run: python -m pytest -q tests/test_sharp_edge_replacements.py

name: SportsDataIO NBA schedule smoke test (research only)
on:
  workflow_dispatch:
  # One automatically triggered post-merge verification when this workflow or
  # the parser changes. This does not run SharpAPI or spend sportsbook credits.
  push:
    branches: [main]
    paths:
      - '.github/workflows/sportsdataio-connection-test.yml'
      - 'challenger_sportsdataio_nba_schedule.py'
permissions:
  contents: read
jobs:
  smoke-test-nba:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      SPORTSDATAIO_API_KEY: ${{ secrets.Sportsdataio || secrets.SPORTSDATAIO_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate NBA parser against live provider with safely redacted report
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p nba_schedule_diagnostic
          day_et="$(TZ=America/New_York date +%F)"
          python challenger_sportsdataio_nba_schedule.py \
            --probe-day "$day_et" \
            --output nba_schedule_diagnostic/report.json
      - name: Archive source diagnostics regardless of provider availability
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sportsdataio-nba-smoke-${{ github.run_id }}
          path: nba_schedule_diagnostic/
          retention-days: 30
          if-no-files-found: warn

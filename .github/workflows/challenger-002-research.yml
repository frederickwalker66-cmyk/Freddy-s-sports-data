      - "tests/test_challenger_002_research_pipeline.py"
      - "tests/test_challenger_002_authenticated_intake.py"
      - "tests/test_challenger_002_certification_readiness.py"
      - "tests/test_challenger_002_dataset_audit.py"
      - "tests/test_challenger_002_pregame_gate.py"
      - "tests/test_challenger_002_artifact_pair_audit.py"
      - "tests/test_challenger_002_nba_schema_profile.py"
      - "tests/test_challenger_002_nba_research_join.py"
      - "tests/test_challenger_002_nba_temporal_audit.py"
      - "tests/test_challenger_002_nba_odds_schema.py"
      - "tests/test_challenger_002_nba_sportsbook_audit.py"
      - ".github/workflows/challenger-002-research.yml"
  push:
    branches: [main]
    paths:
      - "research/challenger_002_baseline.py"
      - "research/challenger_002_source_validation.py"
      - "research/challenger_002_receipt_verification.py"
      - "research/challenger_002_research_pipeline.py"
      - "research/challenger_002_authenticated_intake.py"
      - "research/challenger_002_nba_source_integrity.py"
      - "research/challenger_002_certification_readiness.py"
      - "research/challenger_002_dataset_audit.py"
      - "research/challenger_002_pregame_gate.py"
      - "research/challenger_002_artifact_pair_audit.py"
      - "research/challenger_002_nba_schema_profile.py"
      - "research/challenger_002_nba_research_join.py"
      - "research/challenger_002_nba_temporal_audit.py"
      - "research/challenger_002_nba_odds_schema.py"
      - "research/challenger_002_nba_sportsbook_audit.py"
      - "research/CHALLENGER_002_README.md"
      - "tests/test_challenger_002_baseline.py"
      - "tests/test_challenger_002_source_validation.py"
      - "tests/test_challenger_002_receipt_verification.py"
      - "tests/test_challenger_002_research_pipeline.py"
      - "tests/test_challenger_002_authenticated_intake.py"
      - "tests/test_challenger_002_certification_readiness.py"
      - "tests/test_challenger_002_dataset_audit.py"
      - "tests/test_challenger_002_pregame_gate.py"
      - "tests/test_challenger_002_artifact_pair_audit.py"
      - "tests/test_challenger_002_nba_schema_profile.py"
      - "tests/test_challenger_002_nba_research_join.py"
      - "tests/test_challenger_002_nba_temporal_audit.py"
      - "tests/test_challenger_002_nba_odds_schema.py"
      - "tests/test_challenger_002_nba_sportsbook_audit.py"
      - ".github/workflows/challenger-002-research.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile research module and tests
        run: python -m py_compile research/challenger_002_baseline.py research/challenger_002_source_validation.py research/challenger_002_receipt_verification.py research/challenger_002_research_pipeline.py research/challenger_002_authenticated_intake.py research/challenger_002_dataset_audit.py research/challenger_002_pregame_gate.py research/challenger_002_artifact_pair_audit.py research/challenger_002_nba_schema_profile.py research/challenger_002_nba_research_join.py research/challenger_002_nba_temporal_audit.py research/challenger_002_nba_odds_schema.py research/challenger_002_nba_sportsbook_audit.py tests/test_challenger_002_nba_sportsbook_audit.py tests/test_challenger_002_nba_odds_schema.py tests/test_challenger_002_nba_temporal_audit.py tests/test_challenger_002_nba_schema_profile.py tests/test_challenger_002_nba_research_join.py tests/test_challenger_002_artifact_pair_audit.py tests/test_challenger_002_dataset_audit.py tests/test_challenger_002_pregame_gate.py tests/test_challenger_002_baseline.py tests/test_challenger_002_source_validation.py
      - name: Compile certification and integrity modules
        run: python -m py_compile research/challenger_002_nba_source_integrity.py research/challenger_002_certification_readiness.py tests/test_challenger_002_certification_readiness.py tests/test_challenger_002_authenticated_intake.py
      - name: Run offline fail-closed regression tests
        run: python -m unittest discover -s tests -p 'test_challenger_002*.py' -v
      - name: Print unified certification readiness ledger
        run: python -m research.challenger_002_certification_readiness
      - name: Assert no Certified TAKE from research lane
        run: |
          python - <<'PY'
          from research.challenger_002_baseline import evaluate
          result = evaluate([])
          assert result["certified_take_count"] == 0
          assert result["status"] == "BLOCKED"
          print("Research-only certification gate: PASS")
          PY

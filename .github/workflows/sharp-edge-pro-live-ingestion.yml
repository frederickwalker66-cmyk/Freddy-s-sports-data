name: Sharp Edge Pro — Bounded Live NBA Ingestion
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/sharp-edge-pro-live-ingestion.yml'
  schedule:
    - cron: '7 * * * *'
permissions:
  contents: read
concurrency:
  group: sharp-edge-pro-live-ingestion
  cancel-in-progress: false
jobs:
  nba-research:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Preflight credential without revealing it
        env:
          SHARPAPI_KEY: ${{ secrets.SHARPAPI_KEY || secrets.SHARP_API_KEY }}
        run: |
          test -n "$SHARPAPI_KEY" || { echo "HOLD: missing SHARPAPI_KEY"; exit 2; }
          python collector.py --leagues nba --max-pages 1 --dry-run
      - name: Fetch bounded pregame odds (maximum two paid provider requests)
        env:
          SHARPAPI_KEY: ${{ secrets.SHARPAPI_KEY || secrets.SHARP_API_KEY }}
        run: python collector.py --leagues nba --max-pages 1 --output-dir sharp-edge-pro/output/live
      - name: Run NBA unified market report (spreads, totals, player props, combos)
        run: |
          snapshot=$(find sharp-edge-pro/output/live -name '*.jsonl' | head -n 1)
          test -n "$snapshot"
          python sharp-edge-pro/run_nba.py --input "$snapshot"
      - name: Independent schedule crosswalk
        run: |
          snapshot=$(find sharp-edge-pro/output/live -name '*.jsonl' | head -n 1)
          test -n "$snapshot"
          python challenger_schedule_crosswalk.py --odds "$snapshot" --outdir sharp-edge-pro/output/audit
      - name: Quarantine unverified markets; stage research only
        run: |
          snapshot=$(find sharp-edge-pro/output/live -name '*.jsonl' | head -n 1)
          python challenger_audit.py --input "$snapshot" --schedule sharp-edge-pro/output/audit/schedule_manifest.json --output-dir sharp-edge-pro/output/audit
      - name: Verify research readiness gates without promoting any bets
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path("sharp-edge-pro/output/audit")
          report_path = root / "report.json"
          if not report_path.exists():
              raise SystemExit("Research audit report missing: cannot assess readiness")
          report = json.loads(report_path.read_text())
          observations = int(report.get("observations", 0))
          staged = int(report.get("staged_for_research_only", 0))
          quarantined = int(report.get("quarantined", 0))
          if observations != staged + quarantined:
              raise SystemExit("Research accounting mismatch: fail closed")
          if any(report.get(k) != 0 for k in (
              "independently_reverified_sportsbook_prices",
              "certified_challenger_predictions",
              "certified_champion_001_predictions",
              "bet_ready_selections",
              "automated_bets_placed",
          )):
              raise SystemExit("Unexpected certification claim in research-only report")
          gates = {
              "odds_collector_executed": observations > 0,
              "independent_schedule_crosswalk": int(report.get("independent_schedule_events_available", 0)) > 0,
              "official_roster_identity_manifest": int(report.get("independently_reviewed_roster_entries_available", 0)) > 0,
              "game_day_injury_status_manifest": int(report.get("independently_reviewed_game_day_status_entries", 0)) > 0,
              "independent_checkout_price_reverification": False,
              "original_pregame_model_probability_attestation": False,
              "certified_take_release": False,
          }
          result = {
              "status": "HOLD",
              "research_only": True,
              "observations": observations,
              "staged": staged,
              "quarantined": quarantined,
              "gates": gates,
              "quarantine_causes": report.get("quarantine_causes", {}),
              "next_actions": [name for name, passed in gates.items() if not passed],
          }
          (root / "readiness_gates.json").write_text(json.dumps(result, indent=2) + "\n")
          with open(__import__("os").environ["GITHUB_STEP_SUMMARY"], "a") as out:
              out.write("\n### Live evidence gates (research only)\n")
              for name, passed in gates.items():
                  out.write(f"- {'PASS' if passed else 'HOLD'}: {name}\n")
              out.write(f"Observations: {observations}; staged: {staged}; quarantined: {quarantined}. Certified TAKE: 0.\n")
          PY
      - name: Publish honest status
        if: always()
        run: |
          echo '## Sharp Edge Pro live NBA ingestion' >> "$GITHUB_STEP_SUMMARY"
          echo 'Research only. Zero certified TAKE. No model probabilities or checkout-price verification.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Up to two SharpAPI requests per collector invocation; provider charges and limits may apply.' >> "$GITHUB_STEP_SUMMARY"
          if [ -f sharp-edge-pro/output/nba_all.json ]; then
            echo 'Unified NBA report generated: download sharp-edge-pro-live-nba-research artifact and open nba_all.json.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Unified NBA report unavailable; collection or report step failed.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sharp-edge-pro-live-nba-research
          path: sharp-edge-pro/output/
          retention-days: 7

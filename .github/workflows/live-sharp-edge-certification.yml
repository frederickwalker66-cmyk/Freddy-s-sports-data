name: Sharp Edge — Live Certification Audit (fail closed)
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/certify_sharp_edge.py'
      - 'scripts/live_certified_predictions.py'
      - 'tests/test_sharp_edge_certification.py'
      - 'scripts/fetch_certification_candidates.py'
      - 'tests/test_fetch_certification_candidates.py'
      - 'tests/test_live_certified_predictions.py'
      - '.github/workflows/live-sharp-edge-certification.yml'
  schedule:
    # Every day, all UTC hours: captures early, afternoon and late games across sports.
    - cron: '*/15 * * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/certify_sharp_edge.py'
      - 'scripts/live_certified_predictions.py'
      - 'scripts/fetch_certification_candidates.py'
      - 'tests/test_fetch_certification_candidates.py'
      - 'tests/test_sharp_edge_certification.py'
      - 'tests/test_live_certified_predictions.py'
      - '.github/workflows/live-sharp-edge-certification.yml'
permissions:
  contents: read
concurrency:
  group: live-sharp-edge-certification
  cancel-in-progress: false
jobs:
  offline-regression:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test feed and certification fail-closed contracts without secrets
        run: python -m unittest tests.test_fetch_certification_candidates tests.test_sharp_edge_certification tests.test_live_certified_predictions -v
  certify:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Retrieve independently signed candidate batch (no fabricated picks)
        env:
          SHARP_CERTIFICATION_FEED_URL: ${{ secrets.SHARP_CERTIFICATION_FEED_URL }}
          SHARP_CERTIFICATION_FEED_TOKEN: ${{ secrets.SHARP_CERTIFICATION_FEED_TOKEN }}
        run: |
          python -m scripts.fetch_certification_candidates
      - name: Run independent evidence gate (no wagers)
        env:
          SHARP_MODEL_ATTESTATION_KEY: ${{ secrets.SHARP_MODEL_ATTESTATION_KEY }}
          SHARP_ODDS_ATTESTATION_KEY: ${{ secrets.SHARP_ODDS_ATTESTATION_KEY }}
          SHARP_RELEASE_ATTESTATION_KEY: ${{ secrets.SHARP_RELEASE_ATTESTATION_KEY }}
          SHARP_APPROVED_MODEL_VERSIONS: ${{ vars.SHARP_APPROVED_MODEL_VERSIONS }}
        run: |
          python -m unittest tests.test_fetch_certification_candidates tests.test_sharp_edge_certification tests.test_live_certified_predictions -v
          python -m scripts.live_certified_predictions --feed-status validation_output/certification_feed_status.json
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('validation_output/live_certified_predictions.json').read_text())
          print(json.dumps({key:d[key] for key in ('feed_status','certified_take_count','pass_count','hold_count','certification_blockers')}))
          PY
      - name: Publish explicit certification readiness summary
        if: always()
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          report_path = Path("validation_output/live_certified_predictions.json")
          status_path = Path("validation_output/certification_feed_status.json")
          try:
              report = json.loads(report_path.read_text(encoding="utf-8"))
          except (OSError, ValueError):
              report = {}
          try:
              feed = json.loads(status_path.read_text(encoding="utf-8"))
          except (OSError, ValueError):
              feed = {}
          feed_state = report.get("feed_status") or feed.get("status") or "FEED_STATUS_MISSING"
          count = report.get("certified_take_count", 0)
          blockers = report.get("certification_blockers", [])
          if not isinstance(blockers, list):
              blockers = ["INVALID_BLOCKER_REPORT"]
          lines = [
              "## Sharp Edge certification readiness",
              "",
              f"**Feed:** {feed_state}",
              f"**Signed candidates received:** {feed.get('candidate_count', 0)}",
              f"**Certified TAKE count:** {count}",
              f"**Decision:** {'TAKE candidates available' if count and feed_state == 'FEED_RECEIVED' else 'HOLD — not certified'}",
              "",
              "**Blockers:** " + (", ".join(map(str, blockers)) if blockers else "None reported"),
              "",
              "A successful workflow run does not certify a prediction. Missing independent supplier evidence must never be replaced with synthetic attestations.",
          ]
          summary = os.getenv("GITHUB_STEP_SUMMARY")
          if summary:
              with open(summary, "a", encoding="utf-8") as handle:
                  handle.write("\n".join(lines) + "\n")
          print(json.dumps({"feed_status": feed_state, "certified_take_count": count, "blockers": blockers}))
          PY
      - name: Save certification results for downstream dashboards
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-sharp-edge-certification
          path: |
            validation_output/live_certified_predictions.json
            validation_output/certification_feed_status.json
          retention-days: 7

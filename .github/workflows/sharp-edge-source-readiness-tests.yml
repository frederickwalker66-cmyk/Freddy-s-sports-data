name: Sharp Edge Source Readiness Tests
on:
  push:
    paths:
      - 'research/sharp_edge_source_readiness.py'
      - 'tests/test_sharp_edge_source_readiness.py'
      - '.github/workflows/sharp-edge-source-readiness-tests.yml'
  pull_request:
    paths:
      - 'research/sharp_edge_source_readiness.py'
      - 'tests/test_sharp_edge_source_readiness.py'
      - '.github/workflows/sharp-edge-source-readiness-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p 'test_sharp_edge_source_readiness.py' -v

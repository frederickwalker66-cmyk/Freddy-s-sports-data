name: Pregame Five Gate Tests
on:
  push:
    paths:
      - research/pregame_five_gate.py
      - tests/test_pregame_five_gate.py
      - .github/workflows/pregame-five-gate-tests.yml
  pull_request:
    paths:
      - research/pregame_five_gate.py
      - tests/test_pregame_five_gate.py
      - .github/workflows/pregame-five-gate-tests.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p 'test_pregame_five_gate.py' -v

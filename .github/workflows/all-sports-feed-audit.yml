name: Freddy's Picks AI — All-sports feed health audit
on:
  workflow_dispatch:
  schedule:
    - cron: '9,39 * * * *'
permissions:
  actions: read
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Audit source runs without calling paid APIs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          python - <<'PY'
          import json,os,datetime,urllib.request
          from pathlib import Path
          now=datetime.datetime.now(datetime.timezone.utc)
          names={
            'all_sports_schedule':'Challenger-001 original eight-sport schedule preflight (research only)',
            'nba_scoreboard':"Freddy's Picks AI V8 — NBA scoreboard live updates (research only)",
            'nba_injuries':'Challenger-001 original NBA pregame injury-report source archive (research only)',
            'sportsdataio_nba':'SportsDataIO NBA Authenticated Readiness (manual)',
            'sportsdataio_odds':'NBA production odds entitlement preflight (no raw data)',
            'sharpapi_odds':'NBA live connection — one-shot research and verification',
          }
          url=f"https://api.github.com/repos/{os.environ['REPO']}/actions/runs?per_page=100"
          req=urllib.request.Request(url,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','User-Agent':'feed-audit'})
          with urllib.request.urlopen(req,timeout=20) as response:
              runs=json.load(response).get('workflow_runs',[])
          results={}
          for key,name in names.items():
              run=next((r for r in runs if r.get('name')==name),None)
              if run:
                  at=datetime.datetime.fromisoformat(run['created_at'].replace('Z','+00:00'))
                  age=round((now-at).total_seconds()/60,1)
                  results[key]={'run_status':run['status'],'conclusion':run['conclusion'],'age_minutes':age,
                                'run_url':run['html_url'],'authenticated_live_data':False,
                                'note':'Workflow metadata alone does not authenticate underlying feeds'}
              else:
                  results[key]={'run_status':'not_in_recent_100_runs','authenticated_live_data':False}
          report={'checked_at_utc':now.isoformat(),'certified_live_feeds':0,
                  'scope':'GitHub workflow metadata only; no provider requests','feeds':results,
                  'production_certification':'HOLD','certified_take_count':0}
          Path('all_sports_feed_audit.json').write_text(json.dumps(report,indent=2)+'\n')
          lines=['# All-sports source health (metadata only)','',
                 'No paid feeds called. Workflow success is not source authentication.','',
                 '| Feed | Workflow status | Age (minutes) |','|---|---|---|']
          for key,value in results.items():
              lines.append(f"| {key} | {value['run_status']} / {value.get('conclusion') or 'unverified'} | {value.get('age_minutes','unknown')} |")
          lines.extend(['','**Certified live feeds: 0. Certified TAKE: 0.**'])
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as out:
              out.write('\n'.join(lines)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: all-sports-feed-audit
          path: all_sports_feed_audit.json
          retention-days: 14

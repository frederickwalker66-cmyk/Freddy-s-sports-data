name: Trusted Provider Gateway Tests
on:
  push:
    paths:
      - research/trusted_provider_gateway.py
      - tests/test_trusted_provider_gateway.py
      - v8_one_command.py
      - .github/workflows/trusted-provider-gateway-tests.yml
  pull_request:
    paths:
      - research/trusted_provider_gateway.py
      - tests/test_trusted_provider_gateway.py
      - v8_one_command.py
      - .github/workflows/trusted-provider-gateway-tests.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p 'test_trusted_provider_gateway.py' -v

name: SportsGameOdds DraftKings research feed
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'sportsgameodds_collector.py'
      - 'challenger_schedule_crosswalk.py'
      - 'challenger_audit.py'
      - 'independent_schedule_review.py'
      - 'daily_research_audit.py'
      - 'tests/**'
      - '.github/workflows/collect-sportsgameodds.yml'
  pull_request:
    paths:
      - 'sportsgameodds_collector.py'
      - 'daily_research_audit.py'
      - 'tests/**'
      - '.github/workflows/collect-sportsgameodds.yml'
  schedule:
    - cron: '0 1,13 * * *' # Two UTC daily windows (9 p.m./9 a.m. Eastern in EDT)
permissions:
  contents: read
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test all ingestion and validation fixtures
        run: python -m unittest discover -s tests -v
  research-collect:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      SPORTSGAMEODDS_API_KEY: ${{ secrets.SPORTSGAMEODDS_API_KEY || secrets.SPORTSGAMEODDS_KEY || secrets.SPORTS_GAME_ODDS_API_KEY || secrets.SPORTSGAMEODDS || secrets.SPORTS_GAME_ODDS || secrets.SPORTSGAMESODD || secrets.SPORTSGAMESODDS || secrets.SPORTS_GAMES_ODD || secrets.SPORTS_GAMES_ODDS || secrets.SPORTSGAMEODD || secrets.SPORTS_GAME_ODD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check API credential presence without printing it
        shell: bash
        run: |
          if [ -z "$SPORTSGAMEODDS_API_KEY" ]; then
            echo "No supported SportsGameOdds Actions secret name was found." >&2
            exit 1
          fi
      - name: Collect DraftKings-labeled source odds (credit capped)
        run: python sportsgameodds_collector.py --output-dir snapshots --leagues NBA,NFL,MLB,NHL,NCAAF,NCAAB,MLS,UEFA_CHAMPIONS_LEAGUE --max-pages 1 --limit 3
      - name: Enforce independent schedule and roster quarantine
        shell: bash
        run: |
          set -euo pipefail
          snapshot=$(find snapshots -maxdepth 1 -name 'sportsgameodds_dk_*.jsonl' | sort | tail -n 1)
          test -n "$snapshot"
          python challenger_schedule_crosswalk.py --odds "$snapshot" --outdir validation_sgo
          python challenger_audit.py --input "$snapshot" --schedule validation_sgo/schedule_manifest.json --output-dir validation_sgo
          python - <<'PY'
          import json
          from pathlib import Path
          summary = json.loads(Path('validation_sgo/report.json').read_text())
          assert summary['observations'] == summary['quarantined'] + summary['staged_for_research_only']
          assert summary['bet_ready_selections'] == 0
          assert summary['certified_champion_001_predictions'] == 0
          assert summary['certified_challenger_predictions'] == 0
          assert summary['automated_bets_placed'] == 0
          assert summary['champion_001_modified'] is False
          PY
      - name: Generate conservative daily research-quality report
        shell: bash
        run: |
          set -euo pipefail
          snapshot=$(find snapshots -maxdepth 1 -name 'sportsgameodds_dk_*.jsonl' | sort | tail -n 1)
          python daily_research_audit.py --odds "$snapshot" --validation validation_sgo/report.json --output validation_sgo/daily_research_report.json
      - name: Save odds and quarantine evidence as workflow artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sgo-draftkings-research-${{ github.run_id }}
          path: |
            snapshots/sportsgameodds_dk_*
            validation_sgo/
          retention-days: 30
          if-no-files-found: warn

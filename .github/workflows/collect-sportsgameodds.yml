name: SportsGameOdds DraftKings research feed
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'sportsgameodds_collector.py'
      - 'tests/**'
      - '.github/workflows/collect-sportsgameodds.yml'
  schedule:
    - cron: '15 21 * * *' # Default OFF; enable only after verifying credit budget.
permissions:
  contents: read
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test all ingestion and validation fixtures
        run: python -m unittest discover -s tests -v
  research-collect:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'schedule' && vars.ENABLE_SGO_SCHEDULE == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      SPORTSGAMEODDS_API_KEY: ${{ secrets.SPORTSGAMEODDS_API_KEY || secrets.SPORTSGAMEODDS_KEY || secrets.SPORTS_GAME_ODDS_API_KEY || secrets.SPORTSGAMEODDS || secrets.SPORTS_GAME_ODDS }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check API credential presence without printing it
        shell: bash
        run: |
          if [ -z "$SPORTSGAMEODDS_API_KEY" ]; then
            echo "No supported SportsGameOdds Actions secret name was found." >&2
            exit 1
          fi
      - name: Collect DraftKings-labeled source odds (credit capped)
        run: python sportsgameodds_collector.py --output-dir snapshots --leagues NBA,MLB,NFL --max-pages 1 --limit 25
      - name: Enforce independent schedule and roster quarantine
        shell: bash
        run: |
          set -euo pipefail
          snapshot=$(find snapshots -maxdepth 1 -name 'sportsgameodds_dk_*.jsonl' | sort | tail -n 1)
          test -n "$snapshot"
          python challenger_audit.py --input "$snapshot" --output-dir validation_sgo
          python - <<'PY'
          import json
          from pathlib import Path
          summary = json.loads(Path('validation_sgo/report.json').read_text())
          assert summary['observations'] == summary['quarantined']
          assert summary['staged_for_research_only'] == 0
          assert summary['bet_ready_selections'] == 0
          assert summary['certified_champion_001_predictions'] == 0
          assert summary['certified_challenger_predictions'] == 0
          assert summary['automated_bets_placed'] == 0
          assert summary['champion_001_modified'] is False
          PY
      - name: Save odds and quarantine evidence as workflow artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sgo-draftkings-research-${{ github.run_id }}
          path: |
            snapshots/sportsgameodds_dk_*
            validation_sgo/
          retention-days: 7
          if-no-files-found: warn

name: SportsDataIO NBA Authenticated Readiness (manual)
on:
  workflow_dispatch:
    inputs:
      game_date:
        description: "NBA game date (YYYY-MM-DD); leave blank for UTC today"
        required: false
        type: string
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SPORTSDATAIO_ODDS_API_KEY: ${{ secrets.SPORTSDATAIO_ODDS_API_KEY }}
      SPORTSDATAIO_NBA_API_KEY: ${{ secrets.SPORTSDATAIO_NBA_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probe provider without exposing credentials
        shell: bash
        env:
          GAME_DATE: ${{ inputs.game_date }}
        run: |
          set -euo pipefail
          if [ -z "${GAME_DATE}" ]; then GAME_DATE="$(date -u +%F)"; fi
          python -m research.sportsdataio_nba_probe --date "${GAME_DATE}" --output SPORTSDATAIO_NBA_READINESS.json
          python - <<'PY'
          import json, os
          from pathlib import Path
          report=json.loads(Path("SPORTSDATAIO_NBA_READINESS.json").read_text())
          summary=Path(os.environ["GITHUB_STEP_SUMMARY"])
          lines=["## SportsDataIO NBA authenticated probe", "", "| Feed | Result |", "|---|---|"]
          for key, result in report["endpoints"].items():
              lines.append(f"| {key} | {result['status']} |")
          lines.extend(["", "**Certified TAKE: 0 — HOLD.** API response alone does not certify DraftKings or model EV."])
          summary.write_text("\n".join(lines)+"\n")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sportsdataio-nba-readiness
          path: SPORTSDATAIO_NBA_READINESS.json
          retention-days: 7
      - name: Fail verification if any authenticated feed is unavailable
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path=Path("SPORTSDATAIO_NBA_READINESS.json")
          if not path.exists():
              raise SystemExit("VERIFICATION_FAILED: provider readiness report missing")
          report=json.loads(path.read_text())
          statuses={name:item["status"] for name,item in report["endpoints"].items()}
          failures={name:status for name,status in statuses.items()
                    if status!="RECEIVED_PROVIDER_RESPONSE_UNVERIFIED_MARKETS"}
          if failures:
              raise SystemExit("VERIFICATION_FAILED: "+repr(failures))
          print("Authenticated provider endpoints responded. DraftKings identity, rosters, model inference and certified TAKE still HOLD.")
          PY

name: Cross-check SharpAPI and SportsGameOdds research odds
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'crossfeed_reconcile.py'
      - 'tests/test_crossfeed_reconcile.py'
      - 'independent_schedule_review.py'
      - 'tests/test_independent_schedule_review.py'
      - '.github/workflows/crossfeed-research.yml'
permissions:
  contents: read
jobs:
  crossfeed-research:
    runs-on: ubuntu-latest
    timeout-minutes: 26
    env:
      SHARPAPI_KEY: ${{ secrets.SHARPAPI_KEY || secrets.SHARPAPIKEY }}
      SPORTSGAMEODDS_API_KEY: ${{ secrets.SPORTSGAMEODDS_API_KEY || secrets.SPORTSGAMEODDS_KEY || secrets.SPORTS_GAME_ODDS_API_KEY || secrets.SPORTSGAMEODDS || secrets.SPORTS_GAME_ODDS || secrets.SPORTSGAMESODD || secrets.SPORTSGAMESODDS || secrets.SPORTS_GAMES_ODD || secrets.SPORTS_GAMES_ODDS || secrets.SPORTSGAMEODD || secrets.SPORTS_GAME_ODD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run offline safety fixtures
        run: python -m unittest discover -s tests -v
      - name: Verify credential presence without exposing keys
        shell: bash
        run: |
          test -n "$SHARPAPI_KEY" || { echo 'SharpAPI secret missing'; exit 1; }
          test -n "$SPORTSGAMEODDS_API_KEY" || { echo 'SportsGameOdds secret missing'; exit 1; }
      - name: Collect fresh SharpAPI DraftKings-labeled odds
        run: python collector.py --output-dir snapshots_sharp --max-pages 4
      - name: Collect capped eight-league SportsGameOdds research
        run: python sportsgameodds_collector.py --output-dir snapshots_sgo --leagues NBA,NFL,MLB,NHL,NCAAF,NCAAB,MLS,UEFA_CHAMPIONS_LEAGUE --max-pages 1 --limit 3
      - name: Reconcile without certifying prices or bets
        shell: bash
        run: |
          set -euo pipefail
          sharp=$(find snapshots_sharp -maxdepth 1 -name '*.jsonl' | sort | tail -n 1)
          sgo=$(find snapshots_sgo -maxdepth 1 -name '*.jsonl' | sort | tail -n 1)
          test -n "$sharp" && test -n "$sgo"
          python crossfeed_reconcile.py --sharp "$sharp" --sgo "$sgo" --output-dir crossfeed_output
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('crossfeed_output/report.json').read_text())
          assert p['certified_champion_001_predictions']==p['bet_ready_selections']==0
          assert p['independently_verified_draftkings_prices']==0
          assert p['positive_ev_bets_certified']==p['automated_bets_placed']==0
          assert p['champion_001_modified'] is False
          PY
      - name: Corroborate matchups and start times with independent public schedules
        run: python independent_schedule_review.py --crossfeed-dir crossfeed_output --output-dir schedule_review
      - name: Verify schedule research remains non-bettable
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('schedule_review/report.json').read_text())
          assert p['independent_price_verifications']==0
          assert p['verified_model_probabilities']==0
          assert p['certified_champion_001_predictions']==p['certified_positive_ev_bets']==0
          assert p['bet_ready_selections']==0
          assert p['champion_001_modified'] is False
          PY
      - name: Save timestamped comparisons as private workflow artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crossfeed-research-${{ github.run_id }}
          path: |
            snapshots_sharp/
            snapshots_sgo/
            crossfeed_output/
            schedule_review/
          retention-days: 30
          if-no-files-found: warn

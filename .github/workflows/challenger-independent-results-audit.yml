name: Challenger-001 independent NBA MLB result audit (research only)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'challenger_independent_results_audit.py'
      - 'tests/test_challenger_independent_results_audit.py'
      - '.github/workflows/challenger-independent-results-audit.yml'
  pull_request:
    paths:
      - 'challenger_independent_results_audit.py'
      - 'tests/test_challenger_independent_results_audit.py'
      - '.github/workflows/challenger-independent-results-audit.yml'
permissions:
  contents: read
  actions: read
jobs:
  safety-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check all existing and new offline safety tests
        run: python -m unittest discover -s tests -v
  secondary-results:
    if: github.event_name != 'pull_request'
    needs: safety-tests
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        league: [nba, mlb]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Find latest successful quarantined score backfill
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rid="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow challenger-historical-backfill.yml --branch main --status success --limit 1 --json databaseId --jq '.[0].databaseId')"
          test -n "$rid" && test "$rid" != null
          echo "run_id=$rid" >> "$GITHUB_OUTPUT"
      - name: Download existing research scores without calling betting APIs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "${{ steps.source.outputs.run_id }}" \
            --repo "$GITHUB_REPOSITORY" \
            --name "challenger-backfill-${{ matrix.league }}-${{ steps.source.outputs.run_id }}" \
            --dir source
          test -s source/published_results.jsonl
          test -f source/research_candidates.jsonl
      - name: Compare published results with an independent league-operated source
        run: |
          python challenger_independent_results_audit.py \
            --league "${{ matrix.league }}" \
            --results source/published_results.jsonl \
            --candidates source/research_candidates.jsonl \
            --output-dir challenger_secondary_audit
      - name: Enforce no training promotion and no betting
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('challenger_secondary_audit/secondary_result_report.json')
          r = json.loads(p.read_text())
          for key in ('verified_pregame_training_examples', 'certified_champion_001_predictions',
                      'certified_challenger_001_predictions', 'bet_ready_selections', 'automated_bets_placed'):
              assert r[key] == 0, (key, r[key])
          assert r['champion_001_modified'] is False
          for line in Path('challenger_secondary_audit/secondary_result_checks.jsonl').read_text().splitlines():
              row = json.loads(line)
              assert row['qualified_for_challenger_backtest'] is False
              assert row['bet_ready'] is False
          print('SECONDARY SOURCE RESULT AUDIT:', r)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: challenger-secondary-${{ matrix.league }}-${{ github.run_id }}
          path: challenger_secondary_audit/
          retention-days: 30
          if-no-files-found: warn

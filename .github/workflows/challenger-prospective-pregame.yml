name: Challenger-001 prospective eight-league pregame evidence capture
on:
  workflow_dispatch:
  schedule:
    # 13:15 and 20:15 UTC, before many scheduled US games; GitHub may delay jobs.
    - cron: '15 13,20 * * *'
  push:
    branches: [main]
    paths:
      - 'challenger_prospective_pregame.py'
      - 'challenger_prospective_receipts.py'
      - 'tests/test_challenger_history_coverage.py'
      - 'challenger_research_shadow_baseline.py'
      - 'tests/test_challenger_research_shadow_baseline.py'
      - 'tests/test_challenger_prospective_pregame.py'
      - 'tests/test_challenger_prospective_receipts.py'
      - '.github/workflows/challenger-prospective-pregame.yml'
  pull_request:
    paths:
      - 'challenger_prospective_pregame.py'
      - 'challenger_prospective_receipts.py'
      - 'tests/test_challenger_prospective_pregame.py'
      - 'tests/test_challenger_prospective_receipts.py'
      - '.github/workflows/challenger-prospective-pregame.yml'
permissions:
  contents: read
  actions: read
jobs:
  safety-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run complete offline suite with prospective timing safeguards
        run: python -m unittest discover -s tests -v

  prospective-source-capture:
    if: github.event_name != 'pull_request'
    needs: safety-tests
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reuse existing quarantined odds and official-source archives
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p source_sharp source_official
          for source in sharpapi official; do
            case "$source" in
              sharpapi) workflow="collect-sharpapi.yml"; prefix="sharpapi-pregame"; destination="source_sharp";;
              official) workflow="refresh-nba-mlb-evidence.yml"; prefix="official-nba-mlb"; destination="source_official";;
            esac
            rid="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "$workflow" --branch main --status success --limit 1 --json databaseId --jq '.[0].databaseId' || true)"
            if [[ -n "$rid" && "$rid" != "null" ]] &&
                gh run download "$rid" --repo "$GITHUB_REPOSITORY" --name "$prefix-$rid" --dir "$destination"; then
              echo "$source archive retrieved from run $rid (not proof of quote freshness)"
            else
              echo "$source archive unavailable; downstream reports missing evidence and stays research-only"
            fi
          done
      - name: Capture new timestamped ESPN schedule and prospective prior team form
        shell: bash
        run: |
          set -euo pipefail
          args=(--history-days 14 --football-history-days 35 --output-dir prospective_pregame)
          sharp="$(find source_sharp -type f -name 'sharpapi_dk_*.jsonl' | sort | tail -n 1)"
          official="$(find source_official -type f -name 'source_refresh_report.json' | sort | tail -n 1)"
          if [[ -n "$sharp" ]]; then args+=(--sharp-jsonl "$sharp"); fi
          if [[ -n "$official" ]]; then args+=(--official-report "$official"); fi
          python challenger_prospective_pregame.py "${args[@]}"
      - name: Capture original prospective event JSONL bytes with a same-run receipt
        shell: bash
        run: |
          set -euo pipefail
          python challenger_prospective_receipts.py --mode capture \
            --snapshots prospective_pregame/prospective_event_evidence.jsonl \
            --run-id "$GITHUB_RUN_ID" \
            --output prospective_pregame/point_in_time_receipt.json
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("prospective_pregame/point_in_time_receipt.json").read_text())
          assert r["receipt_independently_authenticated"] is False
          assert r["qualified_for_challenger_training"] is False
          assert r["certified_champion_001_predictions"] == r["certified_challenger_001_predictions"] == 0
          assert r["bet_ready_selections"] == r["automated_bets_placed"] == 0
          assert r["champion_001_modified"] is False
          PY
      - name: Generate real pre-tipoff untrained $0 research shadow forecasts
        run: |
          python challenger_research_shadow_baseline.py \
            --snapshots prospective_pregame/prospective_event_evidence.jsonl \
            --output-dir prospective_pregame
          python - <<'PY'
          import json
          from datetime import datetime
          from pathlib import Path
          root=Path("prospective_pregame")
          report=json.loads((root/"research_baseline_report.json").read_text())
          assert report["certified_champion_001_predictions"] == 0
          assert report["certified_challenger_001_predictions"] == 0
          assert report["bet_ready_selections"] == 0
          assert report["automated_bets_placed"] == 0
          assert report["champion_001_modified"] is False
          for line in (root/"research_shadow_forecasts.jsonl").read_text().splitlines():
              row=json.loads(line)
              assert datetime.fromisoformat(row["forecast_created_at_utc"]) < datetime.fromisoformat(row["event_start_utc"])
              assert row["trained_challenger_001_model"] is False
              assert row["shadow_stake_usd"] == 0
              assert row["certified_prediction"] is False
              assert row["bet_ready"] is False
          PY
      - name: Verify prospective timing and no model or betting promotion
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from datetime import datetime
          root=Path("prospective_pregame")
          p=json.loads((root/"prospective_report.json").read_text())
          for k in ("verified_historical_training_examples","direct_draftkings_checkout_quotes_verified",
                    "verified_player_availability_entries","certified_champion_001_predictions",
                    "certified_challenger_001_predictions","bet_ready_selections","automated_bets_placed"):
              assert p[k] == 0, (k,p[k])
          assert p["champion_001_modified"] is False
          for line in (root/"prospective_event_evidence.jsonl").read_text().splitlines():
              r=json.loads(line)
              assert datetime.fromisoformat(r["snapshot_completed_at_utc"]) < datetime.fromisoformat(r["event_start_utc"])
              assert r["qualified_for_challenger_backtest"] is False
              assert r["model_probability"] is None
              assert r["bet_ready"] is False and r["champion_001_modified"] is False
              for q in r["odds_observations"]:
                  assert datetime.fromisoformat(q["received_at_utc"]) < datetime.fromisoformat(r["event_start_utc"])
                  assert datetime.fromisoformat(q["received_at_utc"]) <= datetime.fromisoformat(r["snapshot_completed_at_utc"])
                  assert q["direct_draftkings_checkout_verified"] is False
                  assert q["player_available_verified"] is False
          print("Prospective snapshot restricted to research-only:",p["scheduled_pregame_events"],"scheduled games")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: challenger-prospective-evidence-${{ github.run_id }}
          path: prospective_pregame/
          retention-days: 90
          if-no-files-found: warn

name: Challenger-001 prospective eight-league pregame evidence capture
on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Collect SharpAPI DraftKings pregame odds"]
    types: [completed]
    branches: [main]
  # Live prospective capture is triggered by successful SharpAPI completion.
  # Manual dispatch remains available for diagnostics; archived odds still
  # face the strict 15-minute quote-freshness gate.
  push:
    branches: [main]
    paths:
      - 'challenger_prospective_pregame.py'
      - 'challenger_nba_pregame_injury_pdf.py'
      - 'tests/test_challenger_nba_pregame_injury_pdf.py'
      - 'challenger_nba_injury_pdf_player_rows.py'
      - 'tests/test_challenger_nba_injury_pdf_player_rows.py'
      - 'challenger_nba_pregame_roster_identity.py'
      - 'tests/test_challenger_nba_pregame_roster_identity.py'
      - 'challenger_nba_active_list_conflict_gate.py'
      - 'tests/test_challenger_nba_active_list_conflict_gate.py'
      - 'challenger_nba_official_stats_v3_inactives.py'
      - 'tests/test_challenger_nba_official_stats_v3_inactives.py'
      - 'challenger_nba_daily_scoreboard_fallback.py'
      - 'tests/test_challenger_nba_daily_scoreboard_fallback.py'
      - 'tests/test_challenger_nba_cdn_headers.py'
      - 'challenger_nba_injury_revision_monitor.py'
      - 'tests/test_challenger_nba_injury_revision_monitor.py'
      - 'requirements-injury-pdf.txt'
      - 'challenger_prospective_receipts.py'
      - 'challenger_nba_source_inventory.py'
      - 'challenger_nba_source_integrity.py'
      - 'tests/test_challenger_history_coverage.py'
      - 'challenger_research_shadow_baseline.py'
      - 'challenger_native_pregame_capture.py'
      - 'challenger_multisport_native_capture.py'
      - 'tests/test_challenger_multisport_native_capture.py'
      - 'tests/test_challenger_native_pregame_capture.py'
      - 'tests/test_challenger_research_shadow_baseline.py'
      - 'tests/test_challenger_prospective_pregame.py'
      - 'tests/test_challenger_prospective_receipts.py'
      - '.github/workflows/challenger-prospective-pregame.yml'
  pull_request:
    paths:
      - 'challenger_multisport_native_capture.py'
      - 'tests/test_challenger_multisport_native_capture.py'
      - 'challenger_native_pregame_capture.py'
      - 'tests/test_challenger_native_pregame_capture.py'
      - 'challenger_prospective_pregame.py'
      - 'challenger_nba_pregame_injury_pdf.py'
      - 'tests/test_challenger_nba_pregame_injury_pdf.py'
      - 'challenger_nba_injury_pdf_player_rows.py'
      - 'tests/test_challenger_nba_injury_pdf_player_rows.py'
      - 'challenger_nba_pregame_roster_identity.py'
      - 'tests/test_challenger_nba_pregame_roster_identity.py'
      - 'challenger_nba_active_list_conflict_gate.py'
      - 'tests/test_challenger_nba_active_list_conflict_gate.py'
      - 'challenger_nba_official_stats_v3_inactives.py'
      - 'tests/test_challenger_nba_official_stats_v3_inactives.py'
      - 'challenger_nba_daily_scoreboard_fallback.py'
      - 'tests/test_challenger_nba_daily_scoreboard_fallback.py'
      - 'tests/test_challenger_nba_cdn_headers.py'
      - 'challenger_nba_injury_revision_monitor.py'
      - 'tests/test_challenger_nba_injury_revision_monitor.py'
      - 'requirements-injury-pdf.txt'
      - 'challenger_prospective_receipts.py'
      - 'challenger_nba_source_inventory.py'
      - 'challenger_nba_source_integrity.py'
      - 'tests/test_challenger_prospective_pregame.py'
      - 'tests/test_challenger_prospective_receipts.py'
      - '.github/workflows/challenger-prospective-pregame.yml'
permissions:
  contents: read
  actions: read
jobs:
  safety-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install native training test requirements
        run: python -m pip install -r requirements-calibration.txt
      - name: Install NBA original injury PDF column reader
        run: python -m pip install -r requirements-injury-pdf.txt
      - name: Run complete offline suite with prospective timing safeguards
        run: python -m unittest discover -s tests -v

  prospective-source-capture:
    # Code-push and PR events validate code only; they must not reload older
    # odds archives and publish a stale snapshot as if it were a live refresh.
    # Successful collector workflow_run uses its exact run ID for the artifact.
    if: (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') || github.event_name == 'workflow_dispatch' 
    needs: safety-tests
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reuse existing quarantined odds and official-source archives
        env:
          GH_TOKEN: ${{ github.token }}
          TRIGGERED_SHARPAPI_RUN_ID: ${{ github.event.workflow_run.id || '' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p source_sharp source_official
          for source in sharpapi official; do
            case "$source" in
              sharpapi) workflow="collect-sharpapi.yml"; prefix="sharpapi-pregame"; destination="source_sharp";;
              official) workflow="refresh-nba-mlb-evidence.yml"; prefix="official-nba-mlb"; destination="source_official";;
            esac
            if [[ "$source" == "sharpapi" && -n "$TRIGGERED_SHARPAPI_RUN_ID" ]]; then
              rid="$TRIGGERED_SHARPAPI_RUN_ID"
              echo "Using exact successful SharpAPI trigger run id $rid"
            else
              rid="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "$workflow" --branch main --status success --limit 1 --json databaseId --jq '.[0].databaseId' || true)"
            fi
            if [[ -n "$rid" && "$rid" != "null" ]] &&
                gh run download "$rid" --repo "$GITHUB_REPOSITORY" --name "$prefix-$rid" --dir "$destination"; then
              echo "$source archive retrieved from run $rid (not proof of quote freshness)"
            else
              echo "$source archive unavailable; downstream reports missing evidence and stays research-only"
            fi
          done
      - name: Capture new timestamped ESPN schedule and prospective prior team form
        shell: bash
        run: |
          set -euo pipefail
          args=(--history-days 14 --football-history-days 35 --output-dir prospective_pregame)
          sharp="$(find source_sharp -type f -name 'sharpapi_dk_*.jsonl' | sort | tail -n 1)"
          official="$(find source_official -type f -name 'source_refresh_report.json' | sort | tail -n 1)"
          if [[ -n "$sharp" ]]; then args+=(--sharp-jsonl "$sharp"); fi
          if [[ -n "$official" ]]; then args+=(--official-report "$official"); fi
          python challenger_prospective_pregame.py "${args[@]}"
      - name: Install NBA original injury PDF column reader
        run: python -m pip install -r requirements-injury-pdf.txt
      - name: Preserve the latest original NBA official injury report PDF without player-status promotion
        shell: bash
        run: |
          set -euo pipefail
          python challenger_nba_pregame_injury_pdf.py \
            --events prospective_pregame/prospective_event_evidence.jsonl \
            --output-dir prospective_pregame/injury_report_original
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          root=Path("prospective_pregame/injury_report_original")
          r=json.loads((root/"nba_injury_original_report.json").read_text())
          assert r["nba_players_with_verified_injury_status"] == 0
          assert r["nba_players_confirmed_active"] == 0
          assert r["qualified_player_prop_training_observations"] == 0
          assert r["certified_champion_001_predictions"] == 0
          assert r["certified_challenger_001_predictions"] == 0
          assert r["certified_positive_ev_bets"] == 0
          assert r["bet_ready_selections"] == r["automated_bets_placed"] == 0
          assert r["champion_001_modified"] is False
          if r["source_status"] == "captured_original_index_and_pdf":
              assert r["original_pdf_sha256"] == hashlib.sha256(
                  (root/"nba_injury_original_report.pdf").read_bytes()).hexdigest()
              assert r["official_nba_index_sha256"] == hashlib.sha256(
                  (root/"nba_injury_original_index.html").read_bytes()).hexdigest()
              assert r["original_pdf_authorship_cryptographically_verified"] is False
              assert r["report_filename_label_externally_authenticated"] is False
          for line in (root/"nba_injury_event_attachments.jsonl").read_text().splitlines():
              row=json.loads(line)
              assert row["report_observed_before_tipoff"] is True
              assert row["report_includes_this_game_verified"] is False
              assert row["individual_player_report_status_verified"] is False
              assert row["injury_report_proves_confirmed_active"] is False
              assert row["qualifies_player_prop_training"] is False
              assert row["bet_ready"] is False
          print("NBA original injury report capture status:",r["source_status"])
          PY
      - name: Extract official NBA PDF player injury entries without declaring active status
        shell: bash
        run: |
          set -euo pipefail
          python challenger_nba_injury_pdf_player_rows.py \
            --capture-dir prospective_pregame/injury_report_original \
            --events prospective_pregame/prospective_event_evidence.jsonl \
            --output-dir prospective_pregame/injury_report_original/player_rows_review
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('prospective_pregame/injury_report_original/player_rows_review')
          r=json.loads((root/'nba_injury_pdf_player_report.json').read_text())
          for k in ('active_player_roster_verified','individual_player_id_crosswalk_verified',
                    'qualified_prop_training_observations','trained_player_prop_models',
                    'certified_champion_001_predictions','certified_challenger_001_predictions',
                    'certified_positive_ev_bets','bet_ready_selections','automated_bets_placed'):
              assert r[k]==0,(k,r[k])
          assert r['champion_001_modified'] is False
          assert r['injury_report_status_is_final_lineup_verified'] is False
          for line in (root/'nba_injury_pdf_player_review.jsonl').read_text().splitlines():
              item=json.loads(line)
              assert item['player_current_game_active_status_verified'] is False
              assert item['roster_player_id_crosswalk_verified'] is False
              assert item['market_eligibility_verified'] is False
              assert item['qualified_for_prop_training'] is False
              assert item['bet_ready'] is False and item['champion_001_modified'] is False
          print('New prospective NBA injury player review-only rows:',
                r['player_rows_extracted_from_official_pdf'],
                'source parse blocker:',r['pdf_extraction_error'])
          PY
      - name: Resolve same-game NBA roster person ID candidates against prospective ESPN clocks (research only)
        shell: bash
        run: |
          set -euo pipefail
          python challenger_nba_pregame_roster_identity.py \
            --capture-dir prospective_pregame/injury_report_original \
            --events prospective_pregame/prospective_event_evidence.jsonl \
            --output-dir prospective_pregame/injury_report_original/pregame_roster_id_review \
            --max-games 4
          python - <<'PY'
          import json,hashlib
          from pathlib import Path
          root=Path('prospective_pregame/injury_report_original/pregame_roster_id_review')
          r=json.loads((root/'nba_pregame_roster_identity_report.json').read_text())
          assert r['official_game_requests_bounded']<=4
          for k in ('independently_confirmed_active_players',
                    'verified_nba_to_espn_to_draftkings_player_id_crosswalks',
                    'qualified_player_prop_training_observations',
                    'trained_player_prop_models','certified_champion_001_predictions',
                    'certified_challenger_001_predictions','certified_positive_ev_bets',
                    'bet_ready_selections','automated_bets_placed'):
            assert r[k]==0,(k,r[k])
          assert r['champion_001_modified'] is False
          for line in (root/'nba_pregame_roster_identity_review.jsonl').read_text().splitlines():
            x=json.loads(line)
            assert x['roster_status_is_final_active_list'] is False
            assert x['current_game_active_inactive_verified'] is False
            assert x['independently_authenticated_player_id_crosswalk'] is False
            assert x['draftkings_player_id_verified'] is False
            assert x['qualified_for_player_prop_training'] is False
            assert x['bet_ready'] is False
          for filename,digest in r['original_source_sha256'].items():
            path=root/'nba_roster_original_source_bytes'/filename
            assert hashlib.sha256(path.read_bytes()).hexdigest()==digest
          print('Same-run future NBA game identity candidates (uncertified):',
                r['nba_person_id_candidates_without_id_cross_source_authentication'])
          PY
      - name: Block NBA player props on unverified active-list and contradictory game-roster status
        shell: bash
        run: |
          set -euo pipefail
          python challenger_nba_active_list_conflict_gate.py \
            --roster-dir prospective_pregame/injury_report_original/pregame_roster_id_review \
            --output-dir prospective_pregame/injury_report_original/active_list_conflicts
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('prospective_pregame/injury_report_original/active_list_conflicts')
          report=json.loads((root/'nba_active_list_conflict_report.json').read_text())
          for key in ('independently_confirmed_game_day_active_players',
                      'independently_confirmed_game_day_inactive_players',
                      'verified_nba_espn_draftkings_player_id_crosswalks',
                      'qualified_player_prop_training_observations',
                      'certified_champion_001_predictions','certified_challenger_001_predictions',
                      'certified_positive_ev_bets','bet_ready_selections','automated_bets_placed'):
              assert report[key] == 0,(key,report[key])
          assert report['official_complete_active_list_authenticated'] is False
          assert report['champion_001_modified'] is False
          for line in (root/'nba_active_list_conflict_review.jsonl').read_text().splitlines():
              row=json.loads(line)
              assert row['official_complete_active_list_verified'] is False
              assert row['current_game_active_inactive_independently_confirmed'] is False
              assert row['player_participation_or_dnp_verified'] is False
              assert row['qualified_for_player_prop_training'] is False
              assert row['certified_prediction'] is False and row['bet_ready'] is False
          print('NBA injury/roster conflicts needing manual review:',
                report['near_tipoff_manual_conflicts'])
          PY
      - name: Capture official NBA Stats V3 explicit game inactives as observed pregame; never infer active teammates
        shell: bash
        run: |
          set -euo pipefail
          python challenger_nba_official_stats_v3_inactives.py \
            --roster-dir prospective_pregame/injury_report_original/pregame_roster_id_review \
            --output-dir prospective_pregame/injury_report_original/stats_v3_inactive_receipts \
            --max-games 4
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          root=Path('prospective_pregame/injury_report_original/stats_v3_inactive_receipts')
          report=json.loads((root/'nba_stats_v3_inactive_report.json').read_text())
          assert report['source_requests_attempted']<=4
          assert report['official_final_active_list_authenticated'] is False
          assert report['no_inactive_rows_does_not_mean_everyone_active'] is True
          for k in ('independently_confirmed_game_day_active_players',
                    'independently_confirmed_game_day_inactive_players',
                    'verified_nba_espn_draftkings_player_id_crosswalks',
                    'qualified_player_prop_training_observations',
                    'certified_champion_001_predictions','certified_challenger_001_predictions',
                    'certified_positive_ev_bets','bet_ready_selections','automated_bets_placed'):
            assert report[k]==0,(k,report[k])
          assert report['champion_001_modified'] is False
          for line in (root/'nba_stats_v3_inactive_review.jsonl').read_text().splitlines():
            p=json.loads(line)
            assert p['source_explicit_inactive_pregame'] is True
            assert p['confirmed_final_game_inactive'] is False
            assert p['all_nonlisted_players_assumed_active'] is False
            assert p['qualified_for_prop_training'] is False
            assert p['model_probability'] is None and p['bet_ready'] is False
          for game_id,digest in report['observed_game_source_sha256'].items():
            raw=(root/'nba_stats_v3_original_source_bytes'/(game_id+'.json')).read_bytes()
            assert hashlib.sha256(raw).hexdigest()==digest
          print('NBA V3 source inactives (unqualified):',
                report['explicit_source_inactive_rows'],
                'state:',report['status'])
          PY
      - name: Audit change between two actual NBA injury PDF revisions against same-run upcoming games
        shell: bash
        run: |
          set -euo pipefail
          python challenger_nba_injury_revision_monitor.py \
            --capture-dir prospective_pregame/injury_report_original \
            --events prospective_pregame/prospective_event_evidence.jsonl \
            --output-dir prospective_pregame/injury_report_original/revision_monitor
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          root=Path('prospective_pregame/injury_report_original/revision_monitor')
          report=json.loads((root/'nba_injury_revision_report.json').read_text())
          for k in ('confirmed_active_players','confirmed_late_scratches',
                    'verified_player_participation','verified_player_prop_training_examples',
                    'certified_champion_001_predictions','certified_challenger_001_predictions',
                    'certified_positive_ev_bets','bet_ready_selections','automated_bets_placed'):
            assert report[k]==0,(k,report[k])
          assert report['champion_001_modified'] is False
          for line in (root/'nba_injury_status_changes.jsonl').read_text().splitlines():
            x=json.loads(line)
            assert x['confirmed_late_scratch'] is False
            assert x['official_complete_active_list_verified'] is False
            assert x['bookmaker_prop_settlement_verified'] is False
            assert x['qualified_for_player_prop_training'] is False
            assert x['bet_ready'] is False
          p=root/'nba_previous_original_injury_report.pdf'
          if p.exists():
            assert hashlib.sha256(p.read_bytes()).hexdigest()==report['previous_original_pdf_sha256']
          print('NBA reported-to-Out revisions linked to future games (uncertified):',
                report['pregame_linked_out_transitions_for_review'])
          PY
      - name: Capture original prospective event JSONL bytes with a same-run receipt
        shell: bash
        run: |
          set -euo pipefail
          python challenger_prospective_receipts.py --mode capture \
            --snapshots prospective_pregame/prospective_event_evidence.jsonl \
            --run-id "$GITHUB_RUN_ID" \
            --output prospective_pregame/point_in_time_receipt.json
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("prospective_pregame/point_in_time_receipt.json").read_text())
          assert r["receipt_independently_authenticated"] is False
          assert r["qualified_for_challenger_training"] is False
          assert r["certified_champion_001_predictions"] == r["certified_challenger_001_predictions"] == 0
          assert r["bet_ready_selections"] == r["automated_bets_placed"] == 0
          assert r["champion_001_modified"] is False
          PY
      - name: Inventory and verify actual archived prospective evidence bytes
        shell: bash
        run: |
          set -euo pipefail
          python challenger_nba_source_inventory.py \
            --root prospective_pregame \
            --manifest prospective_pregame_source_receipts.json \
            --report challenger_results/prospective_source_inventory.json
          python challenger_nba_source_integrity.py \
            --root prospective_pregame \
            --manifest prospective_pregame_source_receipts.json \
            --output challenger_results/prospective_source_integrity.json
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("challenger_results/prospective_source_integrity.json").read_text())
          assert r["files_checked"] >= 2, "Missing actual archived prospective files"
          assert r["failures"] == 0
          assert r["integrity_matches"] == r["files_checked"]
          assert r["independently_authenticated_publication"] is False
          assert r["qualified_training_examples"] == 0
          assert r["champion_001_modified"] is False
          PY
      - name: Generate real pre-tipoff untrained $0 research shadow forecasts
        run: |
          python challenger_research_shadow_baseline.py \
            --snapshots prospective_pregame/prospective_event_evidence.jsonl \
            --output-dir prospective_pregame
          python - <<'PY'
          import json
          from datetime import datetime
          from pathlib import Path
          root=Path("prospective_pregame")
          report=json.loads((root/"research_baseline_report.json").read_text())
          assert report["certified_champion_001_predictions"] == 0
          assert report["certified_challenger_001_predictions"] == 0
          assert report["bet_ready_selections"] == 0
          assert report["automated_bets_placed"] == 0
          assert report["champion_001_modified"] is False
          for line in (root/"research_shadow_forecasts.jsonl").read_text().splitlines():
              row=json.loads(line)
              assert datetime.fromisoformat(row["forecast_created_at_utc"]) < datetime.fromisoformat(row["event_start_utc"])
              assert row["trained_challenger_001_model"] is False
              assert row["shadow_stake_usd"] == 0
              assert row["certified_prediction"] is False
              assert row["bet_ready"] is False
          PY
      - name: Capture only genuine native Challenger NBA forecasts; fail closed without model and features
        shell: bash
        run: |
          python challenger_native_pregame_capture.py \
            --snapshots prospective_pregame/prospective_event_evidence.jsonl \
            --model challenger_results/nba_probability/research_model.json \
            --candidates prospective_pregame/nba_home_research_candidates.jsonl \
            --output-dir prospective_pregame \
            --run-id "$GITHUB_RUN_ID"
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('prospective_pregame')
          r=json.loads((root/'native_forecast_capture_report.json').read_text())
          assert r['champion_001_modified'] is False
          assert r['certified_champion_001_predictions'] == 0
          assert r['certified_challenger_001_predictions'] == 0
          assert r['certified_positive_ev_bets'] == r['bet_ready_selections'] == r['automated_bets_placed'] == 0
          for line in (root/'native_challenger_forecasts.jsonl').read_text().splitlines():
              item=json.loads(line)
              assert item['certified_prediction'] is False
              assert item['native_model_fit_independently_certified'] is False
              assert item['eligible_for_isotonic_fit'] is False
              assert item['bet_ready'] is False
              assert item['market_implied_probability_used_as_model'] is False
              assert item['champion_001_modified'] is False
          print('Native Challenger research receipts:',r['actual_native_research_forecasts_written'],r['status'])
          PY
      - name: Capture seven other sports with native research model gates; NBA handled separately
        shell: bash
        run: |
          python challenger_multisport_native_capture.py \
            --snapshots prospective_pregame/prospective_event_evidence.jsonl \
            --candidates prospective_pregame/multisport_game_candidates.jsonl \
            --model-dir challenger_results/multisport_models \
            --output-dir prospective_pregame \
            --run-id "$GITHUB_RUN_ID"
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('prospective_pregame')
          r=json.loads((root/'multisport_native_capture_report.json').read_text())
          assert len(r['supported_leagues']) == 8
          assert r['per_league_model_gate']['nba'] == 'delegated_to_existing_nba_specialist_recorder'
          assert r['champion_001_modified'] is False
          assert r['certified_champion_001_predictions'] == 0
          assert r['certified_challenger_001_predictions'] == 0
          assert r['certified_positive_ev_bets'] == r['bet_ready_selections'] == r['automated_bets_placed'] == 0
          assert r['player_prop_probability_models_available'] == 0
          for line in (root/'native_multisport_forecasts.jsonl').read_text().splitlines():
            row=json.loads(line)
            assert row['market_type'] in ('moneyline','three_way_result')
            assert row['market_implied_probability_used_as_model'] is False
            assert row['qualified_for_calibration'] is False
            assert row['bet_ready'] is False
            assert row['champion_001_modified'] is False
          print('Multi-sport native research (uncertified) selections:', r['market_selections_captured_uncertified'])
          PY
      - name: Verify prospective timing and no model or betting promotion
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from datetime import datetime
          root=Path("prospective_pregame")
          p=json.loads((root/"prospective_report.json").read_text())
          for k in ("verified_historical_training_examples","direct_draftkings_checkout_quotes_verified",
                    "verified_player_availability_entries","certified_champion_001_predictions",
                    "certified_challenger_001_predictions","bet_ready_selections","automated_bets_placed"):
              assert p[k] == 0, (k,p[k])
          assert p["champion_001_modified"] is False
          for line in (root/"prospective_event_evidence.jsonl").read_text().splitlines():
              r=json.loads(line)
              assert datetime.fromisoformat(r["snapshot_completed_at_utc"]) < datetime.fromisoformat(r["event_start_utc"])
              assert r["qualified_for_challenger_backtest"] is False
              assert r["model_probability"] is None
              assert r["bet_ready"] is False and r["champion_001_modified"] is False
              for q in r["odds_observations"]:
                  assert datetime.fromisoformat(q["received_at_utc"]) < datetime.fromisoformat(r["event_start_utc"])
                  assert datetime.fromisoformat(q["received_at_utc"]) <= datetime.fromisoformat(r["snapshot_completed_at_utc"])
                  assert q["direct_draftkings_checkout_verified"] is False
                  assert q["player_available_verified"] is False
          print("Prospective snapshot restricted to research-only:",p["scheduled_pregame_events"],"scheduled games")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: challenger-prospective-evidence-${{ github.run_id }}
          path: |
            prospective_pregame/
            prospective_pregame_source_receipts.json
            challenger_results/prospective_source_inventory.json
            challenger_results/prospective_source_integrity.json
          retention-days: 90
          if-no-files-found: warn

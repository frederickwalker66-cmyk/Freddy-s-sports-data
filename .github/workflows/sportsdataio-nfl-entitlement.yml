name: SportsDataIO NFL entitlement probe
on:
  push:
    branches: [repair/nfl-live-ticket-feed-20261126]
    paths: ['.github/workflows/sportsdataio-nfl-entitlement.yml']
  workflow_dispatch:
jobs:
  nfl-entitlement:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SPORTSDATAIO_KEY: ${{ secrets.SPORTSDATA_IO || secrets.SPORTSDATAIO || secrets.SPORTSDATAIO_API_KEY }}
    steps:
      - name: Check NFL player statistics entitlement without exposing credentials
        shell: python
        run: |
          import json, os, urllib.request, urllib.error, sys
          key=os.environ.get("SPORTSDATAIO_KEY","")
          if not key:
              print("RESULT=HOLD; REASON=NO_MATCHING_SECRET_NAME")
              sys.exit(1)
          url="https://api.sportsdata.io/v3/nfl/stats/json/PlayerGameStatsByDate/2026-NOV-26"
          req=urllib.request.Request(url,headers={"Ocp-Apim-Subscription-Key":key,"Accept":"application/json"})
          try:
              with urllib.request.urlopen(req,timeout=18) as response:
                  body=response.read(2000000)
                  payload=json.loads(body)
                  if isinstance(payload,list):
                      print("HTTP=200; FORMAT=LIST; RECORDS="+str(len(payload)))
                      print("RESULT=ENTITLEMENT_RESPONSE_RECEIVED; LIVE_FRESHNESS=UNVERIFIED")
                  else:
                      print("HTTP=200; FORMAT=UNEXPECTED; RESULT=HOLD")
                      sys.exit(1)
          except urllib.error.HTTPError as exc:
              print("HTTP="+str(exc.code)+"; RESULT=HOLD; REASON=ACCESS_OR_ENDPOINT_FAILURE")
              sys.exit(1)
          except Exception as exc:
              print("RESULT=HOLD; REASON="+type(exc).__name__)
              sys.exit(1)

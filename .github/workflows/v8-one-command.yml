                                    "|---|---|---|---:|---:|---|"])
                      for prop in prop_watch[:5]:
                          lines.append(f"| {prop['league'].upper()} | {prop['player_name']} | {prop['prop_stat']} | {prop['line']} | {prop['over_no_vig_market_change_pp']:+.4f} | HOLD |")
                  else:
                      lines.append("**No qualifying upcoming two-sided same-line prop repricing detected.**")
                  lines.extend(["", "## NBA/NFL Prop Price Probabilities",
                      "**Over/Under no-vig market percentages and break-even percentages use paired bookmaker-labeled prices; player identity and model projections are NOT independently verified.**",
                      "| Sport | Player | Stat | Line | Over/Under prices | O/U no-vig % | O/U break-even % | Model / EV |",
                      "|---|---|---|---:|---|---|---|---|"])
                  propboards=props.get("today_player_prop_market_probability_board") or {}
                  count=0
                  for league in ("nba","nfl"):
                      for q in (propboards.get(league) or [])[:6]:
                          count+=1
                          lines.append(
                              f"| {league.upper()} | {q['player_name']} | {q['prop_stat']} | {q['line']:g} | "
                              f"{q['over_american_odds']:+g}/{q['under_american_odds']:+g} | "
                              f"{q['first_side_no_vig_market_percent']:.2f}%/{q['second_side_no_vig_market_percent']:.2f}% | "
                              f"{q['first_side_break_even_percent']:.2f}%/{q['second_side_break_even_percent']:.2f}% | N/A / HOLD |")
                  if not count:
                      lines.append("| No current two-sided prop markets | — | — | — | — | — | — | HOLD |")
                  lines.append("**Verified independent sharp-bettor probability: UNAVAILABLE. Native calibrated model probability: UNAVAILABLE. Certified +EV: zero.**")
                  cal=r.get("sharp_edge_calibration") or {}
                  lines.extend(["", "## NBA + NFL Sharp Edge Calibration Status",
                      f"**Persisted original NBA research calibration:** {cal.get('persisted_nba_original_forward_calibration_status','UNKNOWN')}",
                      f"**NBA forward forecasts archived/graded/pending:** {cal.get('nba_original_archived_forecasts')} / {cal.get('nba_original_graded_outcomes')} / {cal.get('nba_original_pending_grading')}",
                      "**Exploratory original-forward Brier requires 50 grades; exploratory ECE requires 100 and adequately populated fixed bins.**",
                      "| Exact market | Mature graded original outcomes | Brier | ECE | Model calibration used? |",
                      "|---|---:|---:|---:|---|"])
                  for market,item in (cal.get("market_calibration") or {}).items():
                      n=item.get("eligible_original_model_forecasts_graded")
                      nstr=str(n) if type(n) is int else "Unknown"
                      b=item.get("research_brier_score")
                      e=item.get("research_expected_calibration_error")
                      lines.append(
                          f"| {market} | {nstr} | {f'{b:.4f}' if b is not None else 'Withheld'} | {f'{e:.4f}' if e is not None else 'Withheld'} | NO / HOLD |")
                  lines.append("**No validated NFL or prop-native probability/outcome calibration; no model recalibration, wagers, or independently verified positive EV.**")
              if r['command'] == 'run_mixed_market':
                  mixed=r.get('mixed_market_research') or {}
                  counts=mixed.get('displayed_reference_counts_by_market') or {}
                  lines.extend(["", "## Unified Games + Player Props — RESEARCH ONLY",
                      "| Market type | Current visible reference quotes |",
                      "|---|---:|"])
                  for market in ('moneyline','point_spread','total_points','player_prop'):
                      lines.append(f"| {market} | {counts.get(market,0)} |")
                  lines.append("**No native independently calibrated exact-market probability = no certified value bet.**")
                  lines.append("**5-leg joint probability / correlation / CLV:** Unavailable. HOLD, no bets placed.")
                  lines.append("See MIXED_MARKET_GAME_PROP_RESEARCH.json for exact archived quotes and exclusions.")
                  sgo=r.get('sportsgameodds_archive_research') or {}
                  lines.extend(["", "## SportsGameOdds — Separate Source Archive Research",
                                f"**Source capture:** {sgo.get('status','UNAVAILABLE')}",
                                f"**Archived source quote observations:** {sgo.get('rows_examined',0)}",
                                f"**Fresh source-labeled quote references (not checkout):** {sgo.get('recent_upcoming_quote_reference_count',0)}",
                                f"**Markets seen (research-only):** {sgo.get('source_labeled_quotes_by_market',{})}",
                                "**Model probability / certified EV:** unavailable / 0.",
                                "**No direct price or player identity verification; no automatic SharpAPI join.**",
                                "Full source report: SGO_SEPARATE_SOURCE_RESEARCH.json."])
              if r['command'] == 'run_edge':
                  lines.append(f"Indicative research edges: {len(r['research_edge_candidates'])} (no independently verified executable quotes).")
              if r['command'] == 'model_status':
                  lines.append(f"NBA status: {r['model_status']['milestone_a']}.")
              text="\n".join(lines)+"\n"
              print(text)
              summary=os.getenv("GITHUB_STEP_SUMMARY")
              if summary: Path(summary).open("a").write(text)
          PY
      - name: Always show percentages and Sharp Edge on every run
        if: always()
        shell: bash
        run: |
          report="v8_results/one_command/PROBABILITY_SHARP_EDGE_DASHBOARD.md"
          if test -f "$report"; then
            cat "$report"
            if test -n "${GITHUB_STEP_SUMMARY:-}"; then
              cat "$report" >> "$GITHUB_STEP_SUMMARY"
            fi
          else
            echo "Probability and Sharp Edge: N/A — no completed validated model report (HOLD)."
            if test -n "${GITHUB_STEP_SUMMARY:-}"; then
              echo "## Probabilities and Sharp Edge — N/A (run incomplete, HOLD)" >> "$GITHUB_STEP_SUMMARY"
            fi
          fi
      - name: Downloadable historical data + status
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v8-one-command-${{ github.event_name == 'workflow_run' && github.event.workflow_run.name == 'SportsGameOdds NBA NFL MLB research — manual capped intake' && 'run_mixed_market' || github.event_name == 'workflow_run' && 'run_sharp' || github.event_name == 'push' && contains(github.event.head_commit.message, '[run-readiness]') && 'run_readiness' || github.event_name == 'push' && contains(github.event.head_commit.message, '[run-arbitrage-research]') && 'run_arbitrage' || github.event_name == 'push' && contains(github.event.head_commit.message, '[run-nba]') && 'run_nba' || github.event_name == 'push' && contains(github.event.head_commit.message, '[run-five-leg]') && 'run_mixed_market' || github.event_name == 'push' && contains(github.event.head_commit.message, '[run-nba-best-bets]') && 'run_nba_best_bets' || github.event.schedule == '17 21 * * *' && 'run_nba_best_bets' || github.event_name == 'push' && 'run_nba_grade' || github.event.schedule == '53 13 * * *' && 'run_nba_grade' || github.event.schedule == '37 20 * * *' && 'run_nba_forward' || inputs.command || 'run_sports' }}-${{ github.run_id }}
          path: v8_results/one_command/
          retention-days: 90
          if-no-files-found: warn

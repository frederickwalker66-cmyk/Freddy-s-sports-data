      - name: Always show percentages and Sharp Edge on every run
        if: always()
        shell: bash
        run: |
          report="v8_results/one_command/PROBABILITY_SHARP_EDGE_DASHBOARD.md"
          if test -f "$report"; then
            cat "$report"
            if test -n "${GITHUB_STEP_SUMMARY:-}"; then
              cat "$report" >> "$GITHUB_STEP_SUMMARY"
            fi
          elif test -f "v8_results/one_command/FULL_STACK_ALL_IN_ONE_REPORT.md"; then
            echo "Probability and Sharp Edge: see FULL_STACK_MARKET_PROBABILITIES.json and FULL_STACK_ALL_IN_ONE_REPORT.md (HOLD; not model-certified)."
            if test -n "${GITHUB_STEP_SUMMARY:-}"; then
              echo "## Probabilities & Sharp Edge — included in full-stack model report above (HOLD / research-only)" >> "$GITHUB_STEP_SUMMARY"
            fi
          else
            echo "Probability and Sharp Edge: N/A — no completed validated model report (HOLD)."
            if test -n "${GITHUB_STEP_SUMMARY:-}"; then
              echo "## Probabilities and Sharp Edge — N/A (run incomplete, HOLD)" >> "$GITHUB_STEP_SUMMARY"
            fi
          fi
      - name: Display NBA player-prop evidence gaps without provider calls
        if: always()
        shell: bash
        run: |
          report="v8_results/one_command/NBA_PROP_CAPTURE_READINESS.md"
          if test -f "$report"; then
            cat "$report"
            if test -n "${GITHUB_STEP_SUMMARY:-}"; then
              cat "$report" >> "$GITHUB_STEP_SUMMARY"
            fi
          fi
      - name: Always display BEST BET TAKE PASS HOLD
        if: always()
        shell: bash
        run: |
          mkdir -p v8_results/one_command
          python -m research.nba_all_markets_best_bet > v8_results/one_command/NBA_BEST_BET_STATUS.json
          python - <<'PY'
          import json, os
          from pathlib import Path
          r=json.loads(Path("v8_results/one_command/NBA_BEST_BET_STATUS.json").read_text())
          lines=["## NBA BEST BET — All 20 Markets",
                 "**Best Bet: HOLD — no independently verified positive-EV selection.**",
                 "**TAKE: 0 | PASS: 0 | Markets awaiting evidence: HOLD.**",
                 "Game moneylines, spreads, totals O/U, player PTS/REB/AST/3PM O/U and PR/PA/RA/PRA O/U are covered.",
                 "No fabricated Champion-001 probabilities, DraftKings prices, or certified bets."]
          text="\\n".join(lines)+"\\n"
          Path("v8_results/one_command/NBA_BEST_BET_STATUS.md").write_text(text)
          print(text)
          if os.environ.get("GITHUB_STEP_SUMMARY"):
              with open(os.environ["GITHUB_STEP_SUMMARY"],"a") as f:f.write(text)
          PY
      - name: Publish observed sanitized run evidence status
        if: always()
        run: python v8_live_evidence_status.py
      - name: Downloadable historical data + status
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v8-one-command-${{ github.event_name == 'workflow_run' && 'run_sharp' || github.event_name == 'push' && contains(github.event.head_commit.message, '[run-sharp]') && 'run_sharp' || github.event_name == 'push' && contains(github.event.head_commit.message, '[run-audit]') && 'run_audit' || github.event_name == 'push' && contains(github.event.head_commit.message, '[run-readiness]') && 'run_readiness' || github.event_name == 'push' && contains(github.event.head_commit.message, '[run-calibration]') && 'run_calibration' || github.event_name == 'push' && contains(github.event.head_commit.message, '[run-arbitrage-research]') && 'run_arbitrage' || github.event.schedule == '23 9 * * 0' && 'run_all' || github.event_name == 'push' && contains(github.event.head_commit.message, '[run-full-stack]') && 'run_all' || github.event_name == 'push' && contains(github.event.head_commit.message, '[run-nba-nfl]') && 'run_nba_nfl' || github.event_name == 'push' && contains(github.event.head_commit.message, '[run-nba]') && 'run_nba_best_bets' || github.event_name == 'push' && contains(github.event.head_commit.message, '[run-five-leg]') && 'run_mixed_market' || github.event_name == 'push' && contains(github.event.head_commit.message, '[run-nba-best-bets]') && 'run_nba_best_bets' || github.event.schedule == '17 21 * * *' && 'run_nba_best_bets' || github.event_name == 'push' && 'run_nba_grade' || github.event.schedule == '53 13 * * *' && 'run_nba_grade' || github.event.schedule == '37 20 * * *' && 'run_nba_forward' || inputs.command || 'run' }}-${{ github.run_id }}
          path: v8_results/one_command/
          retention-days: 90
          if-no-files-found: warn

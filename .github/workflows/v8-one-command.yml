name: Freddy's Picks AI V8 — One Command (phone + laptop)
on:
  workflow_dispatch:
    inputs:
      command:
        description: 'Research command to run (no paid API and no bets)'
        required: true
        type: choice
        default: run_mixed_market
        options:
          - run_nfl_props_edge
          - run_mixed_market
          - run_arbitrage
          - model_status
          - run_nba
          - run_nba_best_bets
          - run_sports
          - run_nfl
          - run_nhl
          - run_mlb
          - run_ncaaf
          - run_ncaab
          - run_mls
          - run_uefa
          - run_edge
          - run_sharp
          - run_health
          - run_certify
          - run_audit
          - run_readiness
          - run_nba_train
          - run_nba_oos
          - run_nba_forward
          - run_nfl_forward
          - run_nhl_forward
          - run_sport_board
          - run_nba_grade
          - run_leaderboard
          - run_calibration
      days:
        description: 'Historical days per league, 1–35 (public sources only)'
        required: true
        type: choice
        default: '7'
        options: ['1', '7', '14', '35']
      end_date:
        description: 'Optional YYYY-MM-DD historical end date (must be before today)'
        required: false
        type: string
  schedule:
    - cron: '23 9 * * 0' # Weekly all-eight public research capture, no API fees
    - cron: '37 20 * * *' # Best-effort daily actual clock-time NBA research forecasts (15:37 EST / 16:37 EDT)
    - cron: '53 13 * * *' # Best-effort daily NBA forward outcome grading, 48h maturation
    - cron: '17 21 * * *' # Complete NBA slate and archived markets daily 16:17 EST/17:17 EDT, research only
  # Automatically replay archived Sharp prices after a successful paid collector
  # run. The replay reads artifacts only; it never calls SharpAPI itself.
  workflow_run:
    workflows: ['Collect SharpAPI DraftKings pregame odds', 'SportsGameOdds NBA NFL MLB research — manual capped intake']
    types: [completed]
    branches: [main]
  push:
    branches: [main]
    paths:
      - '.github/workflows/v8-one-command.yml'
      - 'v8_one_command.py'
      - 'v8_nba_slate_best_bets.py'
      - 'v8_nba_player_prop_dashboard.py'
      - 'tests/test_v8_nba_slate_best_bets.py'
      - 'v8_edge_value.py'
      - 'v8_probability_edge_dashboard.py'
      - 'tests/test_v8_probability_edge_dashboard.py'
      - 'v8_mixed_market_board.py'
      - 'v8_sgo_research.py'
      - 'tests/test_v8_sgo_research.py'
      - 'tests/test_v8_mixed_market_board.py'
      - 'v8_sharp_archive.py'
      - 'v8_arbitrage_research.py'
      - 'v8_sharp_player_props.py'
      - 'v8_sharp_game_markets.py'
      - 'v8_sharp_probability_display.py'
      - 'v8_sharp_calibration_dashboard.py'
      - 'v8_source_cadence_watchdog.py'
      - 'v8_certification_audit.py'
      - 'v8_betting_readiness.py'
      - 'tests/test_v8_betting_readiness.py'
      - 'v8_nba_training_intake.py'
      - 'v8_nba_oos_research.py'
      - 'v8_nba_paired_baseline.py'
      - 'v8_nba_forward_research.py'
      - 'v8_nba_rest_form_features.py'
      - 'tests/test_v8_nba_rest_form_features.py'
      - 'v8_nba_five_leg_preflight.py'
      - 'tests/test_v8_nba_five_leg_preflight.py'
      - 'v8_nba_player_recent_form.py'
      - 'tests/test_v8_nba_player_recent_form.py'
      - 'v8_nba_player_form_pipeline.py'
      - 'tests/test_v8_nba_player_form_pipeline.py'
      - 'v8_clv_reconciliation.py'
      - 'tests/test_v8_clv_reconciliation.py'
      - 'challenger_nba_player_boxes.py'
      - 'tests/test_v8_nba_forward_research.py'
      - 'v8_nfl_nhl_forward.py'
      - 'v8_nfl_nhl_board_view.py'
      - 'v8_nba_forward_grade.py'
      - 'v8_forward_leaderboard_view.py'
      - 'v8_forward_calibration_view.py'
  pull_request:
    paths:
      - 'v8_one_command.py'
      - 'v8_nba_slate_best_bets.py'
      - 'v8_nba_player_prop_dashboard.py'
      - 'tests/test_v8_nba_slate_best_bets.py'
      - 'v8_edge_value.py'
      - 'v8_probability_edge_dashboard.py'
      - 'tests/test_v8_probability_edge_dashboard.py'
      - 'tests/test_v8_one_command.py'
      - 'v8_mixed_market_board.py'
      - 'v8_sgo_research.py'
      - 'tests/test_v8_mixed_market_board.py'
      - 'tests/test_v8_sgo_research.py'
      - 'tests/test_v8_sharp_archive.py'
      - 'tests/test_v8_arbitrage_research.py'
      - 'tests/test_v8_sharp_player_props.py'
      - 'tests/test_v8_sharp_game_markets.py'
      - 'tests/test_v8_sharp_probability_display.py'
      - 'tests/test_v8_sharp_calibration_dashboard.py'
      - 'v8_sharp_player_props.py'
      - 'v8_sharp_game_markets.py'
      - 'v8_sharp_archive.py'
      - 'v8_arbitrage_research.py'
      - 'tests/test_v8_source_cadence_watchdog.py'
      - 'tests/test_v8_certification_audit.py'
      - 'v8_betting_readiness.py'
      - 'tests/test_v8_betting_readiness.py'
      - 'tests/test_v8_nba_training_intake.py'
      - 'tests/test_v8_nba_oos_research.py'
      - 'tests/test_v8_nba_paired_baseline.py'
      - 'tests/test_v8_nba_forward_research.py'
      - 'v8_nba_forward_research.py'
      - 'v8_nba_rest_form_features.py'
      - 'tests/test_v8_nba_rest_form_features.py'
      - 'v8_nba_five_leg_preflight.py'
      - 'tests/test_v8_nba_five_leg_preflight.py'
      - 'v8_nba_player_recent_form.py'
      - 'tests/test_v8_nba_player_recent_form.py'
      - 'v8_nba_player_form_pipeline.py'
      - 'tests/test_v8_nba_player_form_pipeline.py'
      - 'v8_clv_reconciliation.py'
      - 'tests/test_v8_clv_reconciliation.py'
      - 'challenger_nba_player_boxes.py'
      - 'tests/test_v8_nfl_nhl_forward.py'
      - 'tests/test_v8_nfl_nhl_board_view.py'
      - 'tests/test_v8_nfl_nhl_forward_grade.py'
      - 'tests/test_v8_nfl_nhl_durable_ledger.py'
      - 'tests/test_v8_nba_forward_grade.py'
      - 'tests/test_v8_forward_leaderboard_view.py'
      - 'tests/test_v8_durable_forward_ledger.py'
      - 'tests/test_v8_forward_calibration.py'
      - 'tests/test_v8_forward_calibration_view.py'
      - '.github/workflows/v8-one-command.yml'
permissions:
  contents: read
jobs:
  offline-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-calibration.txt
      - name: Test mobile commands, leakage guards and EV math
        run: python -m unittest discover -s tests -p 'test_v8_*.py' -v
  cloud-research:
    permissions:
      contents: read
      actions: read
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || github.event_name == 'push' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    needs: offline-safety
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-calibration.txt
      - name: Retrieve recent completed SharpAPI research archives (no API charges)
        if: ${{ inputs.command == 'run_sharp' || inputs.command == 'run_nfl_props_edge' || inputs.command == 'run_mixed_market' || inputs.command == 'run_nba_best_bets' || github.event.schedule == '17 21 * * *' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[run-nba-best-bets]')) || inputs.command == 'run_arbitrage' || inputs.command == 'run_readiness' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[run-arbitrage-research]')) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[run-readiness]')) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[run-five-leg]')) || github.event_name == 'workflow_run' }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p saved_sharp_archives
          mapfile -t ids < <(gh run list --repo "$GITHUB_REPOSITORY" --workflow collect-sharpapi.yml --branch main --status success --limit 5 --json databaseId --jq '.[].databaseId')
          count=0
          for rid in "${ids[@]}"; do
            if gh run download "$rid" --repo "$GITHUB_REPOSITORY" --name "sharpapi-pregame-$rid" --dir "saved_sharp_archives/$rid"; then
              count=$((count+1))
            else
              rm -rf "saved_sharp_archives/$rid"
              echo "Archived SharpAPI run $rid unavailable; no observations fabricated."
            fi
          done
          echo "Archived SharpAPI runs downloaded: $count"
      - name: Retrieve last completed SportsGameOdds source artifact — no paid API requests
        if: ${{ inputs.command == 'run_mixed_market' || inputs.command == 'run_nba_best_bets' || github.event.schedule == '17 21 * * *' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[run-nba-best-bets]')) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[run-five-leg]')) || (github.event_name == 'workflow_run' && github.event.workflow_run.name == 'SportsGameOdds NBA NFL MLB research — manual capped intake' && github.event.workflow_run.conclusion == 'success') }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p saved_sgo_archives
          latest="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow sportsgameodds-research.yml --branch main --status success --limit 1 --json databaseId --jq '.[0].databaseId // ""' || true)"
          if [[ "$latest" =~ ^[0-9]+$ ]] && gh run download "$latest" --repo "$GITHUB_REPOSITORY" --name "sgo-draftkings-research-$latest" --dir "saved_sgo_archives/$latest"; then
            echo "Downloaded stored SportsGameOdds research run $latest. Source data is not authenticated sportsbook checkout."
          else
            echo "No completed SportsGameOdds source artifact. Reporting missing data, not synthetic lines."
          fi
      - name: Read actual source-run status for phone health view (no dispatch)
        if: ${{ inputs.command == 'run_health' }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p v8_results
          if gh api "repos/$GITHUB_REPOSITORY/actions/workflows/challenger-eight-sport-source-preflight.yml/runs?per_page=100" > v8_results/source_runs.json; then
            echo "Actual main-source workflow metadata fetched."
          else
            echo '{"fetch_error": true}' > v8_results/source_runs.json
            echo "Metadata unavailable: reporting unknown instead of invented data."
          fi
      - name: Load last completed real source and price audit receipts for certification review
        if: ${{ inputs.command == 'run_certify' || inputs.command == 'run_audit' }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p cert_upstream/source cert_upstream/sharp
          src_id="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow challenger-eight-sport-source-preflight.yml --branch main --status success --limit 1 --json databaseId --jq '.[0].databaseId // ""' || true)"
          if [[ "$src_id" =~ ^[0-9]+$ ]]; then
            if gh run download "$src_id" --repo "$GITHUB_REPOSITORY" --name "eight-sport-source-preflight-$src_id" --dir cert_upstream/source; then
              echo "$src_id" > cert_upstream/source_run_id
            else
              echo "Source artifact unavailable; cannot establish model validation."
              rm -rf cert_upstream/source && mkdir -p cert_upstream/source
            fi
          fi
          sharp_id="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow collect-sharpapi.yml --branch main --status success --limit 1 --json databaseId --jq '.[0].databaseId // ""' || true)"
          if [[ "$sharp_id" =~ ^[0-9]+$ ]]; then
            if gh run download "$sharp_id" --repo "$GITHUB_REPOSITORY" --name "sharpapi-pregame-$sharp_id" --dir cert_upstream/sharp; then
              echo "$sharp_id" > cert_upstream/sharp_run_id
            else
              echo "SharpAPI archived market reference unavailable; no price verification."
              rm -rf cert_upstream/sharp && mkdir -p cert_upstream/sharp
            fi
          fi
          echo "Research artifacts loaded if available. No paid API, betting or external certification."
      - name: Reconcile saved outcomes and calibration audits without paid source calls
        if: ${{ inputs.command == 'run_audit' }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audit_upstream/outcome audit_upstream/calibration
          outcome_id="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow challenger-prospective-outcome-validation.yml --branch main --status success --limit 1 --json databaseId --jq '.[0].databaseId // ""' || true)"
          if [[ "$outcome_id" =~ ^[0-9]+$ ]]; then
            if gh run download "$outcome_id" --repo "$GITHUB_REPOSITORY" --name "challenger-prospective-outcome-validation-$outcome_id" --dir audit_upstream/outcome; then
              echo "$outcome_id" > audit_upstream/outcome_run_id
            else
              rm -rf audit_upstream/outcome && mkdir -p audit_upstream/outcome
              echo "Outcome source missing: explicit unknown; no fabricated training."
            fi
          fi
          calibration_id="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow challenger-isotonic-calibration.yml --branch main --status success --limit 1 --json databaseId --jq '.[0].databaseId // ""' || true)"
          if [[ "$calibration_id" =~ ^[0-9]+$ ]]; then
            if gh run download "$calibration_id" --repo "$GITHUB_REPOSITORY" --name "challenger-isotonic-research-$calibration_id" --dir audit_upstream/calibration; then
              echo "$calibration_id" > audit_upstream/calibration_run_id
            else
              rm -rf audit_upstream/calibration && mkdir -p audit_upstream/calibration
              echo "Calibration source missing: explicit unknown; no fake calibration."
            fi
          fi
          echo "Read-only audit receives only completed saved GH artifacts; no provider API calls."
      - name: Read previous prospective NBA original-capture review artifacts (no paid API)
        if: ${{ inputs.command == 'run_nba_train' }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p nba_original_reviews
          mapfile -t ids < <(gh run list --repo "$GITHUB_REPOSITORY" --workflow challenger-prospective-outcome-validation.yml --branch main --status success --limit 4 --json databaseId --jq '.[].databaseId' || true)
          success=0
          for rid in "${ids[@]}"; do
            if gh run download "$rid" --repo "$GITHUB_REPOSITORY" --name "challenger-prospective-outcome-validation-$rid" --dir "nba_original_reviews/$rid"; then
              success=$((success+1))
            else
              rm -rf "nba_original_reviews/$rid"
              echo "Earlier review artifact $rid unavailable; no retrospective rows added."
            fi
          done
          echo "Prospective review artifacts downloaded for independent intake: $success"
      - name: Retrieve completed NBA forward research artifacts and original GitHub run metadata
        if: ${{ inputs.command == 'run_nba_grade' || github.event.schedule == '53 13 * * *' || github.event_name == 'push' }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p saved_nba_forward_archives
          mapfile -t ids < <(gh run list --repo "$GITHUB_REPOSITORY" --workflow v8-one-command.yml --branch main --status success --limit 35 --json databaseId --jq '.[].databaseId')
          downloaded=0
          for rid in "${ids[@]}"; do
            [[ "$rid" =~ ^[0-9]+$ ]] || continue
            artifact_name="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$rid/artifacts" --jq '.artifacts[].name' 2>/dev/null | grep -E "^v8-one-command-run_nba_(forward|oos)-${rid}$" | head -n 1 || true)"
            [[ -n "$artifact_name" ]] || continue
            dest="saved_nba_forward_archives/$rid"
            mkdir -p "$dest"
            if gh api "repos/$GITHUB_REPOSITORY/actions/runs/$rid" > "$dest/github_run.json" \
               && gh run download "$rid" --repo "$GITHUB_REPOSITORY" --name "$artifact_name" --dir "$dest"; then
              downloaded=$((downloaded+1))
            else
              echo "Source run $rid could not be downloaded; it is excluded from grading."
              rm -rf "$dest"
            fi
          done
          echo "Original completed forward-run artifacts downloaded: $downloaded"
      - name: Download persisted research leaderboard from dedicated long-lived Git branch
        if: ${{ inputs.command == 'run_leaderboard' || inputs.command == 'run_calibration' || inputs.command == 'run_readiness' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[run-readiness]')) || inputs.command == 'run_sharp' || inputs.command == 'run_nfl_props_edge' || inputs.command == 'run_mixed_market' || inputs.command == 'run_nba_best_bets' || github.event.schedule == '17 21 * * *' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[run-nba-best-bets]')) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[run-five-leg]')) || github.event_name == 'workflow_run' }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p v8_results/leaderboard_download
          if gh api "repos/$GITHUB_REPOSITORY/contents/data/v8_forward/LEADERBOARD.json?ref=research%2Fforward-ledger" --jq '.content' > v8_results/leaderboard_download/encoded.txt; then
            if base64 --decode v8_results/leaderboard_download/encoded.txt > v8_results/leaderboard_download/LEADERBOARD.json; then
              echo "Read persisted research leaderboard from dedicated Git branch."
            else
              rm -f v8_results/leaderboard_download/LEADERBOARD.json
              echo "Stored research leaderboard bytes unavailable or invalid; will report NOT_YET_PERSISTED."
            fi
          else
            echo "Durable branch or scorecard unavailable; will report NOT_YET_PERSISTED."
          fi
          if gh api "repos/$GITHUB_REPOSITORY/contents/data/v8_forward/CALIBRATION.json?ref=research%2Fforward-ledger" --jq '.content' > v8_results/leaderboard_download/calibration_encoded.txt; then
            if base64 --decode v8_results/leaderboard_download/calibration_encoded.txt > v8_results/leaderboard_download/CALIBRATION.json; then
              echo "Read original-forward NBA research calibration from durable ledger branch."
            else
              rm -f v8_results/leaderboard_download/CALIBRATION.json
              echo "Saved calibration unavailable; must report NOT_YET_PERSISTED."
            fi
          else
            echo "Calibration not created yet; no statistics inferred."
          fi
      - name: Read previously persisted NFL and NHL research scorecards (no collector)
        if: ${{ inputs.command == 'run_sport_board' }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p v8_results/sport_board
          for lg in nfl nhl; do
            file="v8_results/sport_board/${lg}.json"
            if gh api "repos/$GITHUB_REPOSITORY/contents/data/v8_forward/${lg}/FORWARD_RESEARCH_LEADERBOARD.json?ref=research%2Fnfl-nhl-forward-ledger" --jq '.content' | base64 --decode > "$file"; then
              echo "Loaded genuine persisted $lg research report."
            else
              rm -f "$file"
              echo "No verified persistent $lg report yet; show NOT_YET_PERSISTED, not invented zero."
            fi
          done
      - name: Run requested model research command
        env:
          SELECTED_COMMAND: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.name == 'SportsGameOdds NBA NFL MLB research — manual capped intake' && 'run_mixed_market' || github.event_name == 'workflow_run' && 'run_sharp' || github.event_name == 'push' && contains(github.event.head_commit.message, '[run-readiness]') && 'run_readiness' || github.event_name == 'push' && contains(github.event.head_commit.message, '[run-arbitrage-research]') && 'run_arbitrage' || github.event_name == 'push' && contains(github.event.head_commit.message, '[run-nba]') && 'run_nba' || github.event_name == 'push' && contains(github.event.head_commit.message, '[run-five-leg]') && 'run_mixed_market' || github.event_name == 'push' && contains(github.event.head_commit.message, '[run-nba-best-bets]') && 'run_nba_best_bets' || github.event.schedule == '17 21 * * *' && 'run_nba_best_bets' || github.event_name == 'push' && 'run_nba_grade' || github.event.schedule == '53 13 * * *' && 'run_nba_grade' || github.event.schedule == '37 20 * * *' && 'run_nba_forward' || inputs.command || 'run_sports' }}
          HISTORY_DAYS: ${{ (github.event.schedule == '37 20 * * *' || github.event.schedule == '17 21 * * *' || inputs.command == 'run_nba_best_bets' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[run-nba-best-bets]')) || inputs.command == 'run_nba_forward' || inputs.command == 'run_nfl_forward' || inputs.command == 'run_nhl_forward') && '35' || inputs.days || '7' }}
          HISTORY_END_DATE: ${{ inputs.end_date }}
        shell: bash
        run: |
          set -euo pipefail
          params=(--command "$SELECTED_COMMAND" --days "$HISTORY_DAYS"
                  --output-dir v8_results/one_command)
          if [[ -n "$HISTORY_END_DATE" ]]; then
            params+=(--end-date "$HISTORY_END_DATE")
          fi
          if [[ "$SELECTED_COMMAND" == "run_sport_board" ]]; then
            params+=(--nfl-board-file v8_results/sport_board/nfl.json
                     --nhl-board-file v8_results/sport_board/nhl.json)
          fi
          if [[ "$SELECTED_COMMAND" == "run_readiness" ]]; then
            params+=(--sharp-archive-dir saved_sharp_archives
                     --calibration-file v8_results/leaderboard_download/CALIBRATION.json)
          fi
          if [[ "$SELECTED_COMMAND" == "run_calibration" ]]; then
            params+=(--calibration-file v8_results/leaderboard_download/CALIBRATION.json)
          fi
          if [[ "$SELECTED_COMMAND" == "run_leaderboard" ]]; then
            params+=(--leaderboard-file v8_results/leaderboard_download/LEADERBOARD.json)
          fi
          if [[ "$SELECTED_COMMAND" == "run_nba_grade" ]]; then
            params+=(--nba-grade-archives-dir saved_nba_forward_archives)
          fi
          if [[ "$SELECTED_COMMAND" == "run_nba_train" ]]; then
            params+=(--nba-review-dir nba_original_reviews)
          fi
          if [[ "$SELECTED_COMMAND" == "run_certify" || "$SELECTED_COMMAND" == "run_audit" ]]; then
            params+=(--certification-source-dir cert_upstream/source
                     --certification-sharp-dir cert_upstream/sharp)
            if [[ -f cert_upstream/source_run_id ]]; then
              params+=(--certification-source-run-id "$(cat cert_upstream/source_run_id)")
            fi
            if [[ -f cert_upstream/sharp_run_id ]]; then
              params+=(--certification-sharp-run-id "$(cat cert_upstream/sharp_run_id)")
            fi
          fi
          if [[ "$SELECTED_COMMAND" == "run_audit" ]]; then
            params+=(--audit-outcome-dir audit_upstream/outcome
                     --audit-calibration-dir audit_upstream/calibration)
            if [[ -f audit_upstream/outcome_run_id ]]; then
              params+=(--audit-outcome-run-id "$(cat audit_upstream/outcome_run_id)")
            fi
            if [[ -f audit_upstream/calibration_run_id ]]; then

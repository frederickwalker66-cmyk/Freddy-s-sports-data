name: Freddy's Picks AI V8 — One Command (phone + laptop)
on:
  workflow_dispatch:
    inputs:
      command:
        description: 'Research command to run (no paid API and no bets)'
        required: true
        type: choice
        default: model_status
        options:
          - model_status
          - run_nba
          - run_sports
          - run_nfl
          - run_nhl
          - run_mlb
          - run_ncaaf
          - run_ncaab
          - run_mls
          - run_uefa
          - run_edge
          - run_sharp
          - run_health
          - run_certify
          - run_nba_train
          - run_nba_oos
      days:
        description: 'Historical days per league, 1–35 (public sources only)'
        required: true
        type: choice
        default: '7'
        options: ['1', '7', '14', '35']
      end_date:
        description: 'Optional YYYY-MM-DD historical end date (must be before today)'
        required: false
        type: string
  schedule:
    - cron: '23 9 * * 0' # Weekly all-eight public research capture, no API fees
  # Automatically replay archived Sharp prices after a successful paid collector
  # run. The replay reads artifacts only; it never calls SharpAPI itself.
  workflow_run:
    workflows: ['Collect SharpAPI DraftKings pregame odds']
    types: [completed]
    branches: [main]
  push:
    branches: [main]
    paths:
      - '.github/workflows/v8-one-command.yml'
      - 'v8_one_command.py'
      - 'v8_edge_value.py'
      - 'v8_sharp_archive.py'
      - 'v8_source_cadence_watchdog.py'
      - 'v8_certification_audit.py'
      - 'v8_nba_training_intake.py'
      - 'v8_nba_oos_research.py'
      - 'v8_nba_paired_baseline.py'
  pull_request:
    paths:
      - 'v8_one_command.py'
      - 'v8_edge_value.py'
      - 'tests/test_v8_one_command.py'
      - 'tests/test_v8_sharp_archive.py'
      - 'tests/test_v8_source_cadence_watchdog.py'
      - 'tests/test_v8_certification_audit.py'
      - 'tests/test_v8_nba_training_intake.py'
      - 'tests/test_v8_nba_oos_research.py'
      - 'tests/test_v8_nba_paired_baseline.py'
      - '.github/workflows/v8-one-command.yml'
permissions:
  contents: read
jobs:
  offline-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-calibration.txt
      - name: Test mobile commands, leakage guards and EV math
        run: python -m unittest discover -s tests -p 'test_v8_*.py' -v
  cloud-research:
    permissions:
      contents: read
      actions: read
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || github.event_name == 'push' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    needs: offline-safety
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-calibration.txt
      - name: Retrieve recent completed SharpAPI research archives (no API charges)
        if: ${{ inputs.command == 'run_sharp' || github.event_name == 'workflow_run' }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p saved_sharp_archives
          mapfile -t ids < <(gh run list --repo "$GITHUB_REPOSITORY" --workflow collect-sharpapi.yml --branch main --status success --limit 5 --json databaseId --jq '.[].databaseId')
          count=0
          for rid in "${ids[@]}"; do
            if gh run download "$rid" --repo "$GITHUB_REPOSITORY" --name "sharpapi-pregame-$rid" --dir "saved_sharp_archives/$rid"; then
              count=$((count+1))
            else
              rm -rf "saved_sharp_archives/$rid"
              echo "Archived SharpAPI run $rid unavailable; no observations fabricated."
            fi
          done
          echo "Archived SharpAPI runs downloaded: $count"
      - name: Read actual source-run status for phone health view (no dispatch)
        if: ${{ inputs.command == 'run_health' }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p v8_results
          if gh api "repos/$GITHUB_REPOSITORY/actions/workflows/challenger-eight-sport-source-preflight.yml/runs?per_page=100" > v8_results/source_runs.json; then
            echo "Actual main-source workflow metadata fetched."
          else
            echo '{"fetch_error": true}' > v8_results/source_runs.json
            echo "Metadata unavailable: reporting unknown instead of invented data."
          fi
      - name: Load last completed real source and price audit receipts for certification review
        if: ${{ inputs.command == 'run_certify' }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p cert_upstream/source cert_upstream/sharp
          src_id="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow challenger-eight-sport-source-preflight.yml --branch main --status success --limit 1 --json databaseId --jq '.[0].databaseId // ""' || true)"
          if [[ "$src_id" =~ ^[0-9]+$ ]]; then
            if gh run download "$src_id" --repo "$GITHUB_REPOSITORY" --name "eight-sport-source-preflight-$src_id" --dir cert_upstream/source; then
              echo "$src_id" > cert_upstream/source_run_id
            else
              echo "Source artifact unavailable; cannot establish model validation."
              rm -rf cert_upstream/source && mkdir -p cert_upstream/source
            fi
          fi
          sharp_id="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow collect-sharpapi.yml --branch main --status success --limit 1 --json databaseId --jq '.[0].databaseId // ""' || true)"
          if [[ "$sharp_id" =~ ^[0-9]+$ ]]; then
            if gh run download "$sharp_id" --repo "$GITHUB_REPOSITORY" --name "sharpapi-pregame-$sharp_id" --dir cert_upstream/sharp; then
              echo "$sharp_id" > cert_upstream/sharp_run_id
            else
              echo "SharpAPI archived market reference unavailable; no price verification."
              rm -rf cert_upstream/sharp && mkdir -p cert_upstream/sharp
            fi
          fi
          echo "Research artifacts loaded if available. No paid API, betting or external certification."
      - name: Read previous prospective NBA original-capture review artifacts (no paid API)
        if: ${{ inputs.command == 'run_nba_train' || github.event_name == 'push' }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p nba_original_reviews
          mapfile -t ids < <(gh run list --repo "$GITHUB_REPOSITORY" --workflow challenger-prospective-outcome-validation.yml --branch main --status success --limit 4 --json databaseId --jq '.[].databaseId' || true)
          success=0
          for rid in "${ids[@]}"; do
            if gh run download "$rid" --repo "$GITHUB_REPOSITORY" --name "challenger-prospective-outcome-validation-$rid" --dir "nba_original_reviews/$rid"; then
              success=$((success+1))
            else
              rm -rf "nba_original_reviews/$rid"
              echo "Earlier review artifact $rid unavailable; no retrospective rows added."
            fi
          done
          echo "Prospective review artifacts downloaded for independent intake: $success"
      - name: Run requested model research command
        env:
          SELECTED_COMMAND: ${{ github.event_name == 'workflow_run' && 'run_sharp' || github.event_name == 'push' && 'run_nba_oos' || inputs.command || 'run_sports' }}
          HISTORY_DAYS: ${{ github.event_name == 'push' && '35' || inputs.days || '7' }}
          HISTORY_END_DATE: ${{ github.event_name == 'push' && '2026-02-15' || inputs.end_date }}
        shell: bash
        run: |
          set -euo pipefail
          params=(--command "$SELECTED_COMMAND" --days "$HISTORY_DAYS"
                  --output-dir v8_results/one_command)
          if [[ -n "$HISTORY_END_DATE" ]]; then
            params+=(--end-date "$HISTORY_END_DATE")
          fi
          if [[ "$SELECTED_COMMAND" == "run_nba_train" ]]; then
            params+=(--nba-review-dir nba_original_reviews)
          fi
          if [[ "$SELECTED_COMMAND" == "run_certify" ]]; then
            params+=(--certification-source-dir cert_upstream/source
                     --certification-sharp-dir cert_upstream/sharp)
            if [[ -f cert_upstream/source_run_id ]]; then
              params+=(--certification-source-run-id "$(cat cert_upstream/source_run_id)")
            fi
            if [[ -f cert_upstream/sharp_run_id ]]; then
              params+=(--certification-sharp-run-id "$(cat cert_upstream/sharp_run_id)")
            fi
          fi
          if [[ "$SELECTED_COMMAND" == "run_health" ]]; then
            params+=(--source-runs-json v8_results/source_runs.json)
          fi
          if [[ "$SELECTED_COMMAND" == "run_sharp" ]]; then
            params+=(--sharp-archive-dir saved_sharp_archives)
          fi
          python v8_one_command.py "${params[@]}"
      - name: Present report directly in phone run summary
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          p=Path("v8_results/one_command/ONE_COMMAND_REPORT.json")
          if not p.is_file():
              print("Research run failed before a validated report was produced.")
          else:
              r=json.loads(p.read_text())
              lines=[
                  "# Freddy's Picks AI — One Command",
                  f"**Command:** {r['command']}",
                  f"**Historic date ending:** {r['historical_end_et']}",
                  "**Certified picks and certified +EV bets: 0.**",
                  "**Status:** Historical published scores/research only; not an authenticated betting model.",
                  "",
                  "| Sport | Source days successful | Published games | Status |",
                  "|---|---:|---:|---|",
              ]
              for lg,info in r['by_league'].items():
                  lines.append(f"| {lg.upper()} | {info.get('successful_source_days','-')} | {info.get('completed_published_games','-')} | {info['status']} |")
              if r['command'] == 'run_nba_oos':
                  oos=r.get('nba_oos_research') or {}
                  lines.extend(["", "## NBA Archived-Score Retrospective Elo Evaluation",
                      f"**Research status:** {oos.get('status','UNKNOWN')}",
                      f"**Real published NBA regular-season games collected:** {oos.get('published_completed_games', 0)}",
                      f"**Successful source days:** {oos.get('source_days_successfully_returned', 0)}; failed: {oos.get('source_days_failed', 0)}",
                      f"**First games used as fixed-rule warmup:** {oos.get('warmup_games', 0)}",
                      f"**Later retrospectively simulated games:** {oos.get('retrospective_evaluation_games', 0)}",
                      f"**Exploratory Brier (not independently validated):** {oos.get('brier_score_retrospective_research_only')}",
                      f"**Exploratory log loss (not independently validated):** {oos.get('log_loss_retrospective_research_only')}",
                      f"**Neutral 50/50 Brier (NOT a sportsbook baseline):** {oos.get('neutral_50_50_brier_comparison_not_bookmaker')}",
                      f"**Moving prior home-win Brier (48h presumed results embargo):** {(oos.get('paired_rolling_home_baseline_comparison') or {}).get('rolling_home_win_baseline_brier')}",
                      f"**Elo Brier improvement relative to moving home-win prior (positive is better):** {(oos.get('paired_rolling_home_baseline_comparison') or {}).get('elo_minus_rolling_baseline_brier_improvement')}",
                      f"**Exploratory 95% game-day-cluster interval for improvement (not certification):** {(oos.get('paired_rolling_home_baseline_comparison') or {}).get('approximate_paired_day_bootstrap_brier_improvement_95pct_CI')}",
                      f"**Elo clearly better than moving prior under exploratory interval:** {(oos.get('paired_rolling_home_baseline_comparison') or {}).get('elo_beat_rolling_prior_with_exploratory_day_interval', False)}",
                      "**These probabilities were reconstructed after the games, not logged pregame. Certified model picks / EV remain 0.**",
                      "Download NBA_ELO_RETROSPECTIVE_REPORT.json and NBA_ELO_RETROSPECTIVE_LEDGER.jsonl for full research evidence."])
              if r['command'] == 'run_nba_train':
                  intake=r.get('nba_training_intake') or {}
                  lines.extend(["", "## NBA Original Evidence Intake & Training Readiness",
                      f"**Status:** {intake.get('status', 'UNKNOWN')}",
                      f"**Unique receipt-backed NBA events:** {intake.get('nba_unique_original_capture_events', 0)}",
                      f"**Original NBA packets with pregame features and published finals:** {intake.get('nba_manual_review_packets_with_pregame_features_and_published_finals', 0)}",
                      f"**Independently qualified training games:** {intake.get('independently_qualified_training_games', 0)} (minimum 200)",
                      f"**Independently qualified later holdout games:** {intake.get('independently_qualified_holdout_games', 0)} (minimum 50)",
                      f"**Native research model fitted:** {intake.get('native_research_model_fitted', False)}",
                      "**No training on automatic review packets, no certified model or positive EV bets.**",
                      "Download NBA_RESEARCH_INTAKE.json and NBA_ORIGINAL_REVIEW_WORKLIST.jsonl for review."])
              if r['command'] == 'run_certify':
                  audit=r.get('certification_review') or {}
                  lines.extend(["", "## Certification Evidence Audit — Real Existing GitHub Reports",
                      f"**Release:** {audit.get('status', 'UNKNOWN')}",
                      f"**Source run:** {audit.get('source_run_id') or 'not found'}",
                      f"**SharpAPI reference run:** {audit.get('sharp_run_id') or 'not found'}",
                      f"**Actual archived prospective events:** {audit.get('source_games_archived')}",
                      f"**Research market pairs, NOT verified odds:** {audit.get('research_moneyline_price_pairs_from_aggregator')}",
                      f"**Qualified native research models:** {', '.join(audit.get('native_research_models_seen',[])) or 'none'}",
                      "**Certified predictive probabilities: 0; certified +EV bets: 0.**",
                      "", "| League | Archived events | Independent game identities (research) | Trained research model |",
                      "|---|---:|---:|---|"])
                  for lg,info in (audit.get('by_league') or {}).items():
                      lines.append(f"| {lg.upper()} | {info['archived_source_games_latest_run']} | {info['league_operated_identity_matches_research_only']} | {info['native_research_model_fitted']} |")
                  lines.append("See downloadable CERTIFICATION_AUDIT.json for league-level blockers and missing independent evidence.")
              if r['command'] == 'run_health':
                  health=r.get('source_collection_health') or {}
                  lines.append("")
                  lines.append("## Source capture health (actual GitHub run metadata)")
                  lines.append(f"**Recovery assessment:** {health.get('recovery_decision','UNKNOWN')}")
                  lines.append(f"**Reason:** {health.get('reason','no metadata')}")
                  lines.append(f"**Last successful source run:** {health.get('latest_successful_workflow_completion_utc') or 'not observed'}")
                  lines.append(f"**Minutes since last completed source run:** {health.get('minutes_since_latest_successful_run')}")
                  lines.append(f"**Source runs currently in progress:** {len(health.get('in_flight_source_run_ids', []))}")
                  lines.append("No scheduled source collection is guaranteed. This status button never spends API credits or triggers a recovery.")
              if r['command'] == 'run_sharp':
                  sharp=r.get('sharp_archive') or {}
                  lines.append("")
                  lines.append(f"**SharpAPI archive status:** {sharp.get('status', 'not_available')}")
                  lines.append(f"**Archived primary moneyline quotes:** {sharp.get('valid_sharpapi_primary_moneyline_quote_observations', 0)}")
                  lines.append(f"**Observed historical line movements:** {sharp.get('observed_line_movements', 0)}")
                  lines.append(f"**Fresh upcoming movements (within {sharp.get('research_watchlist_max_age_minutes', 120)} minutes of capture):** {sharp.get('upcoming_market_movement_observations', 0)}")
                  lines.append(f"**Stale upcoming movements excluded:** {sharp.get('stale_upcoming_market_movement_observations_excluded', 0)}")
                  lines.append(f"**Sharp bet decision:** {sharp.get('sharp_bet_decision', 'PASS')} — research only.")
                  watch = sharp.get("ranked_market_movement_watchlist") or []
                  if watch:
                      lines.extend(["", "| League | Matchup | Move (home no-vig pp) | Decision |",
                                    "|---|---|---:|---|"])
                      for item in watch[:5]:
                          matchup = f"{item['away_team']} at {item['home_team']}"
                          lines.append(f"| {item['league'].upper()} | {matchup} | {item['home_no_vig_change_percentage_points']:+.4f} | HOLD |")
                  else:
                      lines.append("**No qualified upcoming line movement in saved snapshots.**")
                  lines.append(f"**Last archived quote:** {sharp.get('latest_eligible_capture_utc') or 'No eligible snapshot'}")
                  lines.append("**Sharp money inference:** NOT VERIFIED; no bettor-identity or bet-handle data.")
                  lines.append("**Certified model EV:** 0; data are historical and not live checkout prices.")
              if r['command'] == 'run_edge':
                  lines.append(f"Indicative research edges: {len(r['research_edge_candidates'])} (no independently verified executable quotes).")
              if r['command'] == 'model_status':
                  lines.append(f"NBA status: {r['model_status']['milestone_a']}.")
              text="\n".join(lines)+"\n"
              print(text)
              summary=os.getenv("GITHUB_STEP_SUMMARY")
              if summary: Path(summary).open("a").write(text)
          PY
      - name: Downloadable historical data + status
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v8-one-command-${{ github.event_name == 'workflow_run' && 'run_sharp' || github.event_name == 'push' && 'run_nba_oos' || inputs.command || 'run_sports' }}-${{ github.run_id }}
          path: v8_results/one_command/
          retention-days: 90
          if-no-files-found: warn

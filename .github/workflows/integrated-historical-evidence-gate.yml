name: Integrated MLB NBA historical evidence gates
on:
  pull_request:
    paths:
      - 'research/integrated_historical_receipt_gate.py'
      - 'tests/test_integrated_historical_receipt_gate.py'
      - '.github/workflows/integrated-historical-evidence-gate.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integration-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'cryptography>=43,<47'
      - run: python -m unittest discover -s tests -p 'test_integrated_historical_receipt_gate.py' -v
      - run: python -m unittest discover -s tests -p 'test_mlb_nba_record_receipt_verification.py' -v
      - run: python -m unittest discover -s tests -p 'test_external_source_attestation_gate.py' -v

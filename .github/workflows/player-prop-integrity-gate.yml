name: Player prop integrity gate tests
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/player_prop_integrity_gate.py
      - tests/test_player_prop_integrity_gate.py
      - .github/workflows/player-prop-integrity-gate.yml
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run fail-closed roster and injury tests
        run: python -m unittest discover -s tests -p 'test_player_prop_integrity_gate.py' -v

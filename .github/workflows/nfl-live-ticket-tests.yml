name: NFL live ticket tests
on:
  pull_request:
  push:
    branches:
      - repair/nfl-live-ticket-feed-20261126
  workflow_dispatch:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest -v test_v8_nfl_live_ticket

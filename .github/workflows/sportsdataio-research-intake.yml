name: SportsDataIO research evidence intake
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'sportsdataio_collector.py'
      - 'challenger_sportsdataio_validation.py'
      - 'challenger_sportsdataio_ingestion_trust.py'
      - 'tests/test_challenger_sportsdataio_ingestion_trust.py'
      - '.github/workflows/sportsdataio-research-intake.yml'
  schedule:
    - cron: '40 12 * * *'
    - cron: '40 0 * * *'
permissions:
  contents: read
concurrency:
  group: sportsdataio-evidence-${{ github.event_name }}
  cancel-in-progress: false
jobs:
  intake:
    # Scheduled runs contain only six entitled leagues. Manual dispatch may
    # test MLS and must report a genuine 401 or other provider failure, not a
    # misleading green job whose collection steps were skipped.
    strategy:
      fail-fast: false
      matrix:
        league: ${{ fromJSON(github.event_name == 'workflow_dispatch' && '["nba","nfl","mlb","nhl","ncaaf","ncaab","mls"]' || '["nba","nfl","mlb","nhl","ncaaf","ncaab"]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      SPORTSDATAIO_API_KEY: ${{ secrets.Sportsdataio || secrets.SPORTSDATAIO_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify secret is present
        shell: bash
        run: |
          if [[ -z "${SPORTSDATAIO_API_KEY:-}" ]]; then
            echo "::error::Sportsdataio repository secret is missing"
            exit 1
          fi
      - name: Collect ${{ matrix.league }} source evidence (research only)
        run: python sportsdataio_collector.py --leagues "${{ matrix.league }}" --output-dir sportsdataio_evidence
      - name: Validate quarantined Challenger research evidence
        if: success()
        run: python challenger_sportsdataio_validation.py --input-dir sportsdataio_evidence --output-dir sportsdataio_validation
      - name: Confirm quantitative values remain quarantined despite valid API responses
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("sportsdataio_validation/validation_report.json").read_text())
          q=r["provider_source_quality"]
          assert r["records_validated"]==q["research_records_checked"]
          assert q["new_training_eligible_rows"]==0
          assert q["new_certified_challenger_predictions"]==0
          assert q["new_certified_champion_predictions"]==0
          assert q["verified_direct_draftkings_checkout_prices"]==0
          assert q["automated_wagers_placed"]==0
          assert q["provider_real_unscrambled_data_entitlement_authenticated"] is False
          assert q["champion_001_modified"] is False
          assert r["quantitative_values_allowed_for_training"]==0
          assert r["provider_scores_stats_odds_authenticated"] is False
          assert r["bet_ready_selections"]==0 and r["certified_predictions"]==0
          assert r["champion_001_modified"] is False
          print("Source records:",r["records_validated"],
                "Numeric quality unverified in:",
                q["records_with_unverified_numeric_fields_by_league"],
                "Qualified training rows: 0")
          PY
      - name: Archive separate validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sportsdataio-validation-${{ matrix.league }}-${{ github.run_id }}
          path: sportsdataio_validation/
          retention-days: 90
          if-no-files-found: ignore
      - name: Archive separate league result and error report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sportsdataio-${{ matrix.league }}-${{ github.run_id }}
          path: sportsdataio_evidence/
          retention-days: 90
          if-no-files-found: warn

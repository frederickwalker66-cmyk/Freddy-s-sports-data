name: SportsDataIO research evidence intake
on:
  workflow_dispatch:
  schedule:
    - cron: '40 12 * * *'
    - cron: '40 0 * * *'
permissions:
  contents: read
concurrency:
  group: sportsdataio-evidence-${{ github.event_name }}
  cancel-in-progress: false
jobs:
  intake:
    # Scheduled runs contain only six entitled leagues. Manual dispatch may
    # test MLS and must report a genuine 401 or other provider failure, not a
    # misleading green job whose collection steps were skipped.
    strategy:
      fail-fast: false
      matrix:
        league: ${{ fromJSON(github.event_name == 'workflow_dispatch' && '["nba","nfl","mlb","nhl","ncaaf","ncaab","mls"]' || '["nba","nfl","mlb","nhl","ncaaf","ncaab"]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      SPORTSDATAIO_API_KEY: ${{ secrets.Sportsdataio }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify secret is present
        shell: bash
        run: |
          if [[ -z "${SPORTSDATAIO_API_KEY:-}" ]]; then
            echo "::error::Sportsdataio repository secret is missing"
            exit 1
          fi
      - name: Collect ${{ matrix.league }} source evidence (research only)
        run: python sportsdataio_collector.py --leagues "${{ matrix.league }}" --output-dir sportsdataio_evidence
      - name: Validate quarantined Challenger research evidence
        if: success()
        run: python challenger_sportsdataio_validation.py --input-dir sportsdataio_evidence --output-dir sportsdataio_validation
      - name: Archive separate validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sportsdataio-validation-${{ matrix.league }}-${{ github.run_id }}
          path: sportsdataio_validation/
          retention-days: 90
          if-no-files-found: ignore
      - name: Archive separate league result and error report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sportsdataio-${{ matrix.league }}-${{ github.run_id }}
          path: sportsdataio_evidence/
          retention-days: 90
          if-no-files-found: warn

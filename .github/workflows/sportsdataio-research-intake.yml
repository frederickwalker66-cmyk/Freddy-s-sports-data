name: SportsDataIO research evidence intake
on:
  workflow_dispatch:
    inputs:
      leagues:
        description: "Comma-separated leagues (NBA first; others require matching subscriptions)"
        required: false
        default: "nba"
  schedule:
    - cron: '40 12 * * *'
permissions:
  contents: read
concurrency:
  group: sportsdataio-evidence
  cancel-in-progress: false
jobs:
  intake:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      SPORTSDATAIO_API_KEY: ${{ secrets.Sportsdataio }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify secret is present
        run: test -n "$SPORTSDATAIO_API_KEY"
      - name: Collect provider game evidence (not certified training data)
        run: python sportsdataio_collector.py --leagues "${{ github.event.inputs.leagues || 'nba' }}" --output-dir sportsdataio_evidence
      - name: Upload provider-separated immutable run artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sportsdataio-evidence-${{ github.run_id }}
          path: sportsdataio_evidence/
          retention-days: 90
          if-no-files-found: warn

name: Universal Sharp Edge Board Tests
on:
  push:
    paths:
      - v8_one_command.py
      - research/universal_sharp_edge_board.py
      - tests/test_universal_sharp_edge_board.py
      - .github/workflows/universal-sharp-edge-board-tests.yml
  pull_request:
    paths:
      - v8_one_command.py
      - research/universal_sharp_edge_board.py
      - tests/test_universal_sharp_edge_board.py
      - .github/workflows/universal-sharp-edge-board-tests.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p 'test_universal_sharp_edge_board.py' -v

name: Challenger-001 original NBA pregame injury-report source archive (research only)
on:
  workflow_dispatch:
  schedule:
    # Three bounded original-source captures per day; GitHub schedules can be late.
    # Real as-of UTC timestamps are recorded, not inferred from cron execution.
    # Keep a morning source receipt, then check every 30 minutes near evening tips.
    # GitHub scheduled execution can be delayed, so only actual fetch times count.
    - cron: '0 14 * * *'
    - cron: '0,30 17-23,0-3 * * *'
  push:
    branches: [main]
    paths:
      - 'challenger_nba_pregame_injury_pdf.py'
      - 'tests/test_challenger_nba_pregame_injury_pdf.py'
      - 'challenger_nba_injury_pdf_player_rows.py'
      - 'tests/test_challenger_nba_injury_pdf_player_rows.py'
      - 'challenger_nba_pregame_roster_identity.py'
      - 'tests/test_challenger_nba_pregame_roster_identity.py'
      - 'challenger_nba_active_list_conflict_gate.py'
      - 'tests/test_challenger_nba_active_list_conflict_gate.py'
      - 'challenger_nba_official_stats_v3_inactives.py'
      - 'tests/test_challenger_nba_official_stats_v3_inactives.py'
      - 'challenger_nba_daily_scoreboard_fallback.py'
      - 'tests/test_challenger_nba_daily_scoreboard_fallback.py'
      - 'challenger_nba_stats_v3_schedule_fallback.py'
      - 'tests/test_challenger_nba_stats_v3_schedule_fallback.py'
      - 'tests/test_challenger_nba_cdn_headers.py'
      - 'challenger_nba_injury_revision_monitor.py'
      - 'tests/test_challenger_nba_injury_revision_monitor.py'
      - 'requirements-injury-pdf.txt'
      - '.github/workflows/challenger-nba-injury-source.yml'
  pull_request:
    paths:
      - 'challenger_nba_pregame_injury_pdf.py'
      - 'tests/test_challenger_nba_pregame_injury_pdf.py'
      - 'challenger_nba_injury_pdf_player_rows.py'
      - 'tests/test_challenger_nba_injury_pdf_player_rows.py'
      - 'challenger_nba_pregame_roster_identity.py'
      - 'tests/test_challenger_nba_pregame_roster_identity.py'
      - 'challenger_nba_active_list_conflict_gate.py'
      - 'tests/test_challenger_nba_active_list_conflict_gate.py'
      - 'challenger_nba_official_stats_v3_inactives.py'
      - 'tests/test_challenger_nba_official_stats_v3_inactives.py'
      - 'challenger_nba_daily_scoreboard_fallback.py'
      - 'tests/test_challenger_nba_daily_scoreboard_fallback.py'
      - 'challenger_nba_stats_v3_schedule_fallback.py'
      - 'tests/test_challenger_nba_stats_v3_schedule_fallback.py'
      - 'tests/test_challenger_nba_cdn_headers.py'
      - 'challenger_nba_injury_revision_monitor.py'
      - 'tests/test_challenger_nba_injury_revision_monitor.py'
      - 'requirements-injury-pdf.txt'
      - '.github/workflows/challenger-nba-injury-source.yml'
permissions:
  contents: read
jobs:
  offline-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install strict original PDF layout reader
        run: python -m pip install -r requirements-injury-pdf.txt
      - name: Check original injury-source PDF validation fixtures
        run: |
          python -m unittest discover -s tests -p 'test_challenger_nba_pregame_injury_pdf.py' -v
          python -m unittest discover -s tests -p 'test_challenger_nba_injury_pdf_player_rows.py' -v
          python -m unittest discover -s tests -p 'test_challenger_nba_pregame_roster_identity.py' -v
          python -m unittest discover -s tests -p 'test_challenger_nba_active_list_conflict_gate.py' -v
          python -m unittest discover -s tests -p 'test_challenger_nba_official_stats_v3_inactives.py' -v
          python -m unittest discover -s tests -p 'test_challenger_nba_daily_scoreboard_fallback.py' -v
          python -m unittest discover -s tests -p 'test_challenger_nba_stats_v3_schedule_fallback.py' -v
          python -m unittest discover -s tests -p 'test_challenger_nba_cdn_headers.py' -v
          python -m unittest discover -s tests -p 'test_challenger_nba_injury_revision_monitor.py' -v
  capture-current-original-report:
    if: github.event_name != 'pull_request'
    needs: offline-safety
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install strict original PDF layout reader
        run: python -m pip install -r requirements-injury-pdf.txt
      - name: Capture one as-observed NBA-owned injury index and original PDF if published
        run: |
          set -euo pipefail
          python challenger_nba_pregame_injury_pdf.py \
            --output-dir nba_injury_current_original
          python - <<'PY'
          import json,hashlib
          from pathlib import Path
          root=Path('nba_injury_current_original')
          r=json.loads((root/'nba_injury_original_report.json').read_text())
          for key in ('nba_players_with_verified_injury_status','nba_players_confirmed_active',
                      'qualified_player_prop_training_observations',
                      'certified_champion_001_predictions',
                      'certified_challenger_001_predictions','certified_positive_ev_bets',
                      'bet_ready_selections','automated_bets_placed'):
              assert r[key]==0,(key,r[key])
          assert r['champion_001_modified'] is False
          if r['source_status']=='captured_original_index_and_pdf':
              assert hashlib.sha256((root/'nba_injury_original_report.pdf').read_bytes()).hexdigest()==r['original_pdf_sha256']
              assert hashlib.sha256((root/'nba_injury_original_index.html').read_bytes()).hexdigest()==r['official_nba_index_sha256']
              assert r['original_pdf_authorship_cryptographically_verified'] is False
              assert r['report_filename_label_externally_authenticated'] is False
          print('NBA original source status:',r['source_status'],'not a verified active lineup')
          PY
      - name: Extract individual NBA PDF table rows with no active-lineup or prop promotion
        run: |
          set -euo pipefail
          python challenger_nba_injury_pdf_player_rows.py \
            --capture-dir nba_injury_current_original \
            --output-dir nba_injury_current_original/player_rows_review
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('nba_injury_current_original/player_rows_review')
          r=json.loads((root/'nba_injury_pdf_player_report.json').read_text())
          for k in ('active_player_roster_verified','individual_player_id_crosswalk_verified',
                    'qualified_prop_training_observations','trained_player_prop_models',
                    'certified_champion_001_predictions','certified_challenger_001_predictions',
                    'certified_positive_ev_bets','bet_ready_selections','automated_bets_placed'):
              assert r[k]==0,(k,r[k])
          assert r['champion_001_modified'] is False
          assert r['injury_report_status_is_final_lineup_verified'] is False
          for line in (root/'nba_injury_pdf_player_review.jsonl').read_text().splitlines():
              x=json.loads(line)
              assert x['nba_person_id'] is None
              assert x['espn_athlete_id'] is None
              assert x['player_current_game_active_status_verified'] is False
              assert x['roster_player_id_crosswalk_verified'] is False
              assert x['market_eligibility_verified'] is False
              assert x['qualified_for_prop_training'] is False
              assert x['bet_ready'] is False and x['champion_001_modified'] is False
          print('Official NBA PDF player entries extracted for review only:',
                r['player_rows_extracted_from_official_pdf'],
                'parse blocker:',r['pdf_extraction_error'])
          PY
      - name: Join future NBA scheduled-game roster person ID candidates without declaring anyone active
        run: |
          set -euo pipefail
          python challenger_nba_pregame_roster_identity.py \
            --capture-dir nba_injury_current_original \
            --output-dir nba_injury_current_original/pregame_roster_id_review \
            --max-games 4
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          root=Path('nba_injury_current_original/pregame_roster_id_review')
          report=json.loads((root/'nba_pregame_roster_identity_report.json').read_text())
          assert report['official_game_requests_bounded']<=4
          for key in ('independently_confirmed_active_players',
                      'verified_nba_to_espn_to_draftkings_player_id_crosswalks',
                      'qualified_player_prop_training_observations','trained_player_prop_models',
                      'certified_champion_001_predictions','certified_challenger_001_predictions',
                      'certified_positive_ev_bets','bet_ready_selections','automated_bets_placed'):
            assert report[key]==0,(key,report[key])
          assert report['champion_001_modified'] is False
          for line in (root/'nba_pregame_roster_identity_review.jsonl').read_text().splitlines():
            row=json.loads(line)
            assert row['nba_roster_match_is_identity_candidate_only'] is True
            assert row['independently_authenticated_player_id_crosswalk'] is False
            assert row['current_game_active_inactive_verified'] is False
            assert row['draftkings_player_id_verified'] is False
            assert row['roster_status_is_final_active_list'] is False
            assert row['qualified_for_player_prop_training'] is False
            assert row['bet_ready'] is False and row['champion_001_modified'] is False
          for filename,expected in report['original_source_sha256'].items():
            blob=(root/'nba_roster_original_source_bytes'/filename).read_bytes()
            assert hashlib.sha256(blob).hexdigest()==expected
          assert all((v.startswith('HTTP_') or v in ('ValueError','OSError',
                           'TimeoutError','TypeError','UnicodeError','OverflowError','KeyError'))
                         for v in report['official_nba_schedule_source_errors'].values())
          assert report['official_nba_schedule_source_kind'] in (
            None,'nba_season_schedule','nba_daily_scoreboard_same_day_fallback',
            'nba_stats_v3_scoreboard_same_day_fallback')
          if report['official_nba_schedule_source_kind']=='nba_daily_scoreboard_same_day_fallback':
            assert report['official_nba_schedule_source_url']==(
              'https://cdn.nba.com/static/json/liveData/scoreboard/todaysScoreboard_00.json')
            assert report['official_nba_schedule_observed_at_utc']
          if report['official_nba_schedule_source_kind']=='nba_stats_v3_scoreboard_same_day_fallback':
            assert report['official_nba_schedule_source_url'].startswith(
                'https://stats.nba.com/stats/scoreboardv3?GameDate=')
            assert report['official_nba_schedule_observed_at_utc']
          print('Scheduled NBA roster person ID review candidates:',
                report['nba_person_id_candidates_without_id_cross_source_authentication'])
          PY
      - name: Reconcile reported injury status with scheduled NBA roster fields; never promote final active list
        run: |
          set -euo pipefail
          python challenger_nba_active_list_conflict_gate.py \
            --roster-dir nba_injury_current_original/pregame_roster_id_review \
            --output-dir nba_injury_current_original/active_list_conflicts
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('nba_injury_current_original/active_list_conflicts')
          r=json.loads((root/'nba_active_list_conflict_report.json').read_text())
          for key in ('independently_confirmed_game_day_active_players',
                      'independently_confirmed_game_day_inactive_players',
                      'verified_nba_espn_draftkings_player_id_crosswalks',
                      'qualified_player_prop_training_observations',
                      'certified_champion_001_predictions','certified_challenger_001_predictions',
                      'certified_positive_ev_bets','bet_ready_selections','automated_bets_placed'):
              assert r[key]==0,(key,r[key])
          assert r['official_complete_active_list_authenticated'] is False
          assert r['champion_001_modified'] is False
          for line in (root/'nba_active_list_conflict_review.jsonl').read_text().splitlines():
              row=json.loads(line)
              assert row['official_complete_active_list_verified'] is False
              assert row['current_game_active_inactive_independently_confirmed'] is False
              assert row['bookmaker_void_or_settlement_verified'] is False
              assert row['qualified_for_player_prop_training'] is False
              assert row['model_player_prop_probability'] is None
              assert row['bet_ready'] is False and row['champion_001_modified'] is False
          print('NBA official injury vs game-roster preliminary conflicts:',
                r['near_tipoff_manual_conflicts'])
          PY
      - name: Read explicit NBA-operated Stats V3 game inactives before tipoff (optional source, no active-player clearance)
        run: |
          set -euo pipefail
          python challenger_nba_official_stats_v3_inactives.py \
            --roster-dir nba_injury_current_original/pregame_roster_id_review \
            --output-dir nba_injury_current_original/stats_v3_inactive_receipts \
            --max-games 4
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          root=Path('nba_injury_current_original/stats_v3_inactive_receipts')
          r=json.loads((root/'nba_stats_v3_inactive_report.json').read_text())
          assert r['source_requests_attempted']<=4
          for k in ('independently_confirmed_game_day_active_players',
                    'independently_confirmed_game_day_inactive_players',
                    'verified_nba_espn_draftkings_player_id_crosswalks',
                    'qualified_player_prop_training_observations',
                    'certified_champion_001_predictions','certified_challenger_001_predictions',
                    'certified_positive_ev_bets','bet_ready_selections','automated_bets_placed'):
            assert r[k]==0,(k,r[k])
          assert r['official_final_active_list_authenticated'] is False
          assert r['complete_game_day_active_list_available'] is False
          assert r['no_inactive_rows_does_not_mean_everyone_active'] is True
          assert r['champion_001_modified'] is False
          for line in (root/'nba_stats_v3_inactive_review.jsonl').read_text().splitlines():
            row=json.loads(line)
            assert row['source_explicit_inactive_pregame'] is True
            assert row['official_final_active_list_authenticated'] is False
            assert row['confirmed_final_game_inactive'] is False
            assert row['all_nonlisted_players_assumed_active'] is False
            assert row['qualified_for_prop_training'] is False
            assert row['model_probability'] is None and row['bet_ready'] is False
          for game_id,digest in r['observed_game_source_sha256'].items():
            raw=(root/'nba_stats_v3_original_source_bytes'/(game_id+'.json')).read_bytes()
            assert hashlib.sha256(raw).hexdigest()==digest
          print('NBA Stats V3 explicit pregame inactive rows:',r['explicit_source_inactive_rows'],
                'source:',r['status'],'failures:',r['source_failures'])
          PY
      - name: Compare latest and prior official NBA injury PDFs for designation changes (no lineup clearance)
        run: |
          set -euo pipefail
          python challenger_nba_injury_revision_monitor.py \
            --capture-dir nba_injury_current_original \
            --output-dir nba_injury_current_original/revision_monitor
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          root=Path('nba_injury_current_original/revision_monitor')
          r=json.loads((root/'nba_injury_revision_report.json').read_text())
          for k in ('confirmed_active_players','confirmed_late_scratches',
                    'verified_player_participation','verified_player_prop_training_examples',
                    'certified_champion_001_predictions','certified_challenger_001_predictions',
                    'certified_positive_ev_bets','bet_ready_selections','automated_bets_placed'):
            assert r[k]==0,(k,r[k])
          assert r['champion_001_modified'] is False
          for line in (root/'nba_injury_status_changes.jsonl').read_text().splitlines():
            item=json.loads(line)
            assert item['confirmed_late_scratch'] is False
            assert item['official_complete_active_list_verified'] is False
            assert item['actual_source_publication_time_independently_authenticated'] is False
            assert item['qualified_for_player_prop_training'] is False
            assert item['bet_ready'] is False and item['champion_001_modified'] is False
          p=root/'nba_previous_original_injury_report.pdf'
          if p.exists():
            assert hashlib.sha256(p.read_bytes()).hexdigest()==r['previous_original_pdf_sha256']
          print('NBA PDF source revisions:',r['reported_player_status_changes'],
                'reported-to-Out:',r['possible_out_designation_transitions'],
                'source:',r['source_status'])
          PY
      - name: Retain downloaded source bytes temporarily for independent later player review
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nba-injury-original-${{ github.run_id }}
          path: nba_injury_current_original/
          retention-days: 90
          if-no-files-found: warn

name: NBA injury provenance regression gate
on:
  pull_request:
    paths:
      - 'research/nba_injury_provenance_gate.py'
      - 'tests/test_nba_injury_provenance_gate.py'
      - '.github/workflows/nba-injury-provenance-regression.yml'
  push:
    branches: [main]
    paths:
      - 'research/nba_injury_provenance_gate.py'
      - 'tests/test_nba_injury_provenance_gate.py'
      - '.github/workflows/nba-injury-provenance-regression.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  injury-date-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify same-game official injury provenance and HOLD safety
        run: python -m unittest discover -s tests -p 'test_nba_injury_provenance_gate.py' -v

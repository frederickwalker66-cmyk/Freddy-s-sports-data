name: Freddy's Picks AI operational readiness (research-only)
on:
  push:
    branches: [main]
    paths:
      - "research/freddys_operational_readiness.py"
      - "tests/test_freddys_operational_readiness.py"
      - ".github/workflows/freddys-operational-readiness.yml"
  workflow_dispatch:
  schedule:
    - cron: "15 12 * * *"
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate readiness gate
        run: python -m unittest discover -s tests -p 'test_freddys_operational_readiness.py' -v
      - name: Generate explicit operational status
        run: |
          python -m research.freddys_operational_readiness --output "$RUNNER_TEMP/operational_readiness.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          report=json.loads((Path(os.environ["RUNNER_TEMP"])/"operational_readiness.json").read_text())
          lines=["## Freddy's Picks AI operational readiness", "",
                 "- Certification: HOLD", "- Certified TAKE: 0",
                 "- Independent certification engine: NOT CONNECTED", "",
                 "### Missing or unverified dependencies"]
          lines += ["- "+x for x in report["missing_or_unverified"]]
          Path(os.environ["GITHUB_STEP_SUMMARY"]).write_text("\n".join(lines)+"\n")
          PY
      - name: Upload diagnostic metadata
        uses: actions/upload-artifact@v4
        with:
          name: freddys-operational-readiness
          path: ${{ runner.temp }}/operational_readiness.json
          retention-days: 14

name: Unified historical hit rate tests
on:
  push:
    branches: [research/unified-hit-rate-20261127]
  pull_request:
    paths:
      - v8_unified_hit_rate.py
      - test_v8_unified_hit_rate.py
      - v8_unified_best_bets.py
      - test_v8_unified_best_bets.py
      - v8_all_sports_player_form.py
      - .github/workflows/unified-hit-rate-tests.yml
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest -v test_v8_unified_hit_rate test_v8_unified_best_bets

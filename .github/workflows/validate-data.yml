name: Validate NBA MLB research integrity (offline)
on:
  workflow_dispatch:
  # Test ALL changes, including Python model, safety, feature engineering,
  # workflow and infrastructure changes. Prior narrow path filters let model
  # code change without a general CI run. A green prior test does not
  # establish native model calibration or verified sportsbook pricing.
  push:
    branches: [main, challenger-001-validation-20261028]
  pull_request:
permissions:
  contents: read
jobs:
  validation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install calibration test dependency
        run: python -m pip install -r requirements-calibration.txt
      - name: Compile Python validation files
        run: python -m compileall -q .
      - name: Run offline validation fixtures (no API keys or bets)
        run: python -m unittest discover -s tests -v

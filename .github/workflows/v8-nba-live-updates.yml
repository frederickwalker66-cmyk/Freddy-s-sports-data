name: Freddy's Picks AI V8 — NBA scoreboard live updates (research only)
on:
  workflow_dispatch:
  # Best-effort NBA evening game windows; actual timestamps, not cron slots,
  # establish observation freshness. ESPN data is delayed, not a live feed.
  schedule:
    - cron: '*/15 21-23,0-5 * * *'
  push:
    branches: [main]
    paths:
      - 'v8_nba_live_updates.py'
      - 'tests/test_v8_nba_live_updates.py'
      - '.github/workflows/v8-nba-live-updates.yml'
  pull_request:
    paths:
      - 'v8_nba_live_updates.py'
      - 'tests/test_v8_nba_live_updates.py'
      - '.github/workflows/v8-nba-live-updates.yml'

permissions:
  contents: read
  actions: read

concurrency:
  group: freddy-v8-nba-public-live-observations
  cancel-in-progress: false

jobs:
  offline-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate scoreboard, odds and player eligibility fail-closed guards
        run: python -m unittest discover -s tests -p 'test_v8_nba_live_updates.py' -v

  as-observed-nba:
    needs: offline-validation
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Locate latest successful injury workflow metadata and archived odds (no paid calls)
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p v8_live_inputs/sharp
          if ! gh run list --repo "$GITHUB_REPOSITORY" \
               --workflow challenger-nba-injury-source.yml --branch main \
               --status success --limit 1 --json databaseId,updatedAt \
               > v8_live_inputs/injury_runs.json; then
            echo '[]' > v8_live_inputs/injury_runs.json
          fi
          odds_id="$(gh run list --repo "$GITHUB_REPOSITORY" \
            --workflow collect-sharpapi.yml --branch main --status success \
            --limit 1 --json databaseId --jq '.[0].databaseId // ""' || true)"
          if [[ "$odds_id" =~ ^[0-9]+$ ]]; then
            mkdir -p "v8_live_inputs/sharp/$odds_id"
            if ! gh run download "$odds_id" --repo "$GITHUB_REPOSITORY" \
                 --name "sharpapi-pregame-$odds_id" \
                 --dir "v8_live_inputs/sharp/$odds_id"; then
              rm -rf "v8_live_inputs/sharp/$odds_id"
              echo "No accessible original SharpAPI snapshot. Odds cannot be presented as current."
            fi
          fi
          echo "Injury workflow metadata and at most one historical odds artifact examined."
          # Bounded read-only recovery of the latest completed NBA-only model
          # report. Its pregame probabilities are still uncalibrated research.
          # Never infer fresh projections from a stale or unmatched event ID.
          for model_run in $(gh run list --repo "$GITHUB_REPOSITORY" \
                 --workflow v8-one-command.yml --branch main \
                 --status success --limit 5 --json databaseId \
                 --jq '.[].databaseId' 2>/dev/null || true); do
            if [[ ! "$model_run" =~ ^[0-9]+$ ]]; then continue; fi
            mkdir -p "v8_live_inputs/research/$model_run"
            if gh run download "$model_run" --repo "$GITHUB_REPOSITORY" \
                 --name "v8-one-command-run_nba_best_bets-$model_run" \
                 --dir "v8_live_inputs/research/$model_run" >/dev/null 2>&1 &&
               [[ -s "v8_live_inputs/research/$model_run/FULL_STACK_ALL_IN_ONE_REPORT.json" ]]; then
              cp "v8_live_inputs/research/$model_run/FULL_STACK_ALL_IN_ONE_REPORT.json" \
                 v8_live_inputs/full_stack.json
              echo "Previous completed NBA research report loaded for exact-game matching: $model_run"
              break
            fi
            rm -rf "v8_live_inputs/research/$model_run"
          done
          if [[ ! -f v8_live_inputs/full_stack.json ]]; then
            echo 'No completed NBA pregame baseline report found; all baseline cells remain N/A.'
          fi
      - name: Capture NBA observed public scoreboard and honest price/injury recency
        shell: bash
        run: |
          set -euo pipefail
          python v8_nba_live_updates.py \
            --injury-metadata v8_live_inputs/injury_runs.json \
            --sharp-archive-dir v8_live_inputs/sharp \
            --full-stack-report v8_live_inputs/full_stack.json \
            --output-dir v8_results/nba_live_updates
          python - <<'PY'
          import json, os
          from pathlib import Path
          root=Path("v8_results/nba_live_updates")
          r=json.loads((root/"NBA_LIVE_UPDATES.json").read_text())
          assert r["certified_positive_ev_bets"]==r["wagers_placed"]==0
          assert r["champion_001_modified"] is False
          assert r["live_draftkings_checkout_verified"] is False
          assert r["live_player_props_verified"] is False
          assert r["official_final_active_lineups_verified"] is False
          assert r["not_a_continuous_stream"] is True
          text=(root/"NBA_LIVE_UPDATES.md").read_text()
          print(text)
          if os.getenv("GITHUB_STEP_SUMMARY"):
              with open(os.environ["GITHUB_STEP_SUMMARY"],"a") as f:
                  f.write(text)
          PY
      - name: Retain source-labeled NBA update report for phone and next scans
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v8-nba-live-updates-${{ github.run_id }}
          path: v8_results/nba_live_updates/
          retention-days: 30
          if-no-files-found: warn

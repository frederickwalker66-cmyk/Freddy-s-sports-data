name: Freddy's Picks AI — One Command Train + Certification Gate
# Manual pre-7pm research verification rerun; never certifies unverified bets.
on:
  workflow_dispatch:
  schedule:
    - cron: '20 12,21 * * *'
  push:
    paths:
      - 'research/challenger_003_train_predict.py'
      - 'tests/test_challenger_003_train_predict.py'
      - 'research/challenger_003_grade_ledger.py'
      - 'tests/test_challenger_003_grade_ledger.py'
      - '.github/workflows/challenger-003-model.yml'
jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test new independent model
        run: python -m unittest discover -s tests -p 'test_challenger_003_train_predict.py' -v
      - name: Verify sportsbook and model certification blockers
        run: |
          python -m research.challenger_002_certification_readiness > certification_readiness.json
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('certification_readiness.json').read_text())
          assert r['certified_take_count']==0
          print('Independent certification gate:',r['status'])
          print('Missing:',', '.join(r['missing']))
          PY
      - name: Test immutable prediction grading and safety gates
        run: python -m unittest discover -s tests -p 'test_challenger_003_grade_ledger.py' -v
      - name: Grade retained pregame predictions against verified settlement candidates
        shell: bash
        run: |
          mkdir -p artifacts
          if [ -f approved_data/challenger_003_pregame_predictions.jsonl ] && [ -f approved_data/challenger_003_settlements.jsonl ]; then
            python -m research.challenger_003_grade_ledger --predictions approved_data/challenger_003_pregame_predictions.jsonl --results approved_data/challenger_003_settlements.jsonl --output artifacts/challenger_003_grading.json
          else
            echo '{"status":"HOLD_MISSING_PREDICTIONS_OR_SETTLEMENTS","graded_count":0,"certified_take_count":0}' > artifacts/challenger_003_grading.json
          fi
      - name: Daily training from approved point-in-time data, if available
        shell: bash
        run: |
          mkdir -p artifacts
          if [ -s approved_data/challenger_003_nba_game_moneyline.jsonl ]; then
            python -m research.challenger_003_train_predict --train approved_data/challenger_003_nba_game_moneyline.jsonl --artifact artifacts/challenger_003_model.json --output artifacts/challenger_003_readiness.json
          else
            python -m research.challenger_003_train_predict --train /dev/null --output artifacts/challenger_003_readiness.json
          fi
          python - <<'PY'
          import json,os
          from pathlib import Path
          r=json.loads(Path("artifacts/challenger_003_readiness.json").read_text())
          g=json.loads(Path("certification_readiness.json").read_text())
          report={"model":"Challenger-003","training_status":r["status"],
                  "training_rows":r.get("train_rows",0),"holdout_rows":r.get("test_rows",0),
                  "holdout_brier":r.get("holdout_brier"),
                  "certification_status":g["status"],"missing_certification_evidence":g["missing"],
                  "certified_take_count":0,"champion_001_modified":False,
                  "note":"Research training does not authorize betting certification"}
          Path("artifacts/ONE_COMMAND_STATUS.json").write_text(json.dumps(report,indent=2)+"\n")
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a") as f:
              f.write("## One Command — Train + Certification Gate\n")
              f.write("Training: "+r["status"]+"\\n\n")
              f.write("Certification: "+g["status"]+"; TAKE: 0\\n\n")
              f.write("Missing: "+", ".join(g["missing"])+"\n")
          PY
      - name: Enforce fail-closed readiness evidence and summarize blockers
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          report=json.JSONDecoder().raw_decode(Path('artifacts/ONE_COMMAND_STATUS.json').read_text())[0]
          grade=json.loads(Path('artifacts/challenger_003_grading.json').read_text())
          training=report['training_status']
          trained=training=='RESEARCH_TRAINED_NOT_CERTIFIED'
          model_exists=Path('artifacts/challenger_003_model.json').is_file()
          if trained != model_exists:
              raise SystemExit('Training artifact/status mismatch: fail closed')
          blockers=list(report['missing_certification_evidence'])
          if not trained:
              blockers.append('NO_APPROVED_TRAINED_MODEL')
          if grade.get('graded_count',0)==0:
              blockers.append('NO_VERIFIED_GRADED_PREDICTIONS')
          gate={'status':'HOLD','certified_take_count':0,
                'training_status':training,'model_artifact_present':model_exists,
                'graded_predictions':grade.get('graded_count',0),
                'blockers':sorted(set(blockers)),
                'champion_001_modified':False}
          Path('artifacts/SHARP_EDGE_GATE.json').write_text(json.dumps(gate,indent=2)+'\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as summary:
              summary.write('\\n### Sharp Edge certification: HOLD (not live-ready)\n')
              summary.write('Training: '+training+'; verified graded predictions: '+str(gate['graded_predictions'])+'\\n\n')
              summary.write('Blocking evidence: '+', '.join(gate['blockers'])+'\n')
          print(json.dumps(gate,sort_keys=True))
          PY
      - name: Publish honest readiness
        shell: bash
        run: |
          mkdir -p artifacts
          echo 'Champion-001 unchanged. Predictions are not training labels until independently settled. Certified TAKE remains zero pending validation.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: challenger-003-readiness
          path: artifacts/

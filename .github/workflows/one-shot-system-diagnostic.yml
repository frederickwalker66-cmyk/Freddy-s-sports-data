name: Freddy's Picks AI — One-Shot Diagnostic
on:
  workflow_dispatch:
    inputs:
      run_pipeline:
        description: 'Launch all-sports feed, V8 research, Challenger calibration and certification audits'
        required: false
        type: boolean
        default: true
  schedule:
    - cron: '30 12,22 * * *'
permissions:
  actions: write
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Launch unified downstream research and audit workflows
        if: github.event_name == 'workflow_dispatch' && inputs.run_pipeline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for workflow in all-sports-feed-audit.yml v8-one-command.yml challenger-isotonic-calibration.yml live-sharp-edge-certification.yml; do
            gh workflow run "$workflow" --repo "$GITHUB_REPOSITORY" --ref main
            echo "Dispatched: $workflow (not yet verified complete)" >> "$GITHUB_STEP_SUMMARY"
          done
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run unified local safety and readiness checks
        run: |
          python -m unittest discover -s tests -p 'test_freddys_operational_readiness.py' -v
          python -m unittest discover -s tests -p 'test_sportsdataio_nba_probe.py' -v
          python -m unittest discover -s tests -p 'test_challenger_prediction_bridge.py' -v
          python -m research.freddys_operational_readiness --output local-readiness.json
      - name: Check latest dependency runs and publish one report
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import json, os, urllib.request, io, zipfile
          from pathlib import Path
          req=urllib.request.Request(
              "https://api.github.com/repos/"+os.environ["GH_REPOSITORY"]+"/actions/runs?per_page=100",
              headers={"Authorization":"Bearer "+os.environ["GH_TOKEN"],"Accept":"application/vnd.github+json"})
          with urllib.request.urlopen(req,timeout=30) as response:
              runs=json.load(response)["workflow_runs"]
          targets=["SportsDataIO NBA Authenticated Readiness (manual)",
                   "Sharp Edge Pro — Bounded Live NBA Ingestion",
                   "Collect SharpAPI DraftKings pregame odds",
                   "Challenger-001 daily isotonic research calibration",
                   "Sharp Edge — Live Certification Audit (fail closed)",
                   "Sharp Edge certification configuration preflight",
                   "Freddy's Picks AI V8 — One Command (phone + laptop)"]
          rows=[]
          for name in targets:
              r=next((x for x in runs if x["name"]==name),None)
              rows.append({"name":name,"result":(r["conclusion"] or r["status"] or "UNKNOWN") if r else "NOT_FOUND",
                           "url":r["html_url"] if r else None})
          certification={"status":"UNAVAILABLE","certified_take_count":0,"certification_blockers":["CERTIFICATION_ARTIFACT_UNAVAILABLE"]}
          cert_run=next((r for r in runs if r["name"]=="Sharp Edge — Live Certification Audit (fail closed)" and r["status"]=="completed"),None)
          if cert_run:
              try:
                  api="https://api.github.com/repos/"+os.environ["GH_REPOSITORY"]+"/actions/runs/"+str(cert_run["id"])+"/artifacts"
                  request=urllib.request.Request(api,headers={"Authorization":"Bearer "+os.environ["GH_TOKEN"],"Accept":"application/vnd.github+json"})
                  with urllib.request.urlopen(request,timeout=15) as response:
                      artifacts=json.load(response).get("artifacts",[])
                  artifact=next((a for a in artifacts if a["name"]=="live-sharp-edge-certification" and not a["expired"]),None)
                  if artifact:
                      request=urllib.request.Request(artifact["archive_download_url"],headers={"Authorization":"Bearer "+os.environ["GH_TOKEN"],"Accept":"application/vnd.github+json"})
                      with urllib.request.urlopen(request,timeout=20) as response:
                          archive=response.read(3000000)
                      with zipfile.ZipFile(io.BytesIO(archive)) as z:
                          match=next((n for n in z.namelist() if n.endswith("live_certified_predictions.json")),None)
                          if match:
                              payload=json.loads(z.read(match))
                              certification={"status":payload.get("feed_status","UNKNOWN"),"certified_take_count":payload.get("certified_take_count",0),"certification_blockers":payload.get("certification_blockers",[])}
              except (OSError,ValueError,KeyError,zipfile.BadZipFile,StopIteration):
                  pass
          local=json.loads(Path("local-readiness.json").read_text())
          report={"release":"HOLD","certified_takes":0,"workflow_checks":rows,"local_readiness":local,"certification_evidence":certification,
                  "warning":"CI success does not establish authenticated odds, model calibration or certification."}
          Path("diagnostic.json").write_text(json.dumps(report,indent=2))
          lines=["# One-Shot System Diagnostic","","**Release: HOLD pending independent evidence.**",
                 "","| Dependency | Latest run |","|---|---|"]
          for row in rows:
              lines.append("| "+row["name"]+" | "+row["result"]+" |")
          lines+=["","## Independent certification evidence", "- Feed: "+str(certification["status"]),"- Certified TAKE: "+str(certification["certified_take_count"])]
          lines+=["- Blocker: "+str(x) for x in certification["certification_blockers"]]
          lines+=["","## Current local readiness blockers"]
          lines+=["- "+str(x) for x in local.get("missing_or_unverified",[])]
          lines+=["","Green checks mean workflow execution succeeded, not that live predictions are certified."]
          Path(os.environ["GITHUB_STEP_SUMMARY"]).write_text("\n".join(lines)+"\n")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: one-shot-diagnostic
          path: diagnostic.json
          retention-days: 14

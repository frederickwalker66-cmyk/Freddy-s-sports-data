name: Sharp Edge — Diagnose NBA Schedule Time
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SHARP_API_KEY: ${{ secrets.SHARP_API_KEY }}
      SPORTSDATAIO_NBA_API_KEY: ${{ secrets.SPORTSDATAIO_NBA_API_KEY || secrets.SPORTSDATAIO }}
    steps:
      - uses: actions/checkout@v4
      - name: Diagnose schedule date/time field presence and agreement
        run: python3 sharp-edge-pro/diagnose_nba_schedule_time.py
      - name: Certification remains blocked
        if: always()
        run: echo 'Schedule mismatch diagnosis is research only. Certified TAKE stays HOLD.' >> "$GITHUB_STEP_SUMMARY"

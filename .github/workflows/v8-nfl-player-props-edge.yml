name: Freddy's Picks AI V8 — NBA + NFL Games & Player Props Sharp Edge (one click)
on:
  workflow_dispatch:
  # First deploy validates the dedicated one-click action. Subsequent captures
  # automatically replay existing research odds at zero additional API cost.
  push:
    branches: [main]
    paths:
      - '.github/workflows/v8-nfl-player-props-edge.yml'
      - 'v8_sharp_player_props.py'
      - 'v8_sharp_game_markets.py'
      - 'v8_sharp_probability_display.py'
      - 'v8_sharp_calibration_dashboard.py'
      - 'tests/test_v8_sharp_calibration_dashboard.py'
      - 'tests/test_v8_sharp_probability_display.py'
      - 'tests/test_v8_sharp_game_markets.py'
      - 'v8_one_command.py'
      - 'v8_probability_edge_dashboard.py'
      - 'tests/test_v8_probability_edge_dashboard.py'
      - 'tests/test_v8_sharp_player_props.py'
      - 'SHARP_EDGE_RERUN_REQUEST.md'
  workflow_run:
    workflows: ['Collect SharpAPI DraftKings pregame odds']
    types: [completed]
    branches: [main]
permissions:
  contents: read
  actions: read
concurrency:
  group: nfl-props-edge-research
  cancel-in-progress: false
jobs:
  nfl-player-props-research:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install offline analysis dependencies
        run: python -m pip install -r requirements-calibration.txt
      - name: Validate player props and full game market guards (offline)
        run: |
          python -m unittest discover -s tests -p 'test_v8_sharp_player_props.py' -v
          python -m unittest discover -s tests -p 'test_v8_sharp_game_markets.py' -v
          python -m unittest discover -s tests -p 'test_v8_sharp_probability_display.py' -v
          python -m unittest discover -s tests -p 'test_v8_sharp_calibration_dashboard.py' -v
      - name: Read saved SharpAPI archives only; no paid API requests
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p saved_sharp_archives
          mapfile -t ids < <(gh run list --repo "$GITHUB_REPOSITORY" --workflow collect-sharpapi.yml --branch main --status success --limit 5 --json databaseId --jq '.[].databaseId' || true)
          count=0
          for rid in "${ids[@]}"; do
            [[ "$rid" =~ ^[0-9]+$ ]] || continue
            if gh run download "$rid" --repo "$GITHUB_REPOSITORY" --name "sharpapi-pregame-$rid" --dir "saved_sharp_archives/$rid"; then
              count=$((count+1))
            else
              rm -rf "saved_sharp_archives/$rid"
              echo "Archived run $rid missing: zero rows inferred; no paid retry."
            fi
          done
          echo "Saved research archives retrieved: $count"
      - name: Read durable NBA original-forward research calibration (no paid calls)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p saved_forward_calibration
          if gh api "repos/$GITHUB_REPOSITORY/contents/data/v8_forward/CALIBRATION.json?ref=research%2Fforward-ledger" --jq '.content' | base64 --decode > saved_forward_calibration/CALIBRATION.json; then
            echo "Durable original NBA forward calibration file retrieved; strict local validation required."
          else
            rm -f saved_forward_calibration/CALIBRATION.json
            echo "Calibration evidence unavailable: show unknown, never invented win rates."
          fi
      - name: Scan NBA NFL full-game moneylines spreads totals and player props
        run: |
          python v8_one_command.py --command run_nfl_props_edge \
            --sharp-archive-dir saved_sharp_archives \
            --calibration-file saved_forward_calibration/CALIBRATION.json \
            --output-dir v8_results/nfl_props_edge
      - name: Show research results and mandatory HOLD decision
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          path=Path("v8_results/nfl_props_edge/ONE_COMMAND_REPORT.json")
          if not path.is_file():
              lines=["# NFL + NBA Player Props Sharp Edge","**Status:** FAILED / HOLD. No verified betting edge."]
          else:
              data=json.loads(path.read_text())
              sharp=data.get("sharp_archive") or {}
              props=data.get("sharp_player_props") or {}
              games=data.get("sharp_full_game_markets") or {}
              calib=data.get("sharp_edge_calibration") or {}
              clv=data.get("sharp_edge_clv") or {}
              edge=data.get("nfl_and_player_props_edge_research") or {}
              if (data.get("command") != "run_nfl_props_edge"
                      or data.get("certified_positive_ev_bets") != 0
                      or edge.get("certified_positive_ev_bets") != 0
                      or edge.get("champion_001_modified") is not False
                      or calib.get("champion_001_modified") is not False
                      or calib.get("certified_positive_ev_bets") != 0
                      or calib.get("calibration_certified") is not False
                      or calib.get("native_calibration_applied_to_current_sharp_edge_quotes") is not False
                      or clv.get("realized_clv_percent") is not None
                      or clv.get("market_repricing_is_verified_clv") is not False
                      or clv.get("champion_001_modified") is not False):
                  raise ValueError("research_run_cannot_be_promoted_to_certified")
              lines=[
                  "# NFL + NBA Player Props Sharp Edge — Research Only",
                  "**Executed command:** run_nfl_props_edge",
                  f"**Saved SharpAPI runs:** {sharp.get('archive_run_ids', [])}",
                  f"**NFL primary game moneyline quotes:** {edge.get('nfl_primary_moneyline_archive_observations', 0)}",
                  f"**Today's fully paired NBA/NFL full-game board games:** {games.get('today_recent_upcoming_full_games', 0)}",
                  f"**Today's fresh moneyline/spread/total repricing observations:** {games.get('today_recent_upcoming_market_movement_observations', 0)}",
                  f"**Full-game accepted quote observations by market:** {games.get('validated_source_quote_observations_by_league_and_market', {})}",
                  f"**NFL exact-player prop quotes:** {edge.get('nfl_exact_prop_archive_observations', 0)}",
                  f"**NBA exact-player prop quotes:** {edge.get('nba_exact_prop_archive_observations', 0)}",
                  f"**Historical exact-stat/line repricings:** {props.get('exact_player_stat_line_repricings_historical', 0)}",
                  f"**Upcoming recent prop repricings:** {props.get('upcoming_repricing_research_observations', 0)}",
                  f"**Excluded records:** {props.get('excluded_prop_rows_or_snapshots', {})}",
                  f"**Name-only provider quotes (IDs missing; unverified athletes):** {props.get('valid_provider_name_only_quote_observations_research_only', 0)}",
                  f"**Provider-ID-plus-name quotes (IDs still unauthenticated):** {props.get('valid_provider_id_plus_name_quote_observations_research_only', 0)}",
                  f"**Conflicting player-identity groups quarantined:** {props.get('conflicting_provider_identity_market_groups_excluded', 0)}",
                  "**Player identities are NOT independently authenticated. Source-name-only matching is archive research, never verification of active players.**",
                  "",
                  "## Today's NBA/NFL Full-Game Markets — moneyline, spread, total",
                  "**Provider event IDs and bookmaker-labeled quotes are not independent sportsbook checkout receipts or model edges.**",
                  "| Matchup | Moneyline (home / away) | Spread (home / away) | Total (Over / Under) | Verdict |",
                  "|---|---|---|---|---|",
              ]
              board=games.get('today_game_market_board') or []
              for g in board[:10]:
                  markets=g['paired_primary_markets']
                  def show(m):
                      a=markets.get(m)
                      if not a:
                          return "not paired"
                      odds=f"{a['home_or_over_odds']:+g} / {a['away_or_under_odds']:+g}"
                      if m=="moneyline":
                          return odds
                      return f"{a['home_or_over_line']:+g} / {a['away_or_under_line']:+g} ({odds})"
                  lines.append(f"| {g['away_team']} @ {g['home_team']} | {show('moneyline')} | {show('point_spread')} | {show('total_points')} | HOLD |")
              if not board:
                  lines.append("| No current fully paired markets available | — | — | — | HOLD |")
              lines.extend([
                  "",
                  "## Sharp Edge Probability View — Bookmaker Price Math, NOT Model Odds",
                  "**Break-even %** = probability required at the quoted price; **no-vig market %** = each side's implied probability divided by the two-sided sum. Neither measures actual sharp-bettor activity, native model confidence, or certified EV.",
                  "| Matchup | Moneyline no-vig Home/Away | Spread no-vig Home/Away | Total no-vig Over/Under | Model / EV |",
                  "|---|---|---|---|---|",
              ])
              def pct(market):
                  if not market:
                      return "N/A"
                  return f"{market['first_side_no_vig_market_percent']:.2f}% / {market['second_side_no_vig_market_percent']:.2f}%"
              for g in board[:10]:
                  gm=g["paired_primary_markets"]
                  lines.append(f"| {g['away_team']} @ {g['home_team']} | {pct(gm.get('moneyline'))} | {pct(gm.get('point_spread'))} | {pct(gm.get('total_points'))} | Unavailable / HOLD |")
              if not board:
                  lines.append("| No paired same-day market prices | — | — | — | HOLD |")
              lines.extend([
                  "",
                  "## NBA & NFL Player Prop Price Probabilities",
                  "**Over/Under percentages are derived from matching source prices only; player identity and availability remain unverified.**",
                  "| League | Player | Prop | Exact line | Over/Under price | Over/Under no-vig market % | Over/Under break-even % | Model p / EV |",
                  "|---|---|---|---:|---|---|---|---|",
              ])
              allprops=props.get('today_player_prop_market_probability_board') or {}
              shown=0
              for sport in ('nba','nfl'):
                  for q in (allprops.get(sport) or [])[:6]:
                      shown+=1
                      lines.append(
                          f"| {sport.upper()} | {q['player_name']} | {q['prop_stat']} | {q['line']:g} | "
                          f"{q['over_american_odds']:+g}/{q['under_american_odds']:+g} | "
                          f"{q['first_side_no_vig_market_percent']:.2f}%/{q['second_side_no_vig_market_percent']:.2f}% | "
                          f"{q['first_side_break_even_percent']:.2f}%/{q['second_side_break_even_percent']:.2f}% | N/A / HOLD |")
              if shown==0:
                  lines.append("| No paired upcoming current prop quotes | — | — | — | — | — | — | HOLD |")
              lines.extend([
                  "",
                  "**No verified independent sharp-bettor probability, calibrated model probability, or positive-EV edge is available.**",
                  "",
                  "## Closing Line Value (CLV) — Exact Entry + Closing Receipts Required",
                  f"**CLV status:** {clv.get('status', 'UNAVAILABLE')}",
                  f"**Matched original entry/closing receipts:** {clv.get('exact_market_entry_close_pairs', 0)}",
                  f"**Observed archived market repricings (NOT CLV):** {clv.get('archived_provider_market_repricing_observations', 0)}",
                  "**Realized CLV: UNAVAILABLE / HOLD — no verified matched entry and closing quote evidence. Early line movement is NOT CLV.**",
                  "",
                  "## Sharp Edge Calibration — Independent Original Forecasts + Mature Outcomes Only",
                  f"**Persisted NBA home-win research status:** {calib.get('persisted_nba_original_forward_calibration_status', 'UNAVAILABLE')}",
                  f"**NBA original forward forecasts archived / graded / pending:** {calib.get('nba_original_archived_forecasts')} / {calib.get('nba_original_graded_outcomes')} / {calib.get('nba_original_pending_grading')}",
                  f"**Minimum mature graded games:** Brier {calib.get('minimum_exploratory_brier_graded_games', 50)}; exploratory ECE {calib.get('minimum_exploratory_ece_graded_games', 100)} with populated fixed bins.",
                  "**SharpAPI prices and their no-vig percentages are NOT native model predictions and cannot establish model calibration.**",
                  "| Exact market | Eligible graded original outcomes | Research Brier | Research ECE | Applied to picks? |",
                  "|---|---:|---:|---:|---|",
              ])
              for market, m in (calib.get("market_calibration") or {}).items():
                  n=m.get("eligible_original_model_forecasts_graded")
                  n_display=str(n) if type(n) is int else "Unknown (no verified pair source)"
                  b=m.get("research_brier_score")
                  e=m.get("research_expected_calibration_error")
                  btxt=f"{b:.4f}" if b is not None else "Withheld"
                  etxt=f"{e:.4f}" if e is not None else "Withheld"
                  lines.append(f"| {market} | {n_display} | {btxt} | {etxt} | NO / HOLD |")
              lines.extend([
                  "**No calibration is automatically applied to today's NBA/NFL game or prop prices; no Champion-001 model updates.**",
                  "**Decision: PASS / HOLD — no independently certified +EV or executable DraftKings quote.**",
                  "**Champion-001 frozen; automated wagers: 0; research stake: $0.**",
              ])
          content="\n".join(lines)+"\n"
          print(content)
          if os.getenv("GITHUB_STEP_SUMMARY"):
              Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a").write(content)
          PY
      - name: Show probability and Sharp Edge percentages on every one-click run
        if: always()
        shell: bash
        run: |
          report="v8_results/nfl_props_edge/PROBABILITY_SHARP_EDGE_DASHBOARD.md"
          if test -f "$report"; then
            cat "$report"
            if test -n "${GITHUB_STEP_SUMMARY:-}"; then
              cat "$report" >> "$GITHUB_STEP_SUMMARY"
            fi
          else
            echo "Probability / Sharp Edge: N/A — no completed validated report; HOLD."
            if test -n "${GITHUB_STEP_SUMMARY:-}"; then
              echo "## Probability and Sharp Edge — N/A (run incomplete; HOLD)" >> "$GITHUB_STEP_SUMMARY"
            fi
          fi
      - name: Save research-only output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v8-nfl-props-edge-${{ github.run_id }}
          path: v8_results/nfl_props_edge/
          retention-days: 30
          if-no-files-found: warn

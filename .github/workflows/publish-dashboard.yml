name: Freddy's Picks AI — Publish Web Dashboard
# User Run NBA 2026-11-14 sync: publish latest completed 43641871765 only after artifact validation; no provider calls and no wagers.
on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - "Freddy's Picks AI V8 — One Command (phone + laptop)"
      - "Freddy's Picks AI V8 — NBA scoreboard live updates (research only)"
      - "Freddy's Picks AI V8 — NBA + NFL Games & Player Props Sharp Edge (one click)"
      - "Challenger-001 original eight-sport schedule preflight (research only)"
    types: [completed]
    branches: [main]
  # Refresh the public dashboard after a completed Sharp Edge/schedule audit;
  # this does NOT make archived quotes executable or independently certify EV.
  # Research website data freshness is best-effort, NOT a live sportsbook feed.
  schedule:
    - cron: '*/30 * * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/build_public_dashboard.py'
      - 'tests/test_build_public_dashboard.py'
      - 'docs/index.html'
      - 'docs/boardroom.html'
      - 'tests/test_v9_boardroom_public.py'
      - 'docs/app.js'
      - 'docs/styles.css'
      - '.github/workflows/publish-dashboard.yml'
      - 'scripts/collect_public_scoreboards.py'
      - 'scripts/build_existing_provider_market_board.py'
      - 'tests/test_existing_provider_market_board.py'
      - 'tests/test_public_hourly_scoreboards.py'

permissions:
  contents: write
  actions: read

concurrency:
  group: freddy-public-dashboard-main
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      pages_enabled: ${{ steps.pages_state.outputs.enabled }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate web application JavaScript and bundled static assets
        shell: bash
        run: |
          set -euo pipefail
          node --check docs/app.js
          python - <<'PY'
          from pathlib import Path
          import json
          from html.parser import HTMLParser
          class Assets(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.refs=[]
                  self.ids=[]
              def handle_starttag(self,tag,attrs):
                  a=dict(attrs)
                  if "id" in a:self.ids.append(a["id"])
                  if tag in ("link","script") and (a.get("href") or a.get("src")):
                      self.refs.append(a.get("href") or a.get("src"))
          root=Path("docs")
          html=(root/"index.html").read_text(encoding="utf-8")
          h=Assets();h.feed(html)
          assert len(h.ids)==len(set(h.ids)), "Duplicate element ID"
          for asset in h.refs:
              if asset.startswith("http"):continue
              p=(root/asset).resolve()
              assert p.is_file() and p.is_relative_to(root.resolve()),asset
          assert (root/"app.js").is_file() and (root/"styles.css").is_file()
          report=json.loads((root/"data"/"dashboard.json").read_text())
          assert report["schema"]=="freddys-picks-ai-public-v1"
          print("Public page, asset paths and JSON schema validated.")
          PY
      - name: Verify public-snapshot guardrails without contacting provider APIs
        run: |
          python -m unittest discover -s tests -p 'test_build_public_dashboard.py' -v
          python -m unittest discover -s tests -p 'test_v9_boardroom_public.py' -v
      - name: Retrieve latest completed V8 NBA, all-sports and scoreboard artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dashboard_inputs
          echo "MODEL_RUN=0" >> "$GITHUB_ENV"
          echo "LIVE_RUN=0" >> "$GITHUB_ENV"
          echo "ALL_RUN=0" >> "$GITHUB_ENV"
          echo "SCHEDULE_RUN=0" >> "$GITHUB_ENV"
          # Read ONLY workflow artifacts already completed successfully.
          # No SharpAPI, sportsbook or paid provider requests here.
          for rid in $(gh run list --repo "$GITHUB_REPOSITORY" \
               --workflow v8-one-command.yml --branch main --status success \
               --limit 50 --json databaseId --jq '.[].databaseId' || true); do
            if [[ ! "$rid" =~ ^[0-9]+$ ]]; then continue; fi
            mkdir -p dashboard_inputs/nba
            if gh run download "$rid" --repo "$GITHUB_REPOSITORY" \
                 --name "v8-one-command-run_nba_best_bets-$rid" \
                 --dir dashboard_inputs/nba >/dev/null 2>&1 &&
               [[ -s dashboard_inputs/nba/FULL_STACK_ALL_IN_ONE_REPORT.json ]]; then
              echo "MODEL_RUN=$rid" >> "$GITHUB_ENV"
              echo "NBA snapshot from completed run $rid"
              break
            fi
            rm -rf dashboard_inputs/nba
          done
          for rid in $(gh run list --repo "$GITHUB_REPOSITORY" \
               --workflow v8-nba-live-updates.yml --branch main --status success \
               --limit 12 --json databaseId --jq '.[].databaseId' || true); do
            if [[ ! "$rid" =~ ^[0-9]+$ ]]; then continue; fi
            mkdir -p dashboard_inputs/live
            if gh run download "$rid" --repo "$GITHUB_REPOSITORY" \
                 --name "v8-nba-live-updates-$rid" \
                 --dir dashboard_inputs/live >/dev/null 2>&1 &&
               [[ -s dashboard_inputs/live/NBA_LIVE_UPDATES.json ]]; then
              echo "LIVE_RUN=$rid" >> "$GITHUB_ENV"
              echo "NBA public scoreboard from completed run $rid"
              break
            fi
            rm -rf dashboard_inputs/live
          done
          # Old all-sports evidence is explicitly timestamped. It never
          # becomes a current score or verified, executable betting quote.
          for rid in $(gh run list --repo "$GITHUB_REPOSITORY" \
               --workflow v8-one-command.yml --branch main --status success \
               --limit 80 --json databaseId --jq '.[].databaseId' || true); do
            if [[ ! "$rid" =~ ^[0-9]+$ ]]; then continue; fi
            for alias in run_all run_sports; do
              mkdir -p dashboard_inputs/all
              if gh run download "$rid" --repo "$GITHUB_REPOSITORY" \
                   --name "v8-one-command-$alias-$rid" \
                   --dir dashboard_inputs/all >/dev/null 2>&1 &&
                 [[ -s dashboard_inputs/all/FULL_STACK_ALL_IN_ONE_REPORT.json ]]; then
                echo "ALL_RUN=$rid" >> "$GITHUB_ENV"
                echo "Eight-sport research from completed run $rid"
                break 2
              fi
              rm -rf dashboard_inputs/all
            done
          done

          # Independent eight-sport ESPN schedule preflight. Read-only,
          # original captured game listings; no sportsbook/provider spend.
          for rid in $(gh run list --repo "$GITHUB_REPOSITORY" \
               --workflow challenger-eight-sport-source-preflight.yml \
               --branch main --status success \
               --limit 30 --json databaseId --jq '.[].databaseId' || true); do
            if [[ ! "$rid" =~ ^[0-9]+$ ]]; then continue; fi
            mkdir -p dashboard_inputs/schedule
            if gh run download "$rid" --repo "$GITHUB_REPOSITORY" \
                 --name "eight-sport-source-preflight-$rid" \
                 --dir dashboard_inputs/schedule >/dev/null 2>&1 && \
               [[ -s dashboard_inputs/schedule/espn_schedule_capture.json ]]; then
              echo "SCHEDULE_RUN=$rid" >> "$GITHUB_ENV"
              echo "Eight-sport fixture snapshot from completed run $rid"
              break
            fi
            rm -rf dashboard_inputs/schedule
          done
      - name: Observe current eight-sport ESPN scores and published market references (no paid provider)
        shell: bash
        run: |
          set -euo pipefail
          python scripts/collect_public_scoreboards.py \
            --out dashboard_inputs/public_scoreboard.json
          python - <<'PY'
          import json
          from pathlib import Path
          v=json.loads(Path('dashboard_inputs/public_scoreboard.json').read_text())
          assert v['schema']=='freddys-espn-public-hourly-v1'
          assert v['champion_001_modified'] is False
          assert v['certified_positive_ev']==0
          assert len(v['leagues'])==8
          print("Eight-sport ESPN public observation completed; absent provider fields remain N/A.")
          PY
      - name: Read existing SharpAPI captures only (NO new paid API calls)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p dashboard_inputs/provider
          echo "BOOK_RUN=0" >> "$GITHUB_ENV"
          for rid in $(gh run list --repo "$GITHUB_REPOSITORY" \
              --workflow collect-sharpapi.yml --branch main --status success \
              --limit 12 --json databaseId --jq '.[].databaseId' || true); do
            [[ "$rid" =~ ^[0-9]+$ ]] || continue
            mkdir -p dashboard_inputs/provider/archive
            if gh run download "$rid" --repo "$GITHUB_REPOSITORY" \
                 --name "sharpapi-pregame-$rid" \
                 --dir dashboard_inputs/provider/archive >/dev/null 2>&1; then
              candidate="$(find dashboard_inputs/provider/archive/snapshots -maxdepth 1 \
                 -name 'sharpapi_dk_*.jsonl' -type f 2>/dev/null | sort | tail -n 1)"
              if [[ -n "$candidate" && -s "$candidate" ]]; then
                cp "$candidate" dashboard_inputs/provider/captured_quotes.jsonl
                echo "BOOK_RUN=$rid" >> "$GITHUB_ENV"
                echo "Existing provider artifact from $rid inspected; no provider API usage."
                break
              fi
            fi
            rm -rf dashboard_inputs/provider/archive
          done
      - name: Prepare current exact-game and player market reference rows
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test_existing_provider_market_board.py' -v
          python scripts/build_existing_provider_market_board.py \
            --quotes dashboard_inputs/provider/captured_quotes.jsonl \
            --public dashboard_inputs/public_scoreboard.json \
            --provider-run "$BOOK_RUN" \
            --out dashboard_inputs/provider/current_board.json
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('dashboard_inputs/provider/current_board.json').read_text())
          assert r['certified_positive_ev']==0 and r['checkout_prices_verified']==0
          assert set(r['leagues'])=={'nba','nfl','nhl','mlb','ncaaf','ncaab','mls','uefa_champions_league'}
          assert all(all(x['bet_ready'] is False and x['checkout_verified'] is False
                         for x in v['rows']) for v in r['leagues'].values())
          print("Verified imported rows:",sum(len(v['rows']) for v in r['leagues'].values()))
          PY
      - name: Generate bounded, sanitized public read-only snapshot
        shell: bash
        run: |
          set -euo pipefail
          python scripts/build_public_dashboard.py \
            --live-report dashboard_inputs/live/NBA_LIVE_UPDATES.json \
            --model-report dashboard_inputs/nba/FULL_STACK_ALL_IN_ONE_REPORT.json \
            --all-sports-report dashboard_inputs/all/FULL_STACK_ALL_IN_ONE_REPORT.json \
            --schedule-report dashboard_inputs/schedule/espn_schedule_capture.json \
            --public-report dashboard_inputs/public_scoreboard.json \
            --provider-market-report dashboard_inputs/provider/current_board.json \
            --previous-report docs/data/dashboard.json \
            --live-run "$LIVE_RUN" --model-run "$MODEL_RUN" --all-run "$ALL_RUN" --schedule-run "$SCHEDULE_RUN" \
            --out docs/data/dashboard.json
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('docs/data/dashboard.json')
          r=json.loads(p.read_text())
          assert r['schema']=='freddys-picks-ai-public-v1'
          assert r['model']['champion_frozen'] is True
          assert r['market']['certified_positive_ev']==0
          assert r['market']['verified_checkout_prices']==0
          assert len(r['games'])<=100
          assert set(r['slates'])=={'nba','nfl','nhl','mlb','ncaaf','ncaab','mls','uefa_champions_league'}
          assert all(v['game_count'] is None or v['game_count']<=100 for v in r['slates'].values())
          assert all(v['certified_positive_ev']==0 and v['verified_checkout_prices']==0 for v in r['market_by_league'].values())
          assert len(r['fresh_provider_markets']['leagues'])==8
          assert r['fresh_provider_markets']['certified_positive_ev']==0
          assert all(x['bet_ready'] is False and x['bookmaker_checkout_verified'] is False for lg in r['fresh_provider_markets']['leagues'].values() for x in lg['rows'])
          assert len(r['public_hourly_board'])==8
          assert all(g['market_reference'] is None or g['market_reference']['direct_checkout_verified'] is False for sport in r['public_hourly_board'].values() for g in sport['games'])
          print("Dashboard public snapshot verified: "+str(p))
          with open(__import__('os').environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
              summary.write("\n## Dashboard operational data quality\n")
              summary.write(f"- Snapshot generated: {r.get('generated_at_utc', 'unknown')}\n")
              summary.write(f"- Primary games: {len(r['games'])}\n")
              summary.write(f"- Live source: {r.get('live_source_status', 'unknown')}\n")
              summary.write(f"- Certified positive-EV selections: {r['market']['certified_positive_ev']}\n")
              summary.write(f"- Verified checkout prices: {r['market']['verified_checkout_prices']}\n")
              if not r['games']:
                  summary.write("- **ATTENTION:** Primary games list empty; inspect public_hourly_board and upstream source coverage.\n")
              if r.get('live_source_status') != 'FRESH_PUBLIC_SCOREBOARD':
                  summary.write("- **ATTENTION:** Live scoreboard source is not confirmed fresh; no live-data claim.\n")
          PY
      - name: Commit research-only dashboard data to main for GitHub Pages
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/dashboard.json
          if git diff --cached --quiet; then
            echo "Public dashboard snapshot unchanged."
          else
            git commit -m "dashboard: refresh public V8 research snapshot [skip ci]"
            git push origin HEAD:main
            echo "Public dashboard updated on the main/docs branch."
          fi
      - name: Verify GitHub Pages is configured for official Actions deployment
        id: pages_state
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          echo "enabled=false" >> "$GITHUB_OUTPUT"
          if gh api "repos/$GITHUB_REPOSITORY/pages" --jq '.build_type' > pages_type.txt 2>/dev/null; then
            if grep -qx workflow pages_type.txt; then
              echo "enabled=true" >> "$GITHUB_OUTPUT"
              echo "GitHub Pages source is GitHub Actions: automatic deployment enabled."
            else
              echo "GitHub Pages exists, but publishing source is not GitHub Actions."
              echo "Set Settings → Pages → Source → GitHub Actions."
            fi
          else
            echo "GitHub Pages has not been enabled. Site files and public data are ready."
          fi
      - name: Show publication status and Pages activation instruction
        if: always()
        run: |
          echo "## Freddy's Picks AI — Public Web Dashboard" >> "$GITHUB_STEP_SUMMARY"
          echo "Read-only static site files: **docs/index.html**" >> "$GITHUB_STEP_SUMMARY"
          echo "Data feed: **docs/data/dashboard.json**" >> "$GITHUB_STEP_SUMMARY"
          echo "To publish the first time: Repository Settings → Pages → Build and deployment → Source: GitHub Actions." >> "$GITHUB_STEP_SUMMARY"
          echo "Public URL (once GitHub Pages is enabled): https://frederickwalker66-cmyk.github.io/Freddy-s-sports-data/" >> "$GITHUB_STEP_SUMMARY"

  deploy_pages:
    needs: publish
    if: needs.publish.result == 'success' && needs.publish.outputs.pages_enabled == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: freddy-pages-deployment
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Package the latest updated docs site
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        name: Deploy verified static site to GitHub Pages
        uses: actions/deploy-pages@v4

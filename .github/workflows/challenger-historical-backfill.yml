name: Challenger-001 capped eight-league historical results (research only)
on:
  workflow_dispatch:
    inputs:
      end_date:
        description: "Optional historical window end date YYYY-MM-DD; blank uses each league's in-season default"
        required: false
        type: string
      days:
        description: "Historical calendar days per league (1-35)"
        required: false
        default: "35"
        type: string
  push:
    branches: [main]
    paths:
      - 'challenger_historical_backfill.py'
      - 'challenger_multiseason_history.py'
      - 'challenger_nba_player_boxes.py'
      - 'challenger_oos_calibration.py'
      - 'challenger_artifact_manifest.py'
      - 'champion_001_authentication.py'
      - 'tests/test_challenger_historical_backfill.py'
      - 'tests/test_challenger_multiseason_history.py'
      - 'tests/test_six_stage_validation.py'
      - '.github/workflows/challenger-historical-backfill.yml'
  pull_request:
    paths:
      - 'challenger_historical_backfill.py'
      - 'challenger_multiseason_history.py'
      - 'tests/test_challenger_historical_backfill.py'
      - 'tests/test_challenger_multiseason_history.py'
      - '.github/workflows/challenger-historical-backfill.yml'
concurrency:
  group: challenger-eight-league-historical-results
  cancel-in-progress: false
permissions:
  contents: read
  actions: read
jobs:
  offline-safety-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate request caps, chronology, and quarantine with synthetic data
        run: python -m unittest discover -s tests -v
  archived-public-scores:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: offline-safety-tests
    runs-on: ubuntu-latest
    timeout-minutes: 18
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        league: [nba, nhl, mlb, nfl, ncaaf, ncaab, mls, uefa_champions_league]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check capped historical window and zero sportsbook API calls
        shell: bash
        env:
          HISTORY_DAYS: ${{ inputs.days || '35' }}
          HISTORY_END_DATE: ${{ inputs.end_date || '' }}
        run: |
          set -euo pipefail
          args=(--league "${{ matrix.league }}" --days "$HISTORY_DAYS")
          if [[ -n "$HISTORY_END_DATE" ]]; then args+=(--end-date "$HISTORY_END_DATE"); fi
          python challenger_historical_backfill.py "${args[@]}" --dry-run
      - name: Collect historical scores and quarantine candidate features
        shell: bash
        env:
          HISTORY_DAYS: ${{ inputs.days || '35' }}
          HISTORY_END_DATE: ${{ inputs.end_date || '' }}
        run: |
          set -euo pipefail
          args=(--league "${{ matrix.league }}" --days "$HISTORY_DAYS" --output-dir challenger_backfill)
          if [[ -n "$HISTORY_END_DATE" ]]; then args+=(--end-date "$HISTORY_END_DATE"); fi
          python challenger_historical_backfill.py "${args[@]}"
      - name: Reject any qualified-training or betting promotion
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          result=json.loads(Path("challenger_backfill/backfill_coverage.json").read_text())
          assert 1 <= result["days_requested"] <= 35
          assert result["public_scoreboard_requests_maximum"] == result["days_requested"]
          assert result["sportsbook_api_requests"] == result["sportsgameodds_requests"] == 0
          assert result["qualified_training_examples"] == result["officially_adjudicated_results"] == 0
          assert result["bookmaker_market_settlement_verified"] is False
          assert result["soccer_90_minute_result_verified"] is False
          if result["league"] in ("mls", "uefa_champions_league"):
              assert result["quarantined_research_candidates"] == 0
              assert result["result_scope"] == "published_soccer_score_three_way_unverified_90min"
          assert result["scoreboard_days_successful"] > 0
          assert result["qualified_training_examples"] == 0
          assert result["certified_champion_001_predictions"] == 0
          assert result["certified_challenger_001_predictions"] == 0
          assert result["bet_ready_selections"] == 0
          assert result["automated_bets_placed"] == 0
          assert result["champion_001_modified"] is False
          for line in Path("challenger_backfill/research_candidates.jsonl").read_text().splitlines():
              row=json.loads(line)
              assert row["qualified_for_challenger_backtest"] is False
              assert row["historical_odds_snapshot_verified"] is False
              assert row["bet_ready"] is False
          print("Published results:", result["published_completed_game_results"])
          print("Quarantined candidate rows:", result["quarantined_research_candidates"])
          print("Source days failed:", result["scoreboard_days_failed"])
          PY
      - name: Archive league-specific public research evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: challenger-backfill-${{ matrix.league }}-${{ github.run_id }}
          path: challenger_backfill/
          retention-days: 30
          if-no-files-found: warn

  consolidate-published-historical-results:
    if: github.event_name != 'pull_request'
    needs: [offline-safety-tests, archived-public-scores]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download current eight archives and up to six successful prior batches
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p archives
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --pattern "challenger-backfill-*-$GITHUB_RUN_ID" \
            --dir "archives/$GITHUB_RUN_ID"
          downloaded=1
          mapfile -t previous < <(gh run list --repo "$GITHUB_REPOSITORY" \
            --workflow challenger-historical-backfill.yml --branch main \
            --status success --limit 6 --json databaseId --jq '.[].databaseId')
          for rid in "${previous[@]}"; do
            [[ "$rid" == "$GITHUB_RUN_ID" ]] && continue
            if gh run download "$rid" --repo "$GITHUB_REPOSITORY" \
              --pattern "challenger-backfill-*-$rid" \
              --dir "archives/$rid"; then
              ((downloaded+=1))
            else
              rm -rf "archives/$rid"
              echo "Prior run $rid unavailable; no historical rows fabricated."
            fi
          done
          echo "Archived result batches downloaded: $downloaded"
      - name: Consolidate deduplicated multi-season published score SQLite
        run: |
          python challenger_multiseason_history.py \
            --archive-root archives --output-dir challenger_multiseason
      - name: Enforce zero training, sportsbook settlement and wagers
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, sqlite3
          from pathlib import Path
          folder=Path("challenger_multiseason")
          report=json.loads((folder/"history_coverage.json").read_text())
          assert report["archive_windows_accepted"] >= 8, report
          assert report["independently_qualified_training_records"] == 0
          assert report["verified_bookmaker_settlement_results"] == 0
          assert report["historical_player_boxscores"] == 0
          assert report["verified_90_min_soccer_market_results"] == 0
          assert report["certified_champion_001_predictions"] == 0
          assert report["certified_challenger_001_predictions"] == 0
          assert report["bet_ready_selections"] == report["automated_bets_placed"] == 0
          assert report["sportsgameodds_api_requests"] == 0
          assert report["champion_001_modified"] is False
          with sqlite3.connect(folder/"historical_published_scores.sqlite") as db:
            n=db.execute("SELECT COUNT(*) FROM published_games").fetchone()[0]
            flag=db.execute("SELECT COUNT(*) FROM published_games WHERE historically_qualified_training != 0 OR bookmaker_settlement_verified != 0 OR independent_outcome_adjudication != 0").fetchone()[0]
          assert n == report["published_games_deduplicated"] and flag == 0
          print("Unique archived published results:", n)
          print("Nontrainable multi-season coverage:", len(report["by_league_season"]))
          PY
      - name: Stage 2 Champion artifact inventory (no model execution)
        run: |
          python champion_001_authentication.py --output challenger_multiseason/champion_authentication.json
          python - <<'PY'
          import json
          r=json.load(open('challenger_multiseason/champion_authentication.json'))
          assert r['original_executable_verified'] is False
          assert r['champion_001_modified'] is False
          PY
      - name: Stage 5 calibrate only independently qualified evidence (fail closed)
        run: |
          touch challenger_multiseason/independently_qualified_holdout.jsonl
          python challenger_oos_calibration.py \
            --evidence challenger_multiseason/independently_qualified_holdout.jsonl \
            --output challenger_multiseason/oos_calibration_report.json
          python - <<'PY'
          import json
          r=json.load(open('challenger_multiseason/oos_calibration_report.json'))
          assert r['qualified_groups_with_50plus'] == r['certified_groups'] == 0
          assert r['champion_001_modified'] is False
          PY
      - name: Stage 6 record archive SHA256 fingerprints (not external signature or durable store)
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          python challenger_artifact_manifest.py \
            --files challenger_multiseason/historical_published_scores.sqlite \
                    challenger_multiseason/history_coverage.json \
                    challenger_multiseason/oos_calibration_report.json \
                    challenger_multiseason/champion_authentication.json \
            --run-id "$GITHUB_RUN_ID" --commit "$SOURCE_COMMIT" \
            --output challenger_multiseason/artifact_integrity_manifest.json
      - name: Archive SQLite and coverage report (temporary, not permanent storage)
        uses: actions/upload-artifact@v4
        with:
          name: challenger-multiseason-research-${{ github.run_id }}
          path: challenger_multiseason/
          retention-days: 90
          if-no-files-found: error

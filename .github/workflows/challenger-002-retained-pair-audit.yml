name: Challenger-002 retained NBA pair audit
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/challenger-002-retained-pair-audit.yml'
      - 'research/challenger_002_nba_schema_profile.py'
      - 'research/challenger_002_nba_research_join.py'
      - 'research/challenger_002_nba_temporal_audit.py'
      - 'research/challenger_002_nba_timezone_sensitivity.py'
      - 'research/challenger_002_nba_odds_schema.py'
      - 'research/challenger_002_nba_sportsbook_audit.py'
      - 'research/challenger_002_nba_sportsbook_census.py'
      - 'research/challenger_002_nba_identity_gate.py'
      - 'research/challenger_002_nba_market_time.py'
      - 'research/challenger_002_nba_market_time_formats.py'
  workflow_dispatch:
    inputs:
      scores_run_id:
        description: "Successful NBA scores snapshot run ID"
        required: true
        default: "44931759996"
        type: string
      odds_run_id:
        description: "Successful NBA odds snapshot run ID"
        required: true
        default: "44932013570"
        type: string
permissions:
  contents: read
  actions: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v4
        with:
          name: challenger-002-nba-intake-metadata
          run-id: ${{ inputs.scores_run_id || '44931759996' }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/scores-metadata
      - uses: actions/download-artifact@v4
        with:
          pattern: challenger-002-licensed-nba_scores-*
          run-id: ${{ inputs.scores_run_id || '44931759996' }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/scores
      - uses: actions/download-artifact@v4
        with:
          name: challenger-002-nba-intake-metadata
          run-id: ${{ inputs.odds_run_id || '44932013570' }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/odds-metadata
      - uses: actions/download-artifact@v4
        with:
          pattern: challenger-002-licensed-nba_odds-*
          run-id: ${{ inputs.odds_run_id || '44932013570' }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/odds
      - name: Validate retained artifacts without logging licensed records
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          from research.challenger_002_artifact_pair_audit import audit_pair
          root=Path(os.environ["RUNNER_TEMP"])
          def single(folder):
              matches=list((root/folder).rglob("*.json"))
              if len(matches)!=1:
                  raise RuntimeError(f"EXPECTED_EXACTLY_ONE_JSON_IN_{folder}: {len(matches)}")
              return matches[0]
          report=audit_pair(single("scores").read_bytes(),
                            single("odds").read_bytes(),
                            json.loads(single("scores-metadata").read_text()),
                            json.loads(single("odds-metadata").read_text()))
          (root/"nba-pair-audit.json").write_text(json.dumps(report,indent=2)+"\n")
          lines=["## Retained NBA scores/odds artifact audit","",
                 f"- Game date: {report['game_date']}",
                 f"- Digest integrity: {'PASS' if report['digest_integrity_passed'] else 'FAIL'}",
                 "- Certification: HOLD",
                 "- Certified TAKE: 0", "", "### Unverified requirements"]
          lines += ["- "+x for x in report["blockers"]]
          Path(os.environ["GITHUB_STEP_SUMMARY"]).write_text("\n".join(lines)+"\n")
          assert report["digest_integrity_passed"], "Stored snapshot digest mismatch"
          assert "DIFFERENT_GAME_DATES" not in report["blockers"], "Game date mismatch"
          assert "SCORES_METADATA_MISMATCH" not in report["blockers"], "Scores metadata mismatch"
          assert "ODDS_METADATA_MISMATCH" not in report["blockers"], "Odds metadata mismatch"
          from research.challenger_002_nba_schema_profile import profile
          schema=profile(json.loads(single("scores").read_text()), json.loads(single("odds").read_text()))
          (root/"nba-schema-profile.json").write_text(json.dumps(schema,indent=2)+"\\n")
          print("SANITIZED_NBA_SCHEMA_PROFILE="+json.dumps(schema,sort_keys=True))
          from research.challenger_002_nba_research_join import build
          joined=build(json.loads(single("scores").read_text()),json.loads(single("odds").read_text()),
                       json.loads(single("scores-metadata").read_text()),json.loads(single("odds-metadata").read_text()))
          (root/"nba-research-join.json").write_text(json.dumps(joined,indent=2)+"\n")
          print("NBA_RESEARCH_JOIN_COUNTS="+json.dumps({k:v for k,v in joined.items() if k!="research_join_rows"},sort_keys=True))
          from research.challenger_002_nba_temporal_audit import audit as temporal_audit
          temporal=temporal_audit(json.loads(single("scores").read_text()),
                                  json.loads(single("odds").read_text()),
                                  json.loads(single("scores-metadata").read_text()),
                                  json.loads(single("odds-metadata").read_text()))
          (root/"nba-temporal-audit.json").write_text(json.dumps(temporal,indent=2)+"\\n")
          print("NBA_TEMPORAL_AUDIT="+json.dumps(temporal,sort_keys=True))
          from research.challenger_002_nba_timezone_sensitivity import analyze
          sensitivity=analyze(json.loads(single("scores").read_text()),
                              json.loads(single("odds").read_text()),
                              json.loads(single("scores-metadata").read_text()),
                              json.loads(single("odds-metadata").read_text()))
          (root/"nba-timezone-sensitivity.json").write_text(json.dumps(sensitivity,indent=2)+"\\n")
          print("NBA_TIMEZONE_SENSITIVITY="+json.dumps(sensitivity,sort_keys=True))
          from research.challenger_002_nba_odds_schema import profile as odds_schema_profile
          market_schema=odds_schema_profile(json.loads(single("odds").read_text()))
          (root/"nba-odds-schema.json").write_text(json.dumps(market_schema,indent=2)+"\\n")
          print("NBA_ODDS_MARKET_SCHEMA="+json.dumps(market_schema,sort_keys=True))
          from research.challenger_002_nba_sportsbook_audit import audit as sportsbook_audit
          sportsbook=sportsbook_audit(json.loads(single("odds").read_text()))
          (root/"nba-sportsbook-audit.json").write_text(json.dumps(sportsbook,indent=2)+"\\n")
          print("NBA_SPORTSBOOK_SCREEN="+json.dumps(sportsbook,sort_keys=True))
          from research.challenger_002_nba_sportsbook_census import census
          sportsbook_census=census(json.loads(single("odds").read_text()))
          (root/"nba-sportsbook-census.json").write_text(json.dumps(sportsbook_census,indent=2)+"\\n")
          print("NBA_SPORTSBOOK_CENSUS="+json.dumps(sportsbook_census,sort_keys=True))
          from research.challenger_002_nba_identity_gate import gate as identity_gate
          identity=identity_gate(json.loads(single("odds").read_text()))
          (root/"nba-identity-gate.json").write_text(json.dumps(identity,indent=2)+"\\n")
          print("NBA_IDENTITY_GATE="+json.dumps(identity,sort_keys=True))
          from research.challenger_002_nba_market_time import audit as market_time_audit
          market_time=market_time_audit(json.loads(single("scores").read_text()),
                                        json.loads(single("odds").read_text()),
                                        json.loads(single("odds-metadata").read_text()))
          (root/"nba-market-time.json").write_text(json.dumps(market_time,indent=2)+"\\n")
          print("NBA_MARKET_TIME="+json.dumps(market_time,sort_keys=True))
          from research.challenger_002_nba_market_time_formats import census as time_format_census
          formats=time_format_census(json.loads(single("odds").read_text()))
          (root/"nba-market-time-formats.json").write_text(json.dumps(formats,indent=2)+"\\n")
          print("NBA_MARKET_TIME_FORMATS="+json.dumps(formats,sort_keys=True))
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a") as summary:
              summary.write(f"\n### Research-only joined games: {joined['joined_game_count']}\n")
              summary.write("- Certified TAKE: 0; training approval: 0\n")
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a") as summary:
              summary.write("\\n### Game-ID join diagnostics\\n")
              summary.write(f"- Score records: {schema.get('score_records',0)}\\n")
              summary.write(f"- Odds records: {schema.get('odds_records',0)}\\n")
              for item in schema.get("join_candidates",[]):
                  summary.write(f"- {item['field']}: {item['unique_matching_ids']} unique matches\\n")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: challenger-002-nba-pair-audit-report
          path: |
            ${{ runner.temp }}/nba-pair-audit.json
            ${{ runner.temp }}/nba-schema-profile.json
            ${{ runner.temp }}/nba-research-join.json
            ${{ runner.temp }}/nba-temporal-audit.json
            ${{ runner.temp }}/nba-timezone-sensitivity.json
            ${{ runner.temp }}/nba-odds-schema.json
            ${{ runner.temp }}/nba-sportsbook-audit.json
            ${{ runner.temp }}/nba-sportsbook-census.json
            ${{ runner.temp }}/nba-identity-gate.json
            ${{ runner.temp }}/nba-market-time.json
            ${{ runner.temp }}/nba-market-time-formats.json
          if-no-files-found: ignore
          retention-days: 30

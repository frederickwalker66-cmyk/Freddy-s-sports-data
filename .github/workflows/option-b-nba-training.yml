name: Freddy's Picks AI — Option B NBA Prediction Training
on:
  workflow_dispatch:
  schedule:
    - cron: '25 12 * * *'
permissions:
  contents: read
jobs:
  nba-training:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Stage archived historical NBA evidence when provided
        run: python -m research.nba_historical_ingestion
      - name: Probe existing NBA provider access without exposing credentials
        continue-on-error: true
        env:
          SPORTSDATAIO_ODDS_API_KEY: ${{ secrets.SPORTSDATAIO_ODDS_API_KEY || secrets.SPORTSDATAIO }}
          SPORTSDATAIO_NBA_API_KEY: ${{ secrets.SPORTSDATAIO_NBA_API_KEY || secrets.SPORTSDATAIO }}
        run: |
          python -m research.sportsdataio_nba_probe --output challenger_results/nba_probability/provider_readiness.json
      - name: Explain historical data readiness
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          history=Path('prediction_input/qualified_nba_history.jsonl')
          lines=history.read_text().splitlines() if history.is_file() else []
          count=sum(bool(line.strip()) for line in lines)
          p=Path('challenger_results/nba_probability/provider_readiness.json')
          provider=json.loads(p.read_text()) if p.is_file() else {}
          statuses={k:v.get('status') for k,v in provider.get('endpoints',{}).items()}
          report={'historical_rows_supplied':count,'minimum_required':250,
                  'historical_input_present':history.is_file(),
                  'provider_endpoint_statuses':statuses,
                  'provider_live_access_is_not_historical_evidence':True,
                  'next_action':('Review and qualify at least 250 authentic pregame NBA records with settled outcomes'
                                 if count<250 else 'Run strict chronological qualification and training'),
                  'certified_take_count':0}
          out=Path('challenger_results/nba_probability/readiness_diagnostic.json')
          out.parent.mkdir(parents=True,exist_ok=True)
          out.write_text(json.dumps(report,indent=2,sort_keys=True)+'\\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
              f.write('## NBA single-run data diagnosis\\n\\n')
              f.write(f'Historical rows supplied: {count} / minimum 250\\n\\n')
              f.write('Provider endpoint statuses: '+json.dumps(statuses)+'\\n\\n')
              f.write('Provider availability alone does not authenticate historical pregame features.\\n\\n')
              f.write('Next: '+report['next_action']+'\\n')
          PY
      - name: Validate native NBA training code
        run: python -m unittest discover -s tests -p 'test_challenger_nba_probability.py' -v
      - name: Validate Challenger-to-Prediction bridge
        run: python -m unittest discover -s tests -p 'test_challenger_prediction_bridge.py' -v
      - name: Train only on reviewed point-in-time historical evidence
        run: |
          python challenger_nba_probability.py \
            --history prediction_input/qualified_nba_history.jsonl \
            --output-dir challenger_results/nba_probability
      - name: Enforce evidence readiness and separate from certification
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('challenger_results/nba_probability')
          r=json.loads((p/'report.json').read_text())
          model=p/'research_model.json'
          if model.exists():
              m=json.loads(model.read_text())
              assert m['champion_001_modified'] is False
              assert m['qualified_for_real_money_wagers'] is False
              assert m['holdout_excluded_from_coefficients'] is True
              assert m['holdout_metrics_apply_to_saved_model'] is True
          else:
              assert r.get('result') != 'fitted_unverified_research_model'
          with open(__import__('os').environ['GITHUB_STEP_SUMMARY'],'a') as f:
              f.write('## Option B — NBA Prediction Training\n\n')
              f.write('Training status: '+str(r.get('result'))+'\n\n')
              f.write('Native research model artifact: '+('generated (uncertified)' if model.exists() else 'not generated; evidence insufficient')+'\n\n')
              f.write('Certified TAKE: 0; Champion-001 unchanged.\n')
          PY
      - name: Bridge real Challenger forecast into Prediction Mode if candidate exists
        shell: bash
        run: |
          if [[ -f challenger_results/nba_probability/research_model.json && -f prediction_input/nba_future_candidate.json ]]; then
            python -m research.challenger_prediction_bridge \
              --model challenger_results/nba_probability/research_model.json \
              --candidate prediction_input/nba_future_candidate.json \
              --output challenger_results/nba_probability/prediction_mode_research.json
          else
            echo 'No qualified model and/or future candidate; prediction remains HOLD.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: option-b-nba-training-report
          path: challenger_results/nba_probability/
          retention-days: 30

name: Freddy's Picks AI — Prediction Mode (native evidence only)
on:
  workflow_dispatch:
  schedule:
    - cron: '10 13,21 * * *'
permissions:
  contents: read
jobs:
  prediction-mode:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Score real Challenger NBA model when verified input artifacts exist
        shell: bash
        run: |
          set -euo pipefail
          model="prediction_input/challenger_nba_model.json"
          candidate="prediction_input/nba_future_candidate.json"
          if [[ -s "$model" && -s "$candidate" ]]; then
            mkdir -p prediction_output
            python -m research.challenger_prediction_bridge --model "$model" --candidate "$candidate" --output prediction_output/challenger_nba_research.json
            echo "Challenger native NBA research forecast generated (not certified)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Native NBA scoring blocked: model or future candidate evidence missing; no synthetic predictions." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Build native-only prediction display
        run: python prediction_mode.py --output prediction_output/predictions.json
      - name: Show prediction readiness
        shell: bash
        run: |
          echo '## Prediction Mode' >> "$GITHUB_STEP_SUMMARY"
          echo 'Native-only forecasts; zero certified TAKE unless independently verified by separate certification service.' >> "$GITHUB_STEP_SUMMARY"
          cat prediction_output/predictions.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: prediction-mode-display
          path: prediction_output/
          retention-days: 14

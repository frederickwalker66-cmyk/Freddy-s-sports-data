name: Challenger-001 original eight-sport schedule preflight (research only)

on:
  workflow_dispatch:
  # One genuine live source preflight on introduction/changes to this workflow
  # and script. The already-installed twice-daily main capture keeps its
  # existing schedule; this workflow does not duplicate that recurring scan.
  push:
    branches: [main]
    paths:
      - 'challenger_eight_sport_source_preflight.py'
      - 'challenger_eight_sport_independent_identity.py'
      - 'challenger_mlb_official_pregame_schedule.py'
      - 'challenger_nba_official_pregame_schedule.py'
      - 'challenger_exact_market_research_gate.py'
      - 'challenger_model_completion_gate.py'
      - 'challenger_nflverse_pregame_crosscheck.py'
      - 'challenger_rolling_pregame_archive.py'
      - 'challenger_operational_priority_queue.py'
      - 'tests/test_challenger_eight_sport_source_preflight.py'
      - 'tests/test_challenger_eight_sport_independent_identity.py'
      - 'tests/test_challenger_mlb_official_pregame_schedule.py'
      - 'tests/test_challenger_nba_official_pregame_schedule.py'
      - 'tests/test_challenger_model_completion_sequence.py'
      - 'tests/test_challenger_nflverse_pregame_crosscheck.py'
      - 'tests/test_challenger_rolling_pregame_archive.py'
      - 'tests/test_challenger_operational_priority_queue.py'
      - '.github/workflows/challenger-eight-sport-source-preflight.yml'
  pull_request:
    paths:
      - 'challenger_eight_sport_source_preflight.py'
      - 'challenger_eight_sport_independent_identity.py'
      - 'challenger_mlb_official_pregame_schedule.py'
      - 'challenger_nba_official_pregame_schedule.py'
      - 'challenger_exact_market_research_gate.py'
      - 'challenger_model_completion_gate.py'
      - 'challenger_nflverse_pregame_crosscheck.py'
      - 'challenger_rolling_pregame_archive.py'
      - 'challenger_operational_priority_queue.py'
      - 'tests/test_challenger_eight_sport_source_preflight.py'
      - 'tests/test_challenger_eight_sport_independent_identity.py'
      - 'tests/test_challenger_mlb_official_pregame_schedule.py'
      - 'tests/test_challenger_nba_official_pregame_schedule.py'
      - 'tests/test_challenger_model_completion_sequence.py'
      - 'tests/test_challenger_nflverse_pregame_crosscheck.py'
      - 'tests/test_challenger_rolling_pregame_archive.py'
      - 'tests/test_challenger_operational_priority_queue.py'
      - '.github/workflows/challenger-eight-sport-source-preflight.yml'

permissions:
  contents: read
  actions: read

jobs:
  offline-source-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test original source custody, empty slates and no betting promotion
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test_challenger_eight_sport_independent_identity.py' -v
          python -m unittest discover -s tests -p 'test_challenger_mlb_official_pregame_schedule.py' -v
          python -m unittest discover -s tests -p 'test_challenger_nba_official_pregame_schedule.py' -v
          python -m unittest discover -s tests -p 'test_challenger_model_completion_sequence.py' -v
          python -m unittest discover -s tests -p 'test_challenger_nflverse_pregame_crosscheck.py' -v
          python -m unittest discover -s tests -p 'test_challenger_rolling_pregame_archive.py' -v
          python -m unittest discover -s tests -p 'test_challenger_operational_priority_queue.py' -v
          python -m unittest discover -s tests -p 'test_challenger_eight_sport_source_preflight.py' -v
          python -m unittest discover -s tests -p 'test_challenger_eight_sport_original_schedule_bytes.py' -v
          python -m unittest discover -s tests -p 'test_challenger_eight_sport_schedule_outlook.py' -v

  live-eight-sport-source:
    # Pull requests run synthetic tests only. Push on main or manual dispatch
    # captures actual source bytes. No secrets, odds, trades or predictions.
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    needs: offline-source-safety
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Capture actual ESPN seven-day source original bytes for all eight leagues
        run: |
          set -euo pipefail
          python challenger_eight_sport_source_preflight.py \
            --lookahead-days 7 \
            --output-dir seven_day_source_preflight
      - name: Verify live source coverage totals and frozen research gates
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('seven_day_source_preflight')
          r=json.loads((root/'preflight_summary.json').read_text())
          c=json.loads((root/'eight_sport_schedule_coverage.json').read_text())
          expected={'nba','nfl','mlb','nhl','ncaaf','ncaab','mls','uefa_champions_league'}
          assert set(r['by_league']) == expected
          assert r['totals'] == c['totals']
          assert r['archived_game_fields_verified']==r['totals']['pregame_events_archived']
          assert r['original_response_bytes_verified']==sum(
              row['source_days_succeeded'] for row in r['by_league'].values())
          assert r['source_independently_authenticated'] is False
          assert r['official_league_schedule_independently_verified'] is False
          for key in ('qualified_chronological_training_games',
                      'certified_champion_001_predictions',
                      'certified_challenger_001_predictions',
                      'certified_positive_ev_bets',
                      'bet_ready_selections','automated_bets_placed'):
              assert r[key] == 0,(key,r[key])
          assert r['champion_001_modified'] is False
          print('Verified first live source coverage by league:',
                {league:(row['future_games_archived'],
                         row['source_days_failed'],
                         row['coverage_class'])
                 for league,row in r['by_league'].items()})
          PY
      - name: Research-only independent NHL MLB NBA identities (other leagues quarantined)
        run: |
          set -euo pipefail
          python challenger_eight_sport_independent_identity.py \
            --capture-dir seven_day_source_preflight \
            --output-dir seven_day_source_preflight/independent_identity
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('seven_day_source_preflight/independent_identity/independent_game_identity_report.json').read_text())
          s=json.loads(Path('seven_day_source_preflight/preflight_summary.json').read_text())
          assert r['archived_espn_events_reviewed']==s['totals']['pregame_events_archived']
          assert r['independently_observed_nhl_pregame_identity_matches_research_only'] <= s['by_league']['nhl']['future_games_archived']
          assert r['independently_observed_mlb_pregame_identity_matches_research_only'] <= s['by_league']['mlb']['future_games_archived']
          assert r['independently_observed_nba_pregame_identity_matches_research_only'] <= s['by_league']['nba']['future_games_archived']
          for k in ('direct_draftkings_checkout_markets_verified',
                    'verified_native_model_probabilities',
                    'qualified_chronological_training_games',
                    'certified_champion_001_predictions',
                    'certified_challenger_001_predictions',
                    'certified_positive_ev_bets',
                    'bet_ready_selections','automated_bets_placed'):
              assert r[k]==0,(k,r[k])
          assert r['champion_001_modified'] is False
          PY
      - name: "#83 independently published nflverse original NFL pregame identities (third-party research only)"
        shell: bash
        run: |
          set -euo pipefail
          python challenger_nflverse_pregame_crosscheck.py \
            --capture-dir seven_day_source_preflight \
            --output-dir seven_day_source_preflight/nfl_third_party
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('seven_day_source_preflight')
          report=json.loads((root/'nfl_third_party/nfl_third_party_identity_report.json').read_text())
          coverage=json.loads((root/'eight_sport_schedule_coverage.json').read_text())
          assert report['nfl_games_reviewed']==coverage['by_league']['nfl']['archived_pregame_games']
          assert report['official_nfl_operated_identity_matches_verified']==0
          assert report['qualified_training_games']==0
          assert report['certified_positive_ev_bets']==0
          assert report['champion_001_modified'] is False
          print('Third-party NFL pregame original matches (NOT NFL-operated):',
                report['independent_third_party_pregame_identity_matches_research_only'])
          PY
      - name: "#84 rolling verified original-byte ESPN pregame ledger across available prior runs"
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p previous_source_captures
          # The current run is not 'success' yet. Read up to four *previous*
          # successful main-run artifacts, never replace original current data.
          for rid in $(gh run list --repo "$GITHUB_REPOSITORY" \
                         --workflow challenger-eight-sport-source-preflight.yml \
                         --branch main --status success --limit 4 \
                         --json databaseId --jq '.[].databaseId' 2>/dev/null || true); do
            if [[ ! "$rid" =~ ^[0-9]+$ ]]; then continue; fi
            mkdir -p "previous_source_captures/$rid"
            if ! gh run download "$rid" --repo "$GITHUB_REPOSITORY" \
                 --name "eight-sport-source-preflight-$rid" \
                 --dir "previous_source_captures/$rid"; then
              echo "Previous source run $rid unavailable; not considered a prior confirmed observation."
              rm -rf "previous_source_captures/$rid"
            fi
          done
          python challenger_rolling_pregame_archive.py \
            --current seven_day_source_preflight \
            --previous-dir previous_source_captures \
            --output-dir seven_day_source_preflight/rolling_ledger
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('seven_day_source_preflight')
          ledger=json.loads((root/'rolling_ledger/rolling_pregame_ledger_report.json').read_text())
          coverage=json.loads((root/'eight_sport_schedule_coverage.json').read_text())
          assert ledger['observations_checked']>=coverage['totals']['pregame_events_archived']
          assert ledger['distinct_future_espn_game_ids']>=coverage['totals']['pregame_events_archived']
          assert ledger['qualified_training_games']==0
          assert ledger['certified_positive_ev_bets']==0
          assert ledger['champion_001_modified'] is False
          print('Rolling source run count:', ledger['capture_runs_checked'])
          print('Unique future ESPN IDs, NOT training games:', ledger['distinct_future_espn_game_ids'])
          PY
      - name: Run #79 same-run exact provider market diagnostics with zero direct-bookmaker certification
        shell: bash
        run: |
          set -euo pipefail
          python challenger_exact_market_research_gate.py \
            --snapshots seven_day_source_preflight/prospective_event_evidence.jsonl \
            --identity-rows seven_day_source_preflight/independent_identity/independent_game_identity.jsonl \
            --identity-report seven_day_source_preflight/independent_identity/independent_game_identity_report.json \
            --output-dir seven_day_source_preflight/model_completion
      - name: Execute #80-82 blocked native-training, OOS, Champion and final deployment gates
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -r requirements-calibration.txt
          root=seven_day_source_preflight/model_completion
          mkdir -p "$root"
          # No qualifying native forecasts, source-attested features, bets or
          # settlement rows have been generated by the source preflight.
          # An empty evidence input means missing evidence, not a zero-loss model.
          : > "$root/qualified_oos_evidence.jsonl"
          python challenger_oos_calibration.py \
            --evidence "$root/qualified_oos_evidence.jsonl" \
            --output "$root/independent_oos_scorecard.json"
          python challenger_multisport_native_training.py \
            --evidence "$root/absent_reviewed_pregame_games.jsonl" \
            --output-dir "$root/native_training" \
            --allow-missing-evidence
          python champion_001_authentication.py \
            --output "$root/champion_authentication.json"
          python challenger_model_completion_gate.py \
            --schedule-report seven_day_source_preflight/eight_sport_schedule_coverage.json \
            --independent-report seven_day_source_preflight/independent_identity/independent_game_identity_report.json \
            --market-report "$root/exact_market_research_report.json" \
            --output "$root/release_readiness.json"
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('seven_day_source_preflight/model_completion')
          r=json.loads((root/'release_readiness.json').read_text())
          t=json.loads((root/'native_training/research_training_report.json').read_text())
          o=json.loads((root/'independent_oos_scorecard.json').read_text())
          c=json.loads((root/'champion_authentication.json').read_text())
          assert r['model_update_status']=='BLOCKED_MISSING_INDEPENDENT_EXTERNAL_EVIDENCE'
          assert r['champion_001_modified'] is False
          assert r['certified_positive_ev_bets']==0
          assert r['independently_verified_bookmaker_prices']==0
          assert t['trained_research_models']==[] and t['review_attested_records_received']==0
          assert o['rows_received']==0 and o['certified_groups']==0
          assert c['original_executable_verified'] is False
          print('All research stages completed; independent model release BLOCKED.')
          print('Actual future games archived:', r['archived_pregame_games'])
          print('Reason: no verified native training, calibration or direct bookmaker evidence.')
          PY
      - name: "#85-86 synthesize verified priority queue and final research-only stop/ship"
        shell: bash
        run: |
          set -euo pipefail
          root=seven_day_source_preflight
          python challenger_operational_priority_queue.py \
            --release-report "$root/model_completion/release_readiness.json" \
            --identity-report "$root/independent_identity/independent_game_identity_report.json" \
            --nfl-report "$root/nfl_third_party/nfl_third_party_identity_report.json" \
            --rolling-report "$root/rolling_ledger/rolling_pregame_ledger_report.json" \
            --output "$root/model_completion/operational_priority_queue.json"
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('seven_day_source_preflight/model_completion')
          r=json.loads((root/'operational_priority_queue.json').read_text())
          assert r['model_release']=='BLOCKED_NOT_CERTIFIED'
          assert r['certified_positive_ev_bets']==0
          assert r['verified_direct_draftkings_quotes']==0
          assert r['champion_001_modified'] is False
          print('Operational #83-86 chain finished. Research captures complete; release held.')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eight-sport-source-preflight-${{ github.run_id }}
          path: seven_day_source_preflight/
          retention-days: 45
          if-no-files-found: warn

name: Challenger-001 daily isotonic research calibration
on:
  workflow_dispatch:
  schedule:
    - cron: '17 11 * * *'
  workflow_run:
    workflows: ["Challenger-001 prospective outcome linkage validation (research only)"]
    types: [completed]
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'challenger_isotonic_recalibration.py'
      - 'challenger_calibration_evidence_bridge.py'
      - 'challenger_multisport_calibration_review.py'
      - 'tests/test_challenger_multisport_calibration_review.py'
      - 'challenger_multisport_native_capture.py'
      - 'tests/test_challenger_multisport_native_capture.py'
      - 'tests/test_challenger_isotonic_recalibration.py'
      - 'tests/test_challenger_calibration_evidence_bridge.py'
      - 'requirements-calibration.txt'
      - 'CHALLENGER_ISOTONIC_RECALIBRATION.md'
      - '.github/workflows/challenger-isotonic-calibration.yml'
  pull_request:
    paths:
      - 'challenger_multisport_calibration_review.py'
      - 'tests/test_challenger_multisport_calibration_review.py'
      - 'challenger_multisport_native_capture.py'
      - 'tests/test_challenger_multisport_native_capture.py'
      - 'challenger_isotonic_recalibration.py'
      - 'tests/test_challenger_isotonic_recalibration.py'
      - 'tests/test_challenger_calibration_evidence_bridge.py'
      - 'requirements-calibration.txt'
      - 'CHALLENGER_ISOTONIC_RECALIBRATION.md'
      - '.github/workflows/challenger-isotonic-calibration.yml'
permissions:
  contents: read
  actions: read
jobs:
  challenger-isotonic-research:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install research-only isotonic dependency
        run: python -m pip install -r requirements-calibration.txt
      - name: Run offline synthetic safety and chronological tests
        run: python -m unittest discover -s tests -p 'test_challenger_isotonic_recalibration.py' -v
      - name: Recover recent available pregame/outcome artifacts (no sportsbook API)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p calibration_sources/pregame calibration_sources/outcomes
          for kind in pregame outcomes; do
            if [[ "$kind" == pregame ]]; then
              workflow=challenger-prospective-pregame.yml
              prefix=challenger-prospective-evidence
            else
              workflow=challenger-prospective-outcome-validation.yml
              prefix=challenger-prospective-outcome-validation
            fi
            found=false
            # A successful workflow may contain only code checks, not an
            # actual pregame-source capture. Find the named unexpired artifact,
            # rather than assuming the ten newest 'success' runs contain it.
            while IFS= read -r run_id; do
              [[ "$run_id" =~ ^[0-9]+$ ]] || continue
              artifact="$prefix-$run_id"
              names="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/artifacts" \
                --jq '.artifacts[] | select(.expired == false) | .name' 2>/dev/null || true)"
              if ! grep -Fqx "$artifact" <<< "$names"; then
                continue
              fi
              if gh run download "$run_id" --repo "$GITHUB_REPOSITORY" \
                --name "$artifact" --dir "calibration_sources/$kind/$run_id"; then
                echo "Recovered actual $kind source archive from run $run_id (research only)"
                found=true
                break
              fi
            done < <(gh run list --repo "$GITHUB_REPOSITORY" \
              --workflow "$workflow" --branch main --status success \
              --limit 75 --json databaseId --jq '.[].databaseId' || true)
            if [[ "$found" == false ]]; then
              echo "No accessible $kind evidence archive in the 75 latest successful runs; calibration remains blocked."
            fi
          done
      - name: Crosslink native Challenger receipts to published finals WITHOUT promotion
        run: |
          python challenger_calibration_evidence_bridge.py \
            --archive-root calibration_sources \
            --output-dir challenger_results/calibration_evidence
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('challenger_results/calibration_evidence')
          r = json.loads((root/'report.json').read_text())
          assert r['champion_001_modified'] is False
          assert r['independently_qualified_calibration_rows'] == 0
          assert r['review_flags_automatically_promoted'] is False
          assert r['calibration_evidence_file_created'] is False
          assert r['bet_ready_selections'] == r['automated_wagers_placed'] == 0
          assert r['certified_champion_001_predictions'] == 0
          assert r['certified_challenger_001_predictions'] == 0
          assert not (root/'challenger_oos_probabilities.jsonl').exists()
          for line in (root/'review_queue.jsonl').read_text().splitlines():
            row=json.loads(line)
            assert row['eligible_for_calibration'] is False
            assert row['independent_outcome_verified'] is False
            assert row['model_output_before_event_verified'] is False
            assert row['bet_ready'] is False
          print('Evidence link status:',r['status'],
                'unqualified pairs:',r['unqualified_native_forecast_outcome_pairs_staged'])
          PY
      - name: Audit all-sport native model receipts against published outcomes (no calibration promotion)
        run: |
          python challenger_multisport_calibration_review.py \
            --archive-root calibration_sources \
            --output-dir challenger_results/calibration_evidence
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('challenger_results/calibration_evidence')
          r=json.loads((root/'multisport_review_report.json').read_text())
          assert len(r['all_leagues']) == 8
          assert r['independently_verified_calibration_examples'] == 0
          assert r['soccer_90_minute_outcomes_adjudicated'] == 0
          assert r['training_dataset_emitted'] is False
          assert r['certified_champion_001_predictions'] == 0
          assert r['certified_challenger_001_predictions'] == 0
          assert r['certified_positive_ev_bets'] == r['bet_ready_selections'] == r['automated_bets_placed'] == 0
          assert r['champion_001_modified'] is False
          for line in (root/'multisport_review_queue.jsonl').read_text().splitlines():
            item=json.loads(line)
            assert item['calibration_label'] is None
            assert item['qualified_for_calibration'] is False
            assert item['independent_outcome_verified'] is False
            assert item['bet_ready'] is False
          print('All-sports evidence links staged (unqualified):', r['unqualified_matched_games'])
          PY
      - name: Run daily research-only calibration or report missing evidence
        run: |
          python challenger_isotonic_recalibration.py \
            --evidence challenger_oos_probabilities.jsonl \
            --output-dir challenger_results/isotonic_recalibration \
            --allow-missing-evidence
      - name: Verify Champion remains frozen and no bets are certified
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          output = Path('challenger_results/isotonic_recalibration')
          r = json.loads((output/'report.json').read_text())
          assert r['champion_001_modified'] is False
          assert r['certified_champion_001_predictions'] == 0
          assert r['certified_challenger_001_predictions'] == 0
          assert r['certified_positive_ev_bets'] == 0
          assert r['automated_wagers_placed'] == 0
          assert r['independent_external_source_authentication_performed'] is False
          if not Path('challenger_oos_probabilities.jsonl').exists():
              assert r['status'] == 'blocked_missing_prediction_evidence_file'
              assert r['research_artifacts_written'] == 0
              assert sorted(p.name for p in output.iterdir()) == ['report.json']
          print('Research-only calibration:', r['status'],
                'artifacts:', r['research_artifacts_written'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: challenger-isotonic-research-${{ github.run_id }}
          path: |
            challenger_results/isotonic_recalibration/
            challenger_results/calibration_evidence/
          retention-days: 30
          if-no-files-found: error

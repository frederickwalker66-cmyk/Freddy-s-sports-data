name: NBA live connection — one-shot research and verification
on:
  workflow_dispatch:
  # One-time merge-driven live run. Future code edits without the explicit
  # commit-title marker DO NOT call the paid provider.
  push:
    branches: [main]
    paths:
      - '.github/workflows/nba-live-connection.yml'
  pull_request:
    paths:
      - '.github/workflows/nba-live-connection.yml'
permissions:
  contents: read
concurrency:
  group: sharpapi-odds-api
  cancel-in-progress: false
jobs:
  verify-offline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install offline calibration-test dependency
        run: python -m pip install -r requirements-calibration.txt
      - name: Run complete offline integrity suite before any paid call
        run: python -m unittest discover -s tests -v
  live-nba:
    needs: [verify-offline]
    # A new push must deliberately start with LIVE NBA CONNECTION; ordinary
    # edits to this workflow must never unexpectedly incur SharpAPI usage.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && startsWith(github.event.head_commit.message, 'LIVE NBA CONNECTION'))
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      SHARPAPI_KEY: ${{ secrets.SHARPAPI_KEY || secrets.SHARPAPIKEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify configured provider key without exposing it
        shell: bash
        run: |
          test -n "$SHARPAPI_KEY" || { echo 'NBA source error: SHARPAPI_KEY not configured; no provider call made.' >&2; exit 2; }
      - name: Collect actual NBA-only pregame odds through SharpAPI
        run: python collector.py --leagues nba --max-pages 4 --output-dir live_nba_odds
      - name: Verify exact NBA game identities and quarantine uncertain observations
        shell: bash
        run: |
          set -euo pipefail
          snapshot="$(find live_nba_odds -maxdepth 1 -name 'sharpapi_dk_*.jsonl' | sort | tail -n 1)"
          test -n "$snapshot"
          python challenger_schedule_crosswalk.py --odds "$snapshot" --outdir live_nba_validation
          python challenger_audit.py --input "$snapshot" --schedule live_nba_validation/schedule_manifest.json --output-dir live_nba_validation
          python challenger_gate_diagnostics.py --raw "$snapshot" --audit-dir live_nba_validation --output live_nba_validation/quality_diagnostics.json
      - name: Report actual NBA connection status and no-bet gate
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, os
          dest = Path("live_nba_validation")
          dest.mkdir(exist_ok=True)
          source = sorted(Path("live_nba_odds").glob("*.summary.json")) if Path("live_nba_odds").exists() else []
          odds = json.loads(source[-1].read_text()) if source else None
          manifest_file = dest / "schedule_manifest.json"
          audit_file = dest / "report.json"
          m = json.loads(manifest_file.read_text()) if manifest_file.exists() else None
          a = json.loads(audit_file.read_text()) if audit_file.exists() else None
          report = {
              "stage": "NBA_live_provider_connection_research_only",
              "run_id": os.environ.get("GITHUB_RUN_ID"),
              "actual_provider_capture_success": odds is not None,
              "live_nba_only_provider_quotes": odds.get("pregame_odds_quotes") if odds else None,
              "provider_request_count": odds.get("api_calls") if odds else None,
              "nba_event_ids_seen": m.get("provider_event_ids_seen") if m else None,
              "nba_event_ids_matched_to_public_schedule": m.get("provider_event_ids_matched") if m else None,
              "quotes_quarantined": a.get("quarantined") if a else None,
              "verified_draftkings_checkout_prices": 0,
              "certified_champion_001_predictions": 0,
              "certified_challenger_001_predictions": 0,
              "certified_positive_ev_bets": 0,
              "automated_bets_placed": 0,
              "champion_001_modified": False,
              "important": "SharpAPI-labeled NBA market prices are not independently verified DraftKings checkout prices; ESPN crosswalk corroboration alone is research-only.",
          }
          (dest / "nba_live_connection_diagnostic.json").write_text(json.dumps(report, indent=2, sort_keys=True)+"\n")
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a") as out:
              out.write("## Freddy's Picks AI — Actual NBA Live Connection\n")
              for key, value in report.items():
                  out.write(f"- **{key}:** {value}\n")
          print(json.dumps(report, sort_keys=True))
          assert report["champion_001_modified"] is False
          assert report["automated_bets_placed"] == 0
      - name: Preserve timestamped raw NBA odds and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nba-live-connection-${{ github.run_id }}
          path: |
            live_nba_odds/
            live_nba_validation/
          retention-days: 30
          if-no-files-found: warn

name: Challenger-001 prospective outcome linkage validation (research only)
on:
  workflow_dispatch:
  schedule:
    # Twice daily after US late games and the following morning; GitHub may delay.
    - cron: '15 4,15 * * *'
  push:
    branches: [main]
    paths:
      - 'challenger_prospective_outcome_validation.py'
      - 'challenger_prospective_receipts.py'
      - 'challenger_multisport_evidence_bridge.py'
      - 'challenger_multisport_original_bytes_lineage.py'
      - 'tests/test_challenger_multisport_original_bytes_lineage.py'
      - 'challenger_nhl_official_score_crosscheck.py'
      - 'tests/test_challenger_nhl_official_score_crosscheck.py'
      - 'challenger_nfl_secondary_score.py'
      - 'tests/test_challenger_nfl_secondary_score.py'
      - 'challenger_college_ncaa_score_review.py'
      - 'tests/test_challenger_college_ncaa_score_review.py'
      - 'challenger_soccer_regulation_review.py'
      - 'tests/test_challenger_soccer_regulation_review.py'
      - 'challenger_nba_history_intake.py'
      - 'challenger_nba_official_final_crosscheck.py'
      - 'challenger_nba_player_two_source_review.py'
      - 'tests/test_challenger_nba_player_two_source_review.py'
      - 'challenger_nba_history_qualification.py'
      - 'challenger_research_shadow_scorecard.py'
      - 'tests/test_challenger_research_shadow_scorecard.py'
      - 'tests/test_challenger_prospective_outcome_validation.py'
      - 'tests/test_challenger_prospective_receipts.py'
      - 'tests/test_challenger_multisport_evidence_bridge.py'
      - 'tests/test_challenger_nba_history_intake.py'
      - 'tests/test_challenger_nba_official_final_crosscheck.py'
      - 'tests/test_six_stage_validation.py'
      - '.github/workflows/challenger-prospective-outcome-validation.yml'
  pull_request:
    paths:
      - 'challenger_prospective_outcome_validation.py'
      - 'challenger_prospective_receipts.py'
      - 'challenger_multisport_evidence_bridge.py'
      - 'challenger_multisport_original_bytes_lineage.py'
      - 'tests/test_challenger_multisport_original_bytes_lineage.py'
      - 'challenger_nhl_official_score_crosscheck.py'
      - 'tests/test_challenger_nhl_official_score_crosscheck.py'
      - 'challenger_nfl_secondary_score.py'
      - 'tests/test_challenger_nfl_secondary_score.py'
      - 'challenger_college_ncaa_score_review.py'
      - 'tests/test_challenger_college_ncaa_score_review.py'
      - 'challenger_soccer_regulation_review.py'
      - 'tests/test_challenger_soccer_regulation_review.py'
      - 'challenger_nba_history_intake.py'
      - 'challenger_nba_official_final_crosscheck.py'
      - 'challenger_nba_player_two_source_review.py'
      - 'tests/test_challenger_nba_player_two_source_review.py'
      - 'tests/test_challenger_prospective_outcome_validation.py'
      - 'tests/test_challenger_prospective_receipts.py'
      - 'tests/test_challenger_multisport_evidence_bridge.py'
      - 'tests/test_challenger_nba_history_intake.py'
      - 'tests/test_challenger_nba_official_final_crosscheck.py'
      - '.github/workflows/challenger-prospective-outcome-validation.yml'
permissions:
  contents: read
  actions: read
jobs:
  safety-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependency for native probability training tests
        run: python -m pip install -r requirements-calibration.txt
      - name: Test all source-integrity, prospective timing and betting safeguards
        run: python -m unittest discover -s tests -v
  link-archived-pregame-to-published-outcomes:
    if: github.event_name != 'pull_request'
    needs: safety-tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read existing prospective artifacts without any odds API requests
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p snapshots
          mapfile -t ids < <(gh run list --repo "$GITHUB_REPOSITORY" \
            --workflow challenger-prospective-pregame.yml --branch main \
            --status success --limit 90 --json databaseId --jq '.[].databaseId')
          valid=()
          missing=0
          without_forecasts=0
          for rid in "${ids[@]}"; do
            if gh run download "$rid" --repo "$GITHUB_REPOSITORY" \
                 --name "challenger-prospective-evidence-$rid" \
                 --dir "snapshots/$rid"; then
              if [[ -f "snapshots/$rid/prospective_event_evidence.jsonl" && \
                    -f "snapshots/$rid/historical_published_results.jsonl" ]]; then
                valid+=("$rid")
                if [[ ! -f "snapshots/$rid/research_shadow_forecasts.jsonl" ]]; then
                  ((without_forecasts+=1))
                fi
              else
                ((missing+=1))
              fi
            else
              ((missing+=1))
            fi
          done
          if (( ${#valid[@]} == 0 )); then
            echo 'No complete prospective archives yet. No results will be invented.'
            exit 1
          fi
          echo "latest=${valid[0]}" >> "$GITHUB_ENV"
          echo "Archives downloaded: ${#valid[@]}; unavailable/incomplete: $missing; older archives without research forecasts: $without_forecasts"
          {
            echo "### Challenger rolling research evidence coverage"
            echo "Recent successful runs examined: ${#ids[@]} (maximum 90)"
            echo "Downloaded valid pregame archives: ${#valid[@]}"
            echo "Unavailable/incomplete archives: $missing"
            echo "Archives without baseline forecasts: $without_forecasts"
            echo "Not an independently certified dataset; no betting permission."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Inspect prospective capture archive receipts (missing/invalid stays research only)
        run: |
          set -euo pipefail
          python challenger_prospective_receipts.py --mode inspect \
            --snapshot-root snapshots \
            --output prospective_validation/point_in_time_receipt_audit.json
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("prospective_validation/point_in_time_receipt_audit.json").read_text())
          assert r["independently_verified_training_examples"] == 0
          assert r["trained_models_created"] == 0
          assert r["certified_champion_001_predictions"] == r["certified_challenger_001_predictions"] == 0
          assert r["bet_ready_selections"] == r["automated_bets_placed"] == 0
          assert r["champion_001_modified"] is False
          PY
      - name: Collect recent public ESPN finals without paid sportsbook API calls
        shell: bash
        run: |
          set -euo pipefail
          today_et="$(TZ=America/New_York date +%F)"
          python historical_outcomes.py \
            --leagues NBA,NFL,MLB,NHL,NCAAF,NCAAB,MLS,UEFA_CHAMPIONS_LEAGUE \
            --days 3 --end-date "$today_et" --output-dir published_recent
          python - <<'PY'
          import json
          from pathlib import Path
          coverage=json.loads(Path('published_recent/coverage.json').read_text())
          requested=sum(x['days_attempted'] for x in coverage['by_league'].values())
          success=sum(x['days_ok'] for x in coverage['by_league'].values())
          assert requested == 24, requested
          if success == 0:
              raise SystemExit('No ESPN source days succeeded; cannot update final results')
          print(f"Fresh ESPN source days: {success}/{requested}; failures are reported, never guessed")
          PY
      - name: Link archived pregame evidence to fresh and archived published results
        run: |
          python challenger_prospective_outcome_validation.py \
            --snapshot-root snapshots \
            --outcomes-root snapshots \
            --outcomes published_recent/results.jsonl \
            --output-dir prospective_validation
      - name: Build eight-sport point-in-time evidence review queue (NOT training data)
        run: |
          set -euo pipefail
          python challenger_multisport_evidence_bridge.py \
            --snapshot-root snapshots \
            --linked-results prospective_validation/linked_pregame_outcomes.jsonl \
            --output-dir prospective_validation
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path("prospective_validation")
          r=json.loads((root/"all_sports_evidence_report.json").read_text())
          assert len(r["supported_leagues"]) == 8
          assert r["independently_verified_training_records"] == 0
          assert r["trained_models_created"] == 0
          assert r["certified_champion_001_predictions"] == 0
          assert r["certified_challenger_001_predictions"] == 0
          assert r["bet_ready_selections"] == r["automated_bets_placed"] == 0
          assert r["champion_001_modified"] is False
          assert not (root/"historical_results.jsonl").exists()
          for line in (root/"all_sports_evidence_review_queue.jsonl").read_text().splitlines():
              item=json.loads(line)
              assert item["qualified_for_challenger_backtest"] is False
              assert item["eligible_to_train_probability_model"] is False
              assert item["model_probability"] is None
              assert item["bet_ready"] is False
          PY
      - name: Reconcile original archived bytes with all-eight-sport review packets (no training)
        run: |
          set -euo pipefail
          python challenger_multisport_original_bytes_lineage.py \
            --snapshot-root snapshots \
            --linked-results prospective_validation/linked_pregame_outcomes.jsonl \
            --output-dir prospective_validation
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('prospective_validation')
          r=json.loads((root/'original_bytes_lineage_report.json').read_text())
          assert len(r['all_leagues']) == 8
          assert r['independently_qualified_training_examples'] == 0
          assert r['independently_authenticated_original_captures'] == 0
          assert r['certified_champion_001_predictions'] == 0
          assert r['certified_challenger_001_predictions'] == 0
          assert r['certified_positive_ev_bets'] == 0
          assert r['bet_ready_selections'] == r['automated_bets_placed'] == 0
          assert r['model_artifacts_emitted'] == r['player_prop_models_emitted'] == 0
          assert r['champion_001_modified'] is False
          for line in (root/'original_bytes_lineage_review.jsonl').read_text().splitlines():
              x=json.loads(line)
              assert x['original_bytes_match_same_run_receipt'] is True
              assert x['same_run_receipt_independently_authenticated'] is False
              assert x['qualified_for_challenger_training'] is False
              assert x['model_probability'] is None
              assert x['bet_ready'] is False and x['champion_001_modified'] is False
          assert not (root/'challenger_reviewed_pregame_games.jsonl').exists()
          print('Original-byte audit review packets:',r['review_packets'])
          PY
      - name: Compare NHL archived results to league-operated official scores (max 3 days; research only)
        run: |
          set -euo pipefail
          python challenger_nhl_official_score_crosscheck.py \
            --lineage prospective_validation/original_bytes_lineage_review.jsonl \
            --output-dir prospective_validation \
            --max-days 3
          python - <<'PY'
          import json
          import hashlib
          from pathlib import Path
          root=Path('prospective_validation')
          report=json.loads((root/'nhl_official_score_crosscheck_report.json').read_text())
          assert report['source_dates_requested_maximum'] <= 3
          assert report['independently_verified_training_games'] == 0
          assert report['independently_verified_prop_settlements'] == 0
          assert report['certified_champion_001_predictions'] == 0
          assert report['certified_challenger_001_predictions'] == 0
          assert report['certified_positive_ev_bets'] == 0
          assert report['bet_ready_selections'] == report['automated_bets_placed'] == 0
          assert report['champion_001_modified'] is False
          for line in (root/'nhl_official_score_crosscheck.jsonl').read_text().splitlines():
            row=json.loads(line)
            assert row['qualified_for_challenger_training'] is False
            assert row['independent_feature_asof_verified'] is False
            assert row['official_bookmaker_settlement_verified'] is False
            assert row['bet_ready'] is False
          for day in report['source_dates_successfully_parsed']:
            source=(root/'nhl_original_source_responses'/(day+'.json')).read_bytes()
            digest=hashlib.sha256(source).hexdigest()
            for line in (root/'nhl_official_score_crosscheck.jsonl').read_text().splitlines():
              row=json.loads(line)
              if row['nhl_official_scoreboard_url'] and row['nhl_official_scoreboard_url'].endswith(day):
                assert row['nhl_original_source_sha256'] == digest
          print('NHL second-source agreements (research only):',
                report['published_final_score_agreements'])
          PY
      - name: Cross-check NFL published finals against independent nflverse schedules (research only)
        run: |
          set -euo pipefail
          python challenger_nfl_secondary_score.py \
            --lineage prospective_validation/original_bytes_lineage_review.jsonl \
            --output-dir prospective_validation
          python - <<'PY'
          import json, hashlib
          from pathlib import Path
          root=Path("prospective_validation")
          report=json.loads((root/"nfl_second_source_score_report.json").read_text())
          for k in ("independently_qualified_training_games", "independently_verified_prop_settlements",
                    "certified_champion_001_predictions", "certified_challenger_001_predictions",
                    "certified_positive_ev_bets", "bet_ready_selections", "automated_bets_placed"):
            assert report[k] == 0,(k,report[k])
          assert report["champion_001_modified"] is False
          for line in (root/"nfl_second_source_score_review.jsonl").read_text().splitlines():
            row=json.loads(line)
            assert row["qualified_for_challenger_training"] is False
            assert row["bookmaker_market_settlement_verified"] is False
            assert row["independently_authenticated_original_capture"] is False
            assert row["bet_ready"] is False
          p=root/"nflverse_original_games.csv"
          if p.is_file():
            assert report["nflverse_source_valid"] is True
            digest=hashlib.sha256(p.read_bytes()).hexdigest()
            for line in (root/"nfl_second_source_score_review.jsonl").read_text().splitlines():
              row=json.loads(line)
              assert row["nflverse_source_sha256"] == digest
          print("NFL independent published-score agreements (uncertified):",
                report["second_source_final_score_agreements"])
          PY
      - name: Compare NCAAF and NCAAB to NCAA.com-derived published scoreboards (uncertified)
        run: |
          set -euo pipefail
          python challenger_college_ncaa_score_review.py \
            --lineage prospective_validation/original_bytes_lineage_review.jsonl \
            --output-dir prospective_validation \
            --max-days 3
          python - <<'PY'
          import json,hashlib,re
          from pathlib import Path
          root=Path("prospective_validation")
          r=json.loads((root/"college_ncaa_score_report.json").read_text())
          assert set(r["by_league"]) == {"ncaaf","ncaab"}
          assert len(r["requested_routes"]) <= 4
          for key in ("independently_qualified_training_games",
                      "verified_player_prop_settlements",
                      "certified_champion_001_predictions",
                      "certified_challenger_001_predictions",
                      "certified_positive_ev_bets",
                      "bet_ready_selections","automated_bets_placed"):
              assert r[key] == 0,(key,r[key])
          assert r["champion_001_modified"] is False
          for line in (root/"college_ncaa_score_review.jsonl").read_text().splitlines():
              x=json.loads(line)
              assert x["qualified_for_challenger_training"] is False
              assert x["source_original_pregame_publication_verified"] is False
              assert x["official_market_settlement_verified"] is False
              assert x["original_pregame_capture_independently_authenticated"] is False
              assert x["bet_ready"] is False and x["champion_001_modified"] is False
          for key,digest in r["source_sha256"].items():
              label=re.sub(r"[^a-zA-Z0-9_-]+","_",key)
              path=root/"college_ncaa_proxy_original_bytes"/(label+".json")
              assert hashlib.sha256(path.read_bytes()).hexdigest()==digest
          print("NCAA.com-derived second-source score comparisons (research only):",
                r["ncaa_derived_score_agreements"])
          PY
      - name: Review MLS and UEFA 90-minute results from separate publisher (optional key, research only)
        env:
          API_NINJAS_KEY: ${{ secrets.API_NINJAS_KEY }}
        run: |
          set -euo pipefail
          python challenger_soccer_regulation_review.py \
            --lineage prospective_validation/original_bytes_lineage_review.jsonl \
            --output-dir prospective_validation --max-days 3
          python - <<'PY'
          import hashlib,json,re
          from pathlib import Path
          root=Path('prospective_validation')
          report=json.loads((root/'soccer_90min_second_source_report.json').read_text())
          assert set(report['by_league']) == {'mls','uefa_champions_league'}
          assert len(report['requested_routes']) <= 6
          assert report['source_requests_attempted'] <= 6
          for key in ('independently_authenticated_training_games',
                      'certified_champion_001_predictions',
                      'certified_challenger_001_predictions',
                      'certified_positive_ev_bets','bet_ready_selections',
                      'automated_bets_placed'):
              assert report[key] == 0,(key,report[key])
          assert report['champion_001_modified'] is False
          for line in (root/'soccer_90min_second_source_review.jsonl').read_text().splitlines():
              row=json.loads(line)
              assert row['qualified_for_challenger_training'] is False
              assert row['independent_league_official_regulation_result_authenticated'] is False
              assert row['original_pregame_feature_publication_independently_verified'] is False
              assert row['bookmaker_three_way_settlement_verified'] is False
              assert row['model_probability'] is None
              assert row['bet_ready'] is False and row['champion_001_modified'] is False
          for key,digest in report['source_raw_sha256'].items():
              filename=re.sub('[^a-zA-Z0-9_-]+','_',key)+'.json'
              raw=(root/'soccer_second_source_original_bytes'/filename).read_bytes()
              assert hashlib.sha256(raw).hexdigest() == digest
          print('Soccer published 90-min score agreements, NOT betting labels:',
                report['regulation_score_published_agreements'])
          PY
      - name: Stage NBA historical review candidates WITHOUT qualifying or training
        run: |
          set -euo pipefail
          python challenger_nba_history_intake.py \
            --review-queue prospective_validation/all_sports_evidence_review_queue.jsonl \
            --output-dir prospective_validation
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('prospective_validation')
          report = json.loads((root/'nba_history_intake_report.json').read_text())
          assert report['independently_verified_training_records'] == 0
          assert report['qualified_for_challenger_backtest'] == 0
          assert report['trained_models_created'] == 0
          assert report['certified_champion_001_predictions'] == report['certified_challenger_001_predictions'] == 0
          assert report['bet_ready_selections'] == report['automated_bets_placed'] == 0
          assert report['champion_001_modified'] is False
          assert not (root/'historical_results.jsonl').exists()
          for line in (root/'nba_history_review_candidates.jsonl').read_text().splitlines():
              if not line.strip(): continue
              row=json.loads(line)
              assert row['qualified_for_challenger_backtest'] is False
              assert row['eligible_to_train_probability_model'] is False
              assert row['independent_asof_review'] is False
              assert row['independent_outcome_review'] is False
              assert row['model_probability'] is None
              assert row['bet_ready'] is False
          PY
      - name: Cross-check NBA published finals with league-owned scores (research only)
        run: |
          set -euo pipefail
          python challenger_nba_official_final_crosscheck.py \
            --candidates prospective_validation/nba_history_review_candidates.jsonl \
            --output-dir prospective_validation
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('prospective_validation')
          r=json.loads((root/'nba_official_final_crosscheck_report.json').read_text())
          assert r['independently_qualified_training_records'] == 0
          assert r['independently_authenticated_feature_snapshots'] == 0
          assert r['trained_models_created'] == 0
          assert r['bet_ready_selections'] == r['automated_bets_placed'] == 0
          assert r['certified_champion_001_predictions'] == r['certified_challenger_001_predictions'] == 0
          assert r['champion_001_modified'] is False
          assert not (root/'historical_results.jsonl').exists()
          for line in (root/'nba_official_final_crosscheck.jsonl').read_text().splitlines():
              if not line.strip(): continue
              item=json.loads(line)
              assert item['training_row_qualified'] is False
              assert item['independent_feature_asof_verified'] is False
              assert item['certified_prediction'] is False
              assert item['bet_ready'] is False
          PY
      - name: Cross-check postgame NBA player boxscores against league-operated records (no props certified)
        run: |
          set -euo pipefail
          python challenger_nba_player_two_source_review.py \
            --official-crosschecks prospective_validation/nba_official_final_crosscheck.jsonl \
            --output-dir prospective_validation \
            --max-games 3
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          root=Path("prospective_validation")
          r=json.loads((root/"nba_player_two_source_report.json").read_text())
          assert r["games_checked"] <= 3
          for k in ("independently_verified_pregame_player_availability",
                    "qualified_prop_training_observations",
                    "trained_player_prop_probability_models",
                    "certified_champion_001_predictions",
                    "certified_challenger_001_predictions",
                    "positive_ev_player_props","bet_ready_selections",
                    "automated_bets_placed"):
            assert r[k] == 0,(k,r[k])
          assert r["champion_001_modified"] is False
          for line in (root/"nba_player_two_source_review.jsonl").read_text().splitlines():
            row=json.loads(line)
            assert row["source_observation_is_postgame"] is True
            assert row["independent_pregame_player_availability_verified"] is False
            assert row["independent_pregame_minutes_projection_verified"] is False
            assert row["historical_bookmaker_prop_settlement_verified"] is False
            assert row["qualified_for_player_prop_training"] is False
            assert row["model_player_prop_probability"] is None
            assert row["bet_ready"] is False and row["champion_001_modified"] is False
          for event, two in r["original_byte_hashes"].items():
            assert event.isdigit()
            for publisher,digest in two.items():
              assert publisher in ("espn","nba")
              p=root/"nba_player_original_source_bytes"/(event+"_"+publisher+".json")
              assert hashlib.sha256(p.read_bytes()).hexdigest() == digest
          print("NBA two-publisher player stats (uncertified):",r["player_statuses"])
          PY
      - name: Stage 3 independent NBA historical qualification review (zero auto promotion)
        run: |
          set -euo pipefail
          python challenger_nba_history_qualification.py \
            --candidates prospective_validation/nba_history_review_candidates.jsonl \
            --comparisons prospective_validation/nba_official_final_crosscheck.jsonl \
            --output-dir prospective_validation
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("prospective_validation/nba_history_qualification_report.json").read_text())
          assert r["qualified_training_games"]==r["qualified_holdout_games"]==0
          assert r["model_training_authorized"] is False
          assert r["champion_001_modified"] is False
          PY
      - name: Score only existing fixed-rule $0 research forecasts against published finals
        run: |
          python challenger_research_shadow_scorecard.py \
            --forecast-root snapshots \
            --linked-results prospective_validation/linked_pregame_outcomes.jsonl \
            --output-dir prospective_validation
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("prospective_validation/research_shadow_scorecard.json").read_text())
          assert r["certified_champion_001_predictions"] == 0
          assert r["certified_challenger_001_predictions"] == 0
          assert r["validated_positive_ev_bets"] == 0
          assert r["bet_ready_selections"] == r["automated_bets_placed"] == 0
          assert r["champion_001_modified"] is False
          PY
      - name: Check zero certified training and betting predictions
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path('prospective_validation/validation_readiness.json').read_text())
          for key in ('independently_adjudicated_outcomes', 'verified_historical_training_examples',
                      'certified_champion_001_predictions', 'certified_challenger_001_predictions',
                      'bet_ready_selections', 'automated_bets_placed'):
              assert report[key] == 0, (key, report[key])
          assert report['model_accuracy_established'] is False
          assert report['champion_001_modified'] is False
          for line in Path('prospective_validation/linked_pregame_outcomes.jsonl').read_text().splitlines():
              row=json.loads(line)
              assert row['qualified_for_challenger_backtest'] is False
              assert row['model_prediction_at_capture'] is None
              assert row['bet_ready'] is False and row['champion_001_modified'] is False
          print('Validated outcome linkage, research only:', report['by_status'])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: challenger-prospective-outcome-validation-${{ github.run_id }}
          path: |
            prospective_validation/
            published_recent/coverage.json
          retention-days: 90
          if-no-files-found: warn

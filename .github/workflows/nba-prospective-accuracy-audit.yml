name: NBA Challenger Prospective Accuracy Audit

on:
  workflow_dispatch:
    inputs:
      forecast_run_id:
        description: 'Completed prospective ledger workflow run ID'
        required: true
        type: string
  workflow_run:
    workflows: ['NBA Challenger Prospective 20-Point Ledger']
    types: [completed]

permissions:
  contents: read
  actions: read

jobs:
  score-locked-forecasts:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      FORECAST_RUN_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.forecast_run_id || github.event.workflow_run.id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Retrieve locked prospective forecast artifact
        run: |
          mkdir -p locked_forecasts
          gh run download "$FORECAST_RUN_ID" --repo "$REPO" --name nba-prospective-challenger20 --dir locked_forecasts
          test -s locked_forecasts/prospective_challenger20.json
      - name: Collect published completed NBA outcomes
        run: python historical_outcomes.py --leagues NBA --days 35 --output-dir nba_outcomes
      - name: Score completed forecasts without modifying model
        run: |
          python research/nba_prospective_accuracy.py \
            --forecast locked_forecasts/prospective_challenger20.json \
            --results nba_outcomes/results.jsonl \
            --output nba_accuracy/prospective_accuracy.json
      - name: Enforce research-only gates
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('nba_accuracy/prospective_accuracy.json').read_text())
          assert r['certified'] is False and r['bet_ready'] is False
          assert r['champion_001_modified'] is False and r['take_count']==0
          print('Scored games:',r['scored_games'],'pending:',r['pending_outcomes'])
          print('Brier:',r['brier_score'],'log loss:',r['log_loss'],'accuracy:',r['pick_accuracy'])
          PY
      - name: Publish accuracy dashboard in workflow summary
        if: always()
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          path=Path('nba_accuracy/prospective_accuracy.json')
          lines=['## NBA Challenger-001 — Prospective Accuracy Dashboard','']
          if not path.exists():
              lines += ['**Status:** Report unavailable — inspect preceding workflow steps.']
          else:
              r=json.loads(path.read_text())
              n=r['scored_games']
              def fmt(v, percent=False):
                  return 'Pending' if v is None else f'{v*100:.1f}%' if percent else f'{v:.6f}'
              lines += [
                  '| Metric | Result |','|---|---|',
                  f'| Completed games scored | {n} |',
                  f"| Games awaiting results | {r['pending_outcomes']} |",
                  f"| Rejected forecasts | {len(r['rejected_forecasts'])} |",
                  f"| Prediction accuracy | {fmt(r['pick_accuracy'],True)} |",
                  f"| Brier score (lower is better) | {fmt(r['brier_score'])} |",
                  f"| Log loss (lower is better) | {fmt(r['log_loss'])} |",
                  '| Certified TAKE | **0 — HOLD** |',
                  '',
                  '**Interpretation:** ' + ('No completed prospective games scored yet; no accuracy conclusion.' if n==0 else 'Preliminary research performance; not independent certification.'),
                  '',
                  'Champion-001 unchanged. No verified sportsbook expected value.'
              ]
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
              f.write('\\n'.join(lines)+'\\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: nba-prospective-accuracy-audit
          path: nba_accuracy/prospective_accuracy.json
          retention-days: 90

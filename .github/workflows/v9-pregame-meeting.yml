name: Freddy's Picks AI V9 — Six Staff Pregame Meeting (read-only)
on:
  workflow_dispatch:
  # Best effort: a meeting every hour, plus each successful source capture.
  # Existing ESPN collector runs at :27 and :53; do not add a second collector.
  schedule:
    - cron: '45 * * * *'
  workflow_run:
    workflows:
      - 'Challenger-001 original eight-sport schedule preflight (research only)'
    types: [completed]
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'v9_pregame_staff_meeting.py'
      - 'v9_sharp_edge_evidence_board.py'
      - 'tests/test_v9_pregame_staff_meeting.py'
      - 'tests/test_v9_sharp_edge_evidence_board.py'
      - '.github/workflows/v9-pregame-meeting.yml'
  pull_request:
    paths:
      - 'v9_pregame_staff_meeting.py'
      - 'v9_sharp_edge_evidence_board.py'
      - 'tests/test_v9_pregame_staff_meeting.py'
      - 'tests/test_v9_sharp_edge_evidence_board.py'
      - '.github/workflows/v9-pregame-meeting.yml'
permissions:
  contents: read
  actions: read
concurrency:
  group: v9-pregame-staff-main
  cancel-in-progress: false
jobs:
  offline-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test evidence board, six employees and fail-closed pregame meeting
        run: |
          python -m py_compile v9_sharp_edge_evidence_board.py v9_pregame_staff_meeting.py
          python -m unittest discover -s tests -p 'test_v9_*.py' -v
  meeting:
    # A pull request cannot trigger a live read. No new sports-provider calls.
    if: github.event_name != 'pull_request' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    needs: offline-safety
    runs-on: ubuntu-latest
    timeout-minutes: 18
    permissions:
      contents: read
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Index existing V8 Sharp Edge and all-sports schedule artifacts
        run: python v9_sharp_edge_evidence_board.py --output-dir v9_results
      - name: Assemble final six-staff research meeting and HOLD gates
        run: |
          python v9_pregame_staff_meeting.py \
            --board-json v9_results/V9_SHARP_EDGE_EVIDENCE_BOARD.json \
            --cache-root v9_results/_cached_source/schedule \
            --output-dir v9_results \
            --lookahead-minutes 90
      - name: Archive one evidence board and one pregame meeting
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v9-pregame-research-meeting-${{ github.run_id }}
          path: |
            v9_results/V9_SHARP_EDGE_EVIDENCE_BOARD.json
            v9_results/V9_SHARP_EDGE_EVIDENCE_BOARD.md
            v9_results/V9_PREGAME_MEETING.json
            v9_results/V9_PREGAME_MEETING.md
          retention-days: 14
          if-no-files-found: warn

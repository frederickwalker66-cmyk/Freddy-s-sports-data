name: Freddy's Picks AI — All Eight Sports Native Training
on:
  workflow_dispatch:
  schedule:
    - cron: '35 12,22 * * *'
permissions:
  contents: read
jobs:
  all-eight-sports-training:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-calibration.txt
      - name: Validate independent NBA and seven-league training engines
        run: |
          python -m unittest discover -s tests -p 'test_challenger_nba_probability.py' -v
          python -m unittest discover -s tests -p 'test_challenger_multisport_native_training.py' -v
      - name: Train NBA from reviewed historical evidence only
        run: |
          python challenger_nba_probability.py \
            --history prediction_input/qualified_nba_history.jsonl \
            --output-dir challenger_results/nba_probability
      - name: Train NFL MLB NHL NCAAF NCAAB MLS UCL from reviewed evidence only
        run: |
          python challenger_multisport_native_training.py \
            --evidence prediction_input/qualified_seven_league_history.jsonl \
            --output-dir challenger_results/native_model_training \
            --allow-missing-evidence
      - name: Summarize actual training readiness; never claim certified TAKE
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          nba=Path('challenger_results/nba_probability')
          other=Path('challenger_results/native_model_training')
          n=json.loads((nba/'report.json').read_text())
          m=json.loads((other/'research_training_report.json').read_text())
          assert m['champion_001_modified'] is False
          assert m['certified_positive_ev_bets'] == 0
          assert m['automated_bets_placed'] == 0
          assert all(x in m['by_league'] for x in ('nfl','mlb','nhl','ncaaf','ncaab','mls','uefa_champions_league'))
          if (nba/'research_model.json').exists():
              a=json.loads((nba/'research_model.json').read_text())
              assert a['champion_001_modified'] is False
              assert a['qualified_for_real_money_wagers'] is False
              assert a['holdout_excluded_from_coefficients'] is True
          for league in m['trained_research_models']:
              a=json.loads((other/(league+'.json')).read_text())
              assert a['champion_001_modified'] is False
              assert a['qualified_for_real_money_wagers'] is False
              assert a['holdout_excluded_from_coefficients'] is True
          lines=['## Eight-sport native training readiness','',
                 'NBA: '+str(n.get('result')),'Seven-league research artifacts: '+(', '.join(m['trained_research_models']) or 'none'),'',
                 '| League | Training status |','|---|---|']
          lines += ['| '+k.upper()+' | '+str(v.get('status'))+' |' for k,v in sorted(m['by_league'].items())]
          lines += ['','Independent source authentication not performed by this workflow.',
                    'Champion-001 unchanged; certified TAKE 0; no bets placed.']
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:f.write('\n'.join(lines)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: all-eight-sports-training-readiness
          path: |
            challenger_results/nba_probability/
            challenger_results/native_model_training/
          retention-days: 30

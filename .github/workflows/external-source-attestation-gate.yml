name: External historical evidence signature verification
on:
  pull_request:
    paths:
      - 'research/external_source_attestation_gate.py'
      - 'tests/test_external_source_attestation_gate.py'
      - '.github/workflows/external-source-attestation-gate.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-offline-attestation:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install cryptographic signature verification dependency
        run: python -m pip install 'cryptography>=43,<47'
      - name: Run external receipt verification regression tests
        run: python -m unittest discover -s tests -p 'test_external_source_attestation_gate.py' -v

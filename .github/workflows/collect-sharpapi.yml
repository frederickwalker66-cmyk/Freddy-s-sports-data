name: Collect SharpAPI DraftKings pregame odds
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/collect-sharpapi.yml'
      - 'challenger_schedule_crosswalk.py'
      - 'challenger_audit.py'
      - 'daily_research_audit.py'
      - 'tests/**'
  schedule:
    - cron: '0 16,20,23 * * *'  # UTC; times shift with Eastern daylight saving
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    env:
      SHARPAPI_KEY: ${{ secrets.SHARPAPI_KEY || secrets.SHARPAPIKEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Offline fixture tests
        run: python -m unittest discover -s tests -v
      - name: Confirm secret exists
        shell: bash
        run: |
          if [ -z "$SHARPAPI_KEY" ]; then
            echo 'SharpAPI secret unavailable: check SHARPAPI_KEY or SHARPAPIKEY in repository Actions secrets.' >&2
            exit 1
          fi
      - name: Collect research odds
        run: python collector.py --output-dir snapshots --max-pages 4
      - name: Supreme Validation — enforce research intake quarantine
        run: |
          snapshot=$(find snapshots -maxdepth 1 -name 'sharpapi_dk_*.jsonl' | sort | tail -n 1)
          test -n "$snapshot"
          # ESPN schedule is independent of the odds aggregator, but not a
          # verified sportsbook price, lineup, or betting forecast.
          python challenger_schedule_crosswalk.py --odds "$snapshot" --outdir validation_output
          python challenger_audit.py --input "$snapshot" --schedule validation_output/schedule_manifest.json --output-dir validation_output
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("validation_output/report.json").read_text())
          assert report["observations"] == report["staged_for_research_only"] + report["quarantined"]
          assert report["independent_schedule_events_available"] >= 0
          assert report["bet_ready_selections"] == 0
          assert report["certified_challenger_predictions"] == 0
          assert report["certified_champion_001_predictions"] == 0
          assert report["automated_bets_placed"] == 0
          # No verified roster feed is connected: no prop can be cleared.
          assert report["independently_reviewed_roster_entries_available"] == 0
          assert report["roster_refresh_automated"] is False
          assert report["independently_reviewed_game_day_status_entries"] == 0
          assert report["game_day_status_sync_automated"] is False
          PY
      - name: Fetch official roster, injury and lineup evidence (not bet-ready)
        if: always()
        run: |
          python official_source_refresh.py --outdir official_sources
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("official_sources/source_refresh_report.json").read_text())
          assert report["player_props_cleared"] == 0
          assert report["model_probabilities_generated"] == 0
          assert report["champion_001_modified"] is False
          PY
      - name: Upload research artifacts (not to public GitHub source)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sharpapi-pregame-${{ github.run_id }}
          path: |
            snapshots/
            validation_output/
            official_sources/
          retention-days: 30
          if-no-files-found: warn

name: Collect SharpAPI DraftKings pregame odds
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/collect-sharpapi.yml'
  schedule:
    - cron: '0 16,20,23 * * *'  # UTC; times shift with Eastern daylight saving
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    env:
      SHARPAPI_KEY: ${{ secrets.SHARPAPI_KEY || secrets.SHARPAPIKEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Offline fixture tests
        run: python -m unittest discover -s tests -v
      - name: Confirm secret exists
        shell: bash
        run: |
          if [ -z "$SHARPAPI_KEY" ]; then
            echo 'SharpAPI secret unavailable: check SHARPAPI_KEY or SHARPAPIKEY in repository Actions secrets.' >&2
            exit 1
          fi
      - name: Collect research odds
        run: python collector.py --output-dir snapshots --max-pages 4
      - name: Upload research artifacts (not to public GitHub source)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sharpapi-pregame-${{ github.run_id }}
          path: snapshots/
          retention-days: 30
          if-no-files-found: warn

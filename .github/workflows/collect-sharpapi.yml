name: Collect SharpAPI DraftKings pregame odds
on:
  workflow_dispatch:
  schedule:
    - cron: '0 16,20,23 * * *'  # UTC; times shift with Eastern daylight saving
# Prevent overlapping live API collection; code pushes are covered by offline CI.
concurrency:
  group: sharpapi-odds-api
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    env:
      SHARPAPI_KEY: ${{ secrets.SHARPAPI_KEY || secrets.SHARPAPIKEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Offline fixture tests
        run: python -m unittest discover -s tests -v
      - name: Confirm secret exists
        shell: bash
        run: |
          if [ -z "$SHARPAPI_KEY" ]; then
            echo 'SharpAPI secret unavailable: check SHARPAPI_KEY or SHARPAPIKEY in repository Actions secrets.' >&2
            exit 1
          fi
      - name: Collect research odds
        run: python collector.py --output-dir snapshots --max-pages 4
      - name: Archive immediate prospective capture before downstream audits
        shell: bash
        run: |
          set -euo pipefail
          snapshot="$(find snapshots -maxdepth 1 -name 'sharpapi_dk_*.jsonl' | sort | tail -n 1)"
          test -n "$snapshot"
          python challenger_prospective_pregame.py --sharp-jsonl "$snapshot" --output-dir immediate_prospective
      - name: Upload immediate prospective research evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sharpapi-immediate-${{ github.run_id }}
          path: immediate_prospective/
          retention-days: 30
          if-no-files-found: warn
      - name: Supreme Validation — enforce research intake quarantine
        run: |
          snapshot=$(find snapshots -maxdepth 1 -name 'sharpapi_dk_*.jsonl' | sort | tail -n 1)
          test -n "$snapshot"
          # ESPN schedule is independent of the odds aggregator, but not a
          # verified sportsbook price, lineup, or betting forecast.
          python challenger_schedule_crosswalk.py --odds "$snapshot" --outdir validation_output
          python challenger_audit.py --input "$snapshot" --schedule validation_output/schedule_manifest.json --output-dir validation_output
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("validation_output/report.json").read_text())
          assert report["observations"] == report["staged_for_research_only"] + report["quarantined"]
          assert report["independent_schedule_events_available"] >= 0
          assert report["bet_ready_selections"] == 0
          assert report["certified_challenger_predictions"] == 0
          assert report["certified_champion_001_predictions"] == 0
          assert report["automated_bets_placed"] == 0
          # No verified roster feed is connected: no prop can be cleared.
          assert report["independently_reviewed_roster_entries_available"] == 0
          assert report["roster_refresh_automated"] is False
          assert report["independently_reviewed_game_day_status_entries"] == 0
          assert report["game_day_status_sync_automated"] is False
          PY
      - name: Verify SharpAPI research-stage quotes with fail-closed slip preflight
        shell: bash
        run: |
          set -euo pipefail
          python challenger_ticket_preflight.py --staged validation_output/research_only.jsonl --validation validation_output/report.json --output validation_output/ticket_preflight_report.json
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('validation_output/ticket_preflight_report.json').read_text())
          assert r['decision'] == 'PASS_NO_VERIFIED_EDGE'
          assert r['champion_001_modified'] is False
          assert r['bet_ready_selections'] == r['automated_bets_placed'] == 0
          assert r['certified_champion_001_predictions'] == r['certified_challenger_001_predictions'] == 0
          PY
      - name: Corroborate quarantined NBA time differences with NBA official CDN
        run: |
          python challenger_nba_schedule_clock.py --schedule-manifest validation_output/schedule_manifest.json --output validation_output/nba_clock_diagnostic.json
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("validation_output/nba_clock_diagnostic.json").read_text())
          assert r["near_time_mismatches_promoted"] == 0
          assert r["bet_ready_selections"] == r["automated_bets_placed"] == 0
          assert r["certified_champion_001_predictions"] == 0
          assert r["champion_001_modified"] is False
          PY
      - name: Probe SportsDataIO NBA schedule entitlement (research-only, optional)
        env:
          SPORTSDATAIO_API_KEY: ${{ secrets.SPORTSDATAIO_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$SPORTSDATAIO_API_KEY" ]; then
            echo 'SportsDataIO NBA schedule probe skipped: SPORTSDATAIO_API_KEY not configured.'
          else
            python challenger_sportsdataio_nba_schedule.py --schedule-manifest validation_output/schedule_manifest.json --output validation_output/sportsdataio_nba_diagnostic.json
            python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('validation_output/sportsdataio_nba_diagnostic.json').read_text())
          assert r['near_time_mismatches_promoted'] == 0
          assert r['bet_ready_selections'] == r['automated_bets_placed'] == 0
          assert r['certified_champion_001_predictions'] == 0
          assert r['champion_001_modified'] is False
          PY
          fi
      - name: Explain remaining league-level quote rejection causes
        run: |
          snapshot=$(find snapshots -maxdepth 1 -name 'sharpapi_dk_*.jsonl' | sort | tail -n 1)
          python challenger_gate_diagnostics.py --raw "$snapshot" --audit-dir validation_output --output validation_output/quality_diagnostics.json
      - name: Archive paired full-game moneyline market reference (no model probabilities)
        shell: bash
        run: |
          set -euo pipefail
          snapshot=$(find snapshots -maxdepth 1 -name 'sharpapi_dk_*.jsonl' | sort | tail -n 1)
          test -n "$snapshot"
          python challenger_moneyline_market_baseline.py --odds "$snapshot" --validation validation_output/report.json --output-dir validation_output
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("validation_output/moneyline_market_baseline_report.json").read_text())
          assert r["market_implied_not_model_generated"] is True
          assert r["independently_verified_checkout_prices"] == 0
          assert r["certified_champion_001_predictions"] == r["certified_challenger_001_predictions"] == 0
          assert r["positive_ev_candidates_certified"] == r["bet_ready_selections"] == r["automated_bets_placed"] == 0
          assert r["champion_001_modified"] is False
          PY
      - name: Archive chronological moneyline movement timing (research-only)
        shell: bash
        run: |
          set -euo pipefail
          python challenger_line_movement_timing.py --odds snapshots/sharpapi_dk_*.jsonl --output-dir validation_output
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("validation_output/line_movement_timing_report.json").read_text())
          assert r["champion_001_modified"] is False
          assert r["certified_champion_001_predictions"] == r["certified_challenger_001_predictions"] == 0
          assert r["bet_ready_selections"] == r["automated_bets_placed"] == 0
          PY
      - name: Fetch official roster, injury and lineup evidence (not bet-ready)
        if: always()
        run: |
          python official_source_refresh.py --outdir official_sources
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("official_sources/source_refresh_report.json").read_text())
          assert report["player_props_cleared"] == 0
          assert report["model_probabilities_generated"] == 0
          assert report["champion_001_modified"] is False
          PY
      - name: Upload research artifacts (not to public GitHub source)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sharpapi-pregame-${{ github.run_id }}
          path: |
            snapshots/
            validation_output/
            official_sources/
          retention-days: 30
          if-no-files-found: warn
